<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>판타지 주점 · 자동 검투 경기</title>
  <link rel="stylesheet" href="arena.css">
</head>
<body>
<main id="arena" aria-label="격투장 화면 테스트">
  <div class="backdrop"></div><div class="shade"></div>
  <div class="fighter left" id="left"><img src="assets/elf-idle.png" alt="실비아" draggable="false"></div>
  <div class="fighter right" id="right"><img src="assets/darkelf-idle.png" alt="니샤" draggable="false"></div>
  <canvas id="effects" width="1280" height="720"></canvas><div id="flash"></div>
  <header class="hud">
    <div class="portrait red"><img class="face" src="assets/elf-face.png" alt=""><img class="frame" src="assets/frame-red.png" alt=""></div>
    <div class="vitals left-vitals"><div class="bar hp"><img src="assets/hp-empty.png" alt=""><img class="fill" id="left-hp" src="assets/hp-full.png" alt="체력"></div><div class="bar mp"><img src="assets/mp-empty.png" alt=""><img class="fill" id="left-mp" src="assets/mp-full.png" alt="마나"></div></div>
    <div class="timer"><img src="assets/clock.png" alt=""><span id="time">60</span></div>
    <div class="vitals right-vitals"><div class="bar hp"><img src="assets/hp-empty.png" alt=""><img class="fill" id="right-hp" src="assets/hp-full.png" alt="체력"></div><div class="bar mp"><img src="assets/mp-empty.png" alt=""><img class="fill" id="right-mp" src="assets/mp-full.png" alt="마나"></div></div>
    <div class="portrait blue"><img class="face" src="assets/darkelf-face.png" alt=""><img class="frame" src="assets/frame-blue.png" alt=""></div>
  </header>
  <img id="callout" src="assets/fight.png" alt="FIGHT">
  <button id="start" aria-label="경기 시작"><img src="assets/fight.png" alt="FIGHT"></button>
  <div id="cutin" hidden><div class="cutin-rays"></div><img src="assets/darkelf-magic.png" alt="필살기 컷인"></div>
  <img id="curtain" src="assets/curtain-frame-0.png" alt="닫힌 커튼" hidden>
  <div id="combo" hidden><img src="assets/vs.png" alt=""><span>3 HIT</span></div>
  <nav class="utility" aria-label="화면 설정"><button id="sound" aria-label="효과음 끄기" aria-pressed="false"><img src="assets/settings.png" alt=""></button><button id="pause" aria-label="일시정지" aria-pressed="false"><img src="assets/pause.png" alt=""></button><button id="fullscreen" aria-label="전체화면"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18 8H8v10M30 8h10v10M8 30v10h10M40 30v10H30" fill="none" stroke="currentColor" stroke-width="4"/></svg></button><button id="reset" aria-label="다시 시작">↻</button></nav>
  <div id="paused" hidden>Ⅱ</div>
</main>
<script src="../bridge.js"></script><script src="arena-data.js"></script><script src="arena-auto-engine.js"></script><script src="arena.js"></script>
<script src="arpg-host.js"></script></body></html>
