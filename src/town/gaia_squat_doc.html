<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>스쿼트</title><style>

</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><div id="tier"></div><div id="score">0</div><div id="combo"></div></div>
<div id="count"></div><div id="mile"></div>

<script>
'use strict';
const CFG=/*LIFE_CONFIG*/;

const TIER=Math.max(1,Math.min(3,+SQ.difficulty||1));

const PER=60/RULE.bpm,FW=275,FH=456,FRAMES=12,COLS=6;
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(1.75,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);g.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const img={bg:null,f:null,b:null,ball:null,floor:null,fx:null};
function loadImg(src){return new Promise(ok=>{if(!src)return ok(null);const i=new Image();i.onload=()=>{(i.decode?i.decode():Promise.resolve()).catch(()=>{}).then(()=>ok(i));};i.onerror=()=>ok(null);i.src=src;});}

/* 기구·받침대·링·캐릭터 배치: 부모(GAIA.minigame.layout.squat)의 상수를 읽는다 */
function DV(){let d={};d=window.GAIA_SQ_LAYOUT||{};return {ds:d.ds??.5,dy:d.dy??0,sh:d.sh??72,ss:d.ss??1.5,rs:d.rs??1,ry:d.ry??0,cs:d.cs??1,cy:d.cy??0};}
function geom(s,floorY){const D=DV(),asp=img.ball?img.ball.width/img.ball.height:1,oh0=125.4*s,ow0=oh0*asp,oh=oh0*D.ds,ow=ow0*D.ds,base=floorY+4*s,standTop=base-D.sh*s,oy=standTop+D.dy*s;return {oh,ow,oy,base,standTop,standH:D.sh*s,ss:D.ss,rcy:oy-oh/2+D.ry*s,rhw:ow0/2*D.rs,rhh:oh0/2*D.rs};}
const FRAC=[((+SQ.fb||6)+.5)/FRAMES,((+SQ.bb||6)+.5)/FRAMES];
/* ---------- audio ---------- */
const SRC=window.GAIA_SOUND_SOURCES||{};
const PERFECTS=['perfect_01','perfect_02','perfect_03','perfect_04','perfect_05','perfect_06','perfect_07'];let lastPerfect=-1;
let ac=null,master=null,bufs={},bed=null,sched=[],t0=0;
function soundOn(){return true;}
function volume(){return .8;}
function ensureAC(){if(ac)return ac;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C({latencyHint:'interactive'});const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=6;master=ac.createGain();master.gain.value=soundOn()?volume():0;master.connect(comp);comp.connect(ac.destination);return ac;}

const decoded={};
async function prep(names){await Promise.all(names.map(async n=>{decoded[n]=await buf(n);}));}
function shot(name,when,vol){const b=decoded[name];if(!b||!ac)return null;try{const s=ac.createBufferSource(),gn=ac.createGain();s.buffer=b;gn.gain.value=vol*(window.GAIA_SQ_SFX??1);s.connect(gn).connect(master);s.start(Math.max(when,ac.currentTime));sched.push(s);s.onended=()=>{const i=sched.indexOf(s);if(i>=0)sched.splice(i,1);try{s.disconnect();gn.disconnect();}catch{}};return s;}catch{return null;}}

function voice(name,vol){const now=performance.now();if(now-lastVoice<320)return;lastVoice=now;shot(name,0,vol);}
function stopAll(){for(const s of sched.splice(0)){try{s.onended=null;s.stop();}catch{}}if(bed){try{bed.stop();}catch{}bed=null;}}
const slaps=[],ripples=[];
function slap(c){slaps.push({c,t:performance.now()});if(ac)shot('hit_punch',ac.currentTime+.13,.7);}
function showCombo(){const el=$('#combo');if(combo>=3){el.textContent=combo+' 콤보';el.style.color=combo>=20?'#9ff0ff':combo>=10?'#ffe27a':'#ffd7ea';el.classList.remove('cp');void el.offsetWidth;el.classList.add('cp');if(combo%10===0){const m=$('#mile');m.textContent=combo+' 콤보!';m.classList.remove('mp');void m.offsetWidth;m.classList.add('mp');}}else el.textContent='';}
let SYNC=0;try{SYNC=+localStorage.getItem('squat-sync')||0;}catch{}
const INPUT=.05;
const latency=()=>(ac?(ac.outputLatency||ac.baseLatency||0):0)+.02;
const gt=()=>ac?ac.currentTime-latency()-SYNC:0;
/* ---------- plan ---------- */
function rngMaker(seed){let x=seed>>>0||1;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296;};}
const M=[
 [[0,0,2],[1,2,2]],[[1,0,2],[0,2,2]],[[0,0,2],[0,2,2]],[[1,0,2],[1,2,2]],
 [[0,0,1],[0,1,1],[1,2,2]],[[1,0,1],[1,1,1],[0,2,2]]
];
const MS=[
 [[0,0,2],[1,0,2],[0,2,2],[1,2,2]],
 [[0,0,2],[1,0,2],[0,2,1],[1,3,1]],
 [[0,0,1],[1,1,1],[0,2,1],[1,3,1]]
];
function validAdd(evs,add){for(const a of add)for(const e of evs){if(e.c!==a.c)continue;const need=(e.len+a.len)/2;if(Math.abs(e.beat-a.beat)<need-1e-6)return false;}return true;}
function makePlan(){const r=rngMaker((Date.now()&0xffff)+TIER*977),evs=[];let last=-1,run=0;
 for(let b=0;b<RULE.beats;b++){const beat=RULE.lead+b;
  if(b>=4&&r()<RULE.both){evs.push({c:0,beat,len:1},{c:1,beat,len:1});last=-1;run=0;continue;}
  let c=r()<.5?0:1;if(c===last&&run>=2)c=1-c;run=c===last?run+1:1;last=c;evs.push({c,beat,len:1});}
 return evs;}
/* ---------- state ---------- */
let state='ready',events=[],score=0,combo=0,best=0,strays=0,counts={perfect:0,good:0,miss:0},pops=[],parts=[],paused=false,endAt=0,reported=false;
const X=[.27,.73],pos=[X[0]*1,X[1]*1],target=[X[0],X[1]];
let LAND=false,LK=1;function sx(f){return(LAND?.5+(f-.5)*LK:f)*W;}
const shake=[0,0],squash=[0,0];
const beatT=i=>t0+RULE.off+PER*(i+1);
function layoutPlan(){let nextSwap=RULE.lead+4;const arr=[];const r=rngMaker(Date.now()&0xffffff);
 for(let b=nextSwap;b<RULE.beats+RULE.lead;b+=4){if(r()<RULE.swap){let sp=TIER===3?[[.27,.73],[.73,.27],[.4,.6],[.6,.4],[.5,.5]][Math.floor(r()*5)]:[[.27,.73],[.73,.27]][Math.floor(r()*2)];arr.push({beat:b-1.2,x:sp});}}
 return arr;}
let moves=[];
async function begin(){
 events=makePlan().map(e=>({...e,res:null}));moves=layoutPlan();
 score=0;combo=0;best=0;strays=0;counts={perfect:0,good:0,miss:0};pops=[];parts=[];reported=false;slaps.length=0;ripples.length=0;
 target[0]=pos[0]=X[0];target[1]=pos[1]=X[1];
 $('#score').textContent='0';$('#combo').textContent='';
 ensureAC();await ac.resume().catch(()=>{});
 const names=[RULE.key,RULE.bgm,...PERFECTS,'hit_punch','reaction_happy','reaction_surprise','reaction_whine','reaction_displeased'];
 await Promise.all([ready,fxReady,prep(names)]);warm();
 stopAll();
 t0=ac.currentTime+.25;
 if(decoded[RULE.bgm]){try{const s=ac.createBufferSource(),gn=ac.createGain();s.buffer=decoded[RULE.bgm];s.loop=true;gn.gain.value=(RULE.bgmg||1)*2*(window.GAIA_SQ_BGM??1); /* BGM만 +6.02 dB (진폭 2배), 박자·효과음 유지 */s.connect(gn).connect(master);s.start(t0);sched.push(s);}catch{}}
 if(decoded[RULE.key]){try{const s=ac.createBufferSource(),gn=ac.createGain();s.buffer=decoded[RULE.key];s.loop=true;gn.gain.value=.62*(window.GAIA_SQ_SFX??1);s.connect(gn).connect(master);s.start(t0);bed=s;}catch{}}
 for(const e of events)e.time=beatT(e.beat);
 state='play';paused=false;$('#veil').hidden=true;$('#tier').textContent='스쿼트 · '+RULE.name;
}
function judge(res,e,err){e.res=res;counts[res]++;try{parent.GAIA_HAPTICS&&parent.GAIA_HAPTICS.fx[res==='perfect'?'miniPerfect':res==='good'?'miniGood':'miniMiss']();}catch(x){}ripples.push({c:e.c,t:performance.now(),kind:res==='perfect'?2:res==='good'?1:0});
 if(res==='miss'){combo=0;pops.push({c:e.c,t:performance.now(),text:'앗…',col:'#c9c2ff'});voice('reaction_whine',.55);shake[e.c]=.35;slap(e.c);}
 else{combo++;best=Math.max(best,combo);score+=res==='perfect'?100:60;squash[e.c]=1;
  pops.push({c:e.c,t:performance.now(),text:res==='perfect'?'완벽!':(err<0?'좋아요 · 빨랐어요':'좋아요 · 늦었어요'),col:res==='perfect'?'#ffe27a':'#ffd0e6'});
  if(res==='perfect'){{let i;do{i=Math.floor(Math.random()*PERFECTS.length);}while(i===lastPerfect&&PERFECTS.length>1);lastPerfect=i;voice(PERFECTS[i],.55);}for(let i=0;i<9;i++)parts.push({c:e.c,x:0,y:0,vx:(Math.random()-.5)*240,vy:-120-Math.random()*160,life:0,ttl:.7+Math.random()*.4,ch:i%3?'♥':'✦'});}
  else voice('reaction_surprise',.55);}
 $('#score').textContent=Math.max(0,score-strays*12);showCombo();}
function tap(c){if(state!=='play'||paused)return;const t=gt()-INPUT;let hit=null;
 for(const e of events){if(e.c!==c||e.res)continue;const d=Math.abs(t-e.time);if(d<=RULE.good&&(!hit||d<hit.d))hit={e,d};}
 if(!hit){strays++;combo=0;shake[c]=.2;slap(c);$('#score').textContent=Math.max(0,score-strays*12);showCombo();return;}
 judge(hit.d<=RULE.perfect?'perfect':'good',hit.e,t-hit.e.time);}
const LABEL=[['앞모습','정면'],['뒷모습','후면']];
function mapC(i){const lf=target[0]<=target[1]?0:1;return i===0?lf:1-lf;}
let padMap=-1;function updatePads(){const m=mapC(0);if(m===padMap)return;padMap=m;for(const i of [0,1]){const c=mapC(i),b=document.getElementById('pad'+i);b.innerHTML=LABEL[c][0]+'<small>'+LABEL[c][1]+'</small>';b.dataset.ch=c;}}
for(const b of document.querySelectorAll('.pad')){const i=+b.dataset.i;b.addEventListener('pointerdown',ev=>{ev.preventDefault();b.classList.add('on');tap(mapC(i));});const off=()=>b.classList.remove('on');b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);}
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a')tap(mapC(0));if(e.key==='ArrowRight'||e.key==='d')tap(mapC(1));if(e.key==='f')tap(0);if(e.key==='b')tap(1);});
/* ---------- drawing ---------- */
function frameOf(c,t){let best=null;
 for(const e of events){if(e.c!==c)continue;const len=PER*e.len,start=e.time-FRAC[c]*len,ph=(t-start)/len;if(ph>=0&&ph<1){const d=Math.abs(t-e.time);if(!best||d<best.d)best={d,ph};}}
 return best?Math.min(FRAMES-1,Math.floor(best.ph*FRAMES)):0;}
const bgc=document.createElement('canvas'),bgg=bgc.getContext('2d');let bgKey='';
function renderBack(floorY,s){bgc.width=cv.width;bgc.height=cv.height;bgg.setTransform(DPR,0,0,DPR,0,0);
 {const B=(LAND&&img.bgL)?img.bgL:img.bg;if(B){const s=Math.max(W/B.width,H/B.height);bgg.drawImage(B,(W-B.width*s)/2,(H-B.height*s)/2,B.width*s,B.height*s);}else{bgg.fillStyle='#3a2c40';bgg.fillRect(0,0,W,H);}}if(1){}else{bgg.fillStyle='#3a2c40';bgg.fillRect(0,0,W,H);}
 if(!SQ.noFloor){const fy=floorY-40*s;if(img.floor){const sc=Math.max(W/img.floor.width,(H-fy)/img.floor.height),dw=img.floor.width*sc,dh=img.floor.height*sc;bgg.save();bgg.beginPath();bgg.rect(0,fy,W,H-fy);bgg.clip();bgg.drawImage(img.floor,(W-dw)/2,fy,dw,dh);bgg.restore();}else{const gr=bgg.createLinearGradient(0,fy,0,H);gr.addColorStop(0,'#5b3e2b');gr.addColorStop(1,'#2e1e15');bgg.fillStyle=gr;bgg.fillRect(0,fy,W,H-fy);bgg.fillStyle='rgba(255,225,190,.16)';bgg.fillRect(0,fy,W,2);}}
}
function warm(){const L=[img.f,img.b,img.ball,img.floor,img.bg].concat(img.fx?[img.fx.ph,img.fx.pp,img.fx.fs,img.fx.fo]:[]);g.save();g.globalAlpha=.01;for(const m of L){if(m)g.drawImage(m,0,0,Math.min(m.width,64),Math.min(m.height,64));}g.restore();}
function draw(now){
 const t=state==='play'?gt():(ac?gt():0);
 g.clearRect(0,0,W,H);
 
 updatePads();
 const land=W>H*1.15,floorY=land?H*.78:H*.66,s=land?Math.min(W*.34/FW,(H*.78-44)/450):Math.min(W*.46/FW,H*.4/FH);LAND=land;LK=land?Math.min(1,(FW*s+.05*W)/W/.46):1;
 {const key=W+'x'+H+'x'+DPR+'|'+Math.round(floorY)+'|'+(img.bg?1:0)+(img.floor?1:0)+(img.bgL?1:0)+(LAND?'L':'P');if(bgKey!==key){bgKey=key;renderBack(floorY,s);}g.drawImage(bgc,0,0,W,H);}
 // lead-in count & beat pulse

  for(const m of moves){if(!m.done&&bi>=m.beat){m.done=true;target[0]=m.x[0];target[1]=m.x[1];}}
  const cn=$('#count');if(bi>=0&&bi<RULE.lead+.9){const k=Math.floor(bi),ph=bi-k;let txt='';if(bi>=RULE.lead)txt='GO';else if(k>=1)txt=String(RULE.lead-k);cn.textContent=txt;cn.style.opacity=txt?String(Math.max(0,1-ph*.9)):'0';cn.style.transform='scale('+(1+ph*.22)+')';}else cn.style.opacity='0';
  for(const e of events){if(!e.res&&t>e.time+RULE.good)judge('miss',e);}
  if(!reported&&events.length&&events.every(e=>e.res)&&t>events[events.length-1].time+.9)finish();
 }
 for(let c=0;c<2;c++)pos[c]+=(target[c]-pos[c])*Math.min(1,.12);
 const order=[0,1].sort((a,b)=>pos[a]-pos[b]);
 for(const c of order){
  const x=sx(pos[c])+(shake[c]>0?Math.sin(now/22)*shake[c]*10:0);
