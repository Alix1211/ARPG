name: town-build-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/town/**'
      - '.github/workflows/town-build-check.yml'
concurrency:
  group: town-build-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            src/town/.enc_cache
            src/town/.ground_cache.png
            src/town/.ground_out_cache.png
          key: town-build-${{ runner.os }}-${{ hashFiles('src/town/build.py', 'src/town/outmap.py', 'assets/**') }}
          restore-keys: |
            town-build-${{ runner.os }}-
      - run: pip install pillow numpy scipy playwright
      - run: python -m playwright install --with-deps chromium
      - run: python src/town/build.py
      - run: python src/town/check_tier_match.py
      - run: python src/town/check.py
      - run: python src/town/check2.py
      - run: python src/town/check_walk.py
      - run: python src/town/check_move_atk.py
      - run: python src/town/check_control.py
      - run: python src/town/check_combat.py
      - run: python src/town/check_camp.py
      - run: python src/town/check_pause.py
      - run: python src/town/check_vfx.py
      - run: python src/town/check_equipcmp.py
      - run: python src/town/check_skills.py
      - run: python src/town/check_skill.py
      - run: python src/town/check_growth.py
      - run: python src/town/check_pot.py
      - run: python src/town/check_save.py
      - run: python src/town/check_resume.py
      - run: python src/town/check_field.py
      - run: python src/town/check_trade.py
      - run: python src/town/check_guild.py
      - run: python src/town/check_dungeon.py
      - run: python src/town/check_chest.py
      - name: Publish built town.html
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- game/)" ]; then
            echo "town.html unchanged"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved during build; skip publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A game/
          git commit -m "빌드: town.html 최신화"
          git push origin HEAD:main
