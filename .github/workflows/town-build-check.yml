name: town-build-check
on:
  push:
    branches: [main]
    paths:
      - 'src/town/**'
      - '.github/workflows/town-build-check.yml'
permissions:
  contents: read
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            src/town/.enc_cache
            src/town/.ground_cache.png
            src/town/.ground_out_cache.png
          key: town-build-${{ runner.os }}-${{ hashFiles('src/town/build.py', 'src/town/outmap.py', 'assets/**') }}
          restore-keys: |
            town-build-${{ runner.os }}-
      - run: pip install pillow numpy scipy playwright
      - run: python -m playwright install --with-deps chromium
      - run: python src/town/build.py
      - run: python src/town/check.py
      - run: python src/town/check2.py
      - run: python src/town/check_walk.py
      - run: python src/town/check_move_atk.py
      - run: python src/town/check_skill.py
      - run: python src/town/check_pot.py
      - run: python src/town/check_field.py
      - run: python src/town/check_dungeon.py
      - run: python src/town/check_chest.py
