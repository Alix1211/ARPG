name: 앱 만들기 (APK)
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: arpg-apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: 앱 만들기
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: 받기 페이지에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 골드 퀘스트 사가 앱 (최신)
          body: 이 페이지의 arpg.apk 를 폰·패드에서 눌러 받아 설치하세요. 다음부터는 지우지 말고 덮어 설치하면 저장이 그대로 남습니다. 게임 내용은 앱을 켤 때 자동으로 최신이 됩니다.
          make_latest: true
          files: android/app/build/outputs/apk/debug/arpg.apk
