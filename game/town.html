<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>마을 시험판</title>
<style>
:root{--ink:#3b2412;--paper:#f3e6c8;--gold:#c9923e;--red:#9e2a22}
html,body{margin:0;height:100%;background:#1d1510;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none}
#tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;display:none;min-width:150px;height:46px;padding:0 26px;background:center/100% 100% no-repeat;color:#fff4d8;font-weight:800;font-size:15px;line-height:44px;text-align:center;white-space:nowrap;text-shadow:0 1px 2px #000}

.pan{position:fixed;display:none;z-index:5}
.pan.on{display:block}
.frame{border:34px solid transparent;border-image:var(--panel) 62 fill stretch;color:var(--ink)}
#msg{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,80vw);text-align:center;font-size:15px;line-height:1.6;padding:0}
#msg b{display:block;font-size:19px;margin-bottom:6px}
.btn{border:2px solid #b07a35;background:linear-gradient(#7a4422,#552c12);color:#f8ebcf;border-radius:9px;padding:7px 20px;font-weight:800;font-size:15px;font-family:inherit;box-shadow:0 2px 0 #2c160a}
.btn:disabled{opacity:.45}
.btn.ghost{background:#efe0bd;color:var(--ink)}
#dlg{left:50%;bottom:10px;transform:translateX(-50%);width:min(760px,92vw);display:none}
#dlg.on{display:flex;align-items:flex-end;gap:0}
#dlgImg{height:min(250px,56vh);margin-right:-18px;position:relative;z-index:2;filter:drop-shadow(0 4px 6px #0007)}
#dlg .frame{flex:1;min-height:120px;position:relative}
#dlgName{position:absolute;left:-6px;top:-58px;min-width:120px;height:44px;padding:0 24px;background:var(--banner) center/100% 100% no-repeat;color:#fff4d8;font-weight:900;font-size:17px;line-height:42px;text-align:center;text-shadow:0 1px 2px #000}
#dlgTitle{font-size:12px;color:#8a5a2a;font-weight:800}
#dlgLine{font-size:17px;line-height:1.55;margin:4px 0 10px;font-weight:600}
.row{display:flex;gap:8px;justify-content:flex-end}
#shop{left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);display:none}
#shop.on{display:flex;align-items:flex-end}
#shopImg{height:min(300px,62vh);margin-right:-24px;position:relative;z-index:2;filter:drop-shadow(0 4px 6px #0007)}
#shop .frame{flex:1;display:grid;grid-template-columns:1fr 190px;gap:10px;max-height:82vh}
#shopHead{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:18px}
#shopHead small{font-size:14px;color:#8a5a2a}
#shopTabs{display:flex;gap:5px;margin-left:auto;margin-right:10px}
#shopTabs .btn{padding:3px 12px;font-size:12px;opacity:.48}
#shopTabs .btn.on{opacity:1;box-shadow:inset 0 0 0 2px #f0c469,0 2px 0 #2c160a}
#shopMarket{grid-column:1/3;font-size:11px;color:#7a5a32;margin-top:-6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;align-content:start;overflow:auto;max-height:52vh}
.cell{position:relative;aspect-ratio:1;border:0;padding:6px;background:var(--slot) center/100% 100% no-repeat}
.cell.sel{background-image:var(--slotOn)}
.cell img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px #0006)}
.cell span{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:900;color:#ffe08a;text-shadow:0 1px 2px #000,0 0 2px #000}
#info{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
#infoIc{width:84px;height:84px;object-fit:contain;padding:8px;background:var(--slot) center/100% 100% no-repeat}
#infoName{font-weight:900;font-size:16px}
#infoSlot{font-size:12px;color:#6b5b45}
#infoPrice{font-weight:900;color:#8a5a0a}
#shopSay{font-size:12px;color:#7a3b1a;min-height:32px;line-height:1.35}

#guild{left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:86vh;display:none;overflow:auto}
#guild.on{display:block}
#guildHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-right:52px;position:relative}
#guildHead b{font-size:20px}#guildHead small{color:#8a5a2a;font-weight:800}
#guildClose{position:absolute;right:-10px;top:-12px;width:48px;height:48px;border:0;background:var(--x) center/100% 100% no-repeat;filter:drop-shadow(0 2px 3px #0008);z-index:3}
#gActive,#gBoard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.gq{border:2px solid #b69055;background:#f3e5c8cc;border-radius:10px;padding:9px;color:var(--ink);min-height:98px}
.gq.done{box-shadow:inset 0 0 0 2px #d39b24}
.gq b{display:block;font-size:14px;margin-bottom:3px}.gq small{display:block;color:#745a38;line-height:1.35}
.gprog{font-size:12px;font-weight:900;color:#7a3b1a;margin:6px 0}
.gq .btn{font-size:12px;padding:4px 10px}
.gsect{font-size:13px;font-weight:900;color:#6b3d18;margin-top:4px}
#bubble{position:fixed;transform:translate(-50%,-100%);display:none;pointer-events:none;background:#fff8e6;color:var(--ink);border:2px solid #b07a35;border-radius:12px;padding:4px 10px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px #0006}
#char{position:fixed;inset:0;background:#120b06b0;display:none;z-index:8}
#char.on{display:block}
#charWrap{position:absolute;left:50%;top:50%;width:1078px;height:659px;transform-origin:center}
#tabs{position:absolute;left:0;top:0;display:flex;gap:6px}
#tabs button{width:76px;height:62px;border:0;padding:0;background:center/100% 100% no-repeat;opacity:.55;filter:drop-shadow(0 2px 3px #0008)}
#tabs button.on{opacity:1;transform:translateY(2px)}
#tabs b{position:absolute;margin-top:62px;width:76px;text-align:center;color:#f3e6c8;font-size:15px;font-weight:900;text-shadow:0 1px 2px #000}
#charClose{position:absolute;right:-6px;top:0;width:58px;height:58px;border:0;padding:0;background:var(--x) center/100% 100% no-repeat;filter:drop-shadow(0 2px 3px #0008)}
#leftPane,#bagPane{position:absolute;top:64px;background:center/100% 100% no-repeat}
#leftPane{left:0}
#bagPane{right:0;width:608px;height:595px}
.slot{position:absolute;border:0;padding:6px;background:transparent;border-radius:10px}
.slot img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px #0008)}
.slot.has{box-shadow:inset 0 0 0 2px var(--rc),0 0 8px -2px var(--rc)}
.slot.sel{box-shadow:inset 0 0 0 3px #ffe08a,0 0 12px #ffd34d}
.slab{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:900;color:#f6e7c6;background:#2a160bcc;border-radius:6px;padding:0 5px}
.slab.hide{display:none}
.held{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:#9e2a22;color:#fff;font-size:11px;font-weight:900;border-radius:7px;padding:0 6px;white-space:nowrap}
.off{position:absolute;background:#1a0f08a0;border-radius:10px}
.fig{position:absolute;left:176px;top:118px;width:134px;height:322px;object-fit:contain;filter:drop-shadow(0 4px 4px #0006)}
.sface{position:absolute;left:52px;top:110px;width:80px;height:80px;border-radius:50%;object-fit:cover;background:#e8d6b0}
.sbar{position:absolute;left:176px;width:156px;height:17px;border-radius:8px;background:#3a2614;overflow:hidden}
.sbar i{display:block;height:100%}
.sbar .b0{background:linear-gradient(#ff6a5a,#c0221c)} .sbar .b1{background:linear-gradient(#6ab8ff,#1f5fc4)} .sbar .b2{background:linear-gradient(#ffd56a,#e09a12)}
.sbar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:17px;font-weight:900;color:#fff;text-shadow:0 1px 1px #000}
.srow{position:absolute;left:92px;width:236px;height:36px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.srow b{width:36px;font-size:15px} .srow em{font-style:normal;font-weight:900;font-size:17px;width:28px;text-align:right;color:#7a3b1a} .srow small{font-size:12px;color:#6b5b45;font-weight:700}
.slv{position:absolute;left:0;right:0;top:572px;text-align:center;font-size:13px;font-weight:900;color:#7a3b1a}
.btitle{position:absolute;left:0;right:0;top:40px;text-align:center;color:#fff4d8;font-weight:900;font-size:20px;text-shadow:0 1px 2px #000}
.bgold{position:absolute;left:96px;top:528px;font-weight:900;font-size:15px;color:#7a4a0a}
.bcnt{position:absolute;right:96px;top:528px;font-weight:800;font-size:13px;color:#6b5b45}
#iinfo{position:fixed;display:none;z-index:9;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);width:230px;border:30px solid transparent;border-image:var(--panel) 62 fill stretch;color:var(--ink);text-align:center}
#iinfo.on{display:block}
.iname{font-weight:900;font-size:17px}
.isub{font-size:12px;color:#6b5b45;margin:2px 0 4px}
.iic{width:72px;height:72px;object-fit:contain}
.ist{list-style:none;padding:0;margin:4px 0;font-size:14px;font-weight:700}
.ist .up{color:#2a8a2a} .ist .dn{color:#c0221c}
.icmp{font-size:11px;color:#6b5b45}
.ibtns{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#fade.slow{transition-duration:.55s}
#fade.on{opacity:1}

/* ---- HUD (케인 시안: 좌상단 초상·체력·마나·작은 고리 / 우상단 둥근 미니맵 / 좌하단 조이스틱 / 우하단 큰 공격 버튼 + 스킬 5칸 + 교체) ---- */
#me{left:max(8px,env(safe-area-inset-left));top:6px;display:flex;align-items:flex-start;gap:4px}
#me .ring{position:relative;width:82px;height:88px;flex:none;cursor:pointer;touch-action:manipulation;pointer-events:auto}
#me .ring img{position:absolute;inset:0;width:100%;height:100%}
html.app #fs{display:none}
#me .ring .face{left:13px;top:19px;right:auto;bottom:auto;width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 50%;background:radial-gradient(circle at 50% 40%,#fbeed2,#d9bb8c)}
.bars{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.bar{position:relative;width:166px;aspect-ratio:5.896;background:var(--hpbar) center/100% 100% no-repeat;--l:17.84%;--t:24.44%;--w:75.25%;--h:45.19%}
.bar.mp{background-image:var(--mpbar);aspect-ratio:5.203;--t:30.07%;--w:75.38%;--h:40.52%}
.bar .tr{position:absolute;left:var(--l);width:var(--w);top:var(--t);height:var(--h);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;box-shadow:inset 0 2px 1px #fff5,inset 0 -2px 2px #0004;transition:width .2s}
.bar.hp i{background:linear-gradient(#ff7a6a,#d2291f 60%,#a51a14)}
.bar.mp i{background:linear-gradient(#7cc4ff,#2a6fd6 60%,#1d4fa8)}
.bar span{position:absolute;left:var(--l);width:var(--w);top:var(--t);height:var(--h);display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;text-align:center;color:#fff;font-weight:800;text-shadow:0 1px 1px #000}
.coin{color:#ffe08a;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000,0 0 3px #000;margin-left:30px}
#bagBtn{position:relative;flex:none;margin-top:16px;width:50px;height:50px;border:0;padding:0;border-radius:50%;background:var(--tab0) center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 2px 3px #0009)}
#questTrack{left:max(12px,env(safe-area-inset-left));top:112px;width:286px;display:none;flex-direction:column;gap:4px;pointer-events:none}
#questTrack.on{display:flex}
.qtrack{display:grid;grid-template-columns:17px minmax(0,1fr) auto;align-items:center;gap:5px;min-height:24px;padding:3px 7px;border-radius:7px;background:#171008b8;border:1px solid #8f6a37aa;color:#f6e7c8;font:800 11px/1.2 sans-serif;text-shadow:0 1px 2px #000;box-shadow:0 2px 5px #0005}
.qtrack.done{border-color:#d7b65a;color:#fff0ad}
.qcheck{width:13px;height:13px;border:2px solid #d1a85b;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;background:#26180c}
.qtrack.done .qcheck::after{content:'✓';color:#ffe26f;font-weight:900}
.qtitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qprog{font-size:10px;color:#ffd978;white-space:nowrap}
#mm{right:max(10px,env(safe-area-inset-right));top:8px;width:176px;height:150px;border-radius:50%;border:4px solid #c9923e;box-shadow:0 0 0 3px #4a2a12,inset 0 0 0 2px #e3b35f,0 3px 8px #0009;overflow:hidden;background:#000}
#mm canvas{position:static;width:100%;height:100%}
#place{pointer-events:auto;cursor:pointer;right:max(10px,env(safe-area-inset-right));top:166px;width:190px;text-align:center;color:var(--paper);font-weight:800;font-size:13px;text-shadow:0 1px 2px #000}
#fs{right:max(196px,calc(env(safe-area-inset-right) + 196px));top:10px;pointer-events:auto;border:2px solid #b07a35;background:#2c160acc;color:#f3e6c8;border-radius:8px;font-size:12px;font-weight:700;padding:5px 8px}
#snd{right:max(196px,calc(env(safe-area-inset-right) + 196px));top:44px;pointer-events:auto;border:2px solid #b07a35;background:#2c160acc;color:#f3e6c8;border-radius:8px;font-size:12px;font-weight:700;padding:5px 8px}
#panic{right:max(196px,calc(env(safe-area-inset-right) + 196px));top:78px;pointer-events:auto;border:2px solid #d87358;background:#6b1d18e8;color:#fff1df;border-radius:8px;font-size:11px;font-weight:900;padding:5px 8px;box-shadow:0 2px 4px #0008}
#panic[hidden]{display:none}
#joy{left:0;bottom:0;width:46%;height:72%;pointer-events:auto;touch-action:none;overscroll-behavior:none}
#stick{position:fixed;left:max(46px,calc(env(safe-area-inset-left) + 46px));bottom:34px;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,#ffffff22,#ffffff14 60%,#ffffff08);border:2px solid #ffffff30;pointer-events:none;opacity:.45;transition:opacity .15s}
#stick.act{opacity:1}
#knob{position:absolute;left:36px;top:36px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff70,#ffffff35);box-shadow:0 2px 6px #0005}
#cluster{position:fixed;right:max(24px,calc(env(safe-area-inset-right) + 24px));bottom:52px;width:124px;height:124px;pointer-events:none}
#atk{position:absolute;inset:0;border:0;padding:0;border-radius:50%;background:var(--ring) center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 4px 6px #000a);transition:transform .08s}
#atk:active{transform:scale(.95)}
#atkIc{position:absolute;left:22%;top:22%;width:56%;height:56%;object-fit:contain;filter:drop-shadow(0 2px 2px #0008)}
#atkCap{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:900;color:#fff4d8;text-shadow:0 1px 2px #000,0 0 3px #000}
#atk.talk #atkIc{opacity:.35}
.sk{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:0;padding:0;border-radius:50%;background:center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 3px 4px #0009)}
.sk[hidden]{display:none}
.sk i{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(#000a var(--cd,0turn),transparent 0)}
.sk:active{transform:scale(.93)}
.pot{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border:0;padding:0;border-radius:50%;background:center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 3px 4px #0009)}
.pot:active{transform:scale(.93)}
.pot.none{filter:grayscale(1) brightness(.6) drop-shadow(0 3px 4px #0009)}
.pot b{position:absolute;right:-3px;bottom:-3px;min-width:19px;height:19px;border-radius:10px;background:#2a160b;border:2px solid #e3b35f;color:#fff;font-size:11px;line-height:15px;text-align:center;padding:0 3px}
#swap{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;padding:0;border-radius:50%;background:var(--swapI) center/100% 100% no-repeat;pointer-events:auto;color:#ffe9b8;font-weight:900;filter:drop-shadow(0 3px 4px #0009)}
#swap small{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;background:#9e2a22;border:2px solid #e3b35f;font-size:11px;line-height:16px;text-align:center}

#lvOrb{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--ring) center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;filter:drop-shadow(0 2px 2px #0008)}
#lvOrb b{font-size:14px;line-height:13px;color:#ffe08a;text-shadow:0 1px 2px #000}
#lvOrb small{font-size:8px;line-height:8px;color:#f3e6c8;font-weight:800}
.sk.empty{opacity:.75}
.sk[data-pen]:not([data-pen=''])::after{content:attr(data-pen);position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:10px;font-weight:900;color:#fff;background:#2a160bdd;border-radius:6px;padding:0 4px;white-space:nowrap}.sk[data-glyph]:not([data-glyph=''])::before{content:attr(data-glyph);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900;color:#ffe9b8;text-shadow:0 2px 3px #000;z-index:2}
#cluster.drop{z-index:12}
#cluster.drop .sk{outline:2px dashed #ffe08a;outline-offset:2px}
#ghost{position:fixed;width:58px;height:58px;margin:-29px 0 0 -29px;pointer-events:none;display:none;z-index:13;filter:drop-shadow(0 4px 6px #000a)}
.skpane{position:absolute;inset:0;border:30px solid transparent;border-image:var(--panel) 62 fill stretch;color:var(--ink);overflow:auto;padding-right:4px}
.skhead{font-weight:900;font-size:16px;margin:-8px 0 2px;text-align:center}
.sknote{font-size:11px;color:#6b5b45;text-align:center;margin-bottom:4px}
.skrow{display:flex;align-items:center;gap:6px;min-height:56px}
.skrow>b{width:58px;font-size:13px;flex:none}
.skcwrap{display:flex;align-items:center;gap:2px;position:relative}
.skc{width:46px;height:46px;border:0;padding:0;border-radius:50%;background:center/100% 100% no-repeat;touch-action:none;cursor:grab}
.skc.lock{filter:grayscale(1) brightness(.55);cursor:default}
.skrank{font-size:10px;font-weight:900;min-width:26px;text-align:center;color:#6b3d18}
.growplus{width:25px;height:25px;border:1px solid #9b6d35;background:#6d421d;color:#ffe9b5;border-radius:6px;font-weight:900;padding:0;line-height:22px}
.growplus:disabled{opacity:.3}
.passgrid,.lifegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:4px 0 8px}
.skilltile{display:grid;grid-template-columns:50px 1fr 26px;grid-template-rows:23px 25px;gap:0 6px;align-items:center;min-height:56px;border:1px solid #a7855738;border-radius:9px;background:#f3e5c866;padding:4px 5px}
.skilltile .skc{grid-row:1/3;grid-column:1;width:46px;height:46px}
.skilltile .stname{grid-column:2;font-size:12px;font-weight:900;color:#5e3517;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skilltile .stdesc{grid-column:2;font-size:10px;color:#6b5b45;line-height:1.15;align-self:start}
.skilltile .stplus{grid-column:3;grid-row:1;width:25px;height:25px}
.skilltile .strank{grid-column:3;grid-row:2;font-size:9px;font-weight:900;text-align:center;color:#7a3b1a}
.skilltile.lock{filter:grayscale(.8);opacity:.58}
.skilltile .skc.life{cursor:default}.skilltile .skc.drag{cursor:grab;touch-action:none}
.masterrow{display:grid;grid-template-columns:92px 52px 1fr 82px;gap:5px;align-items:center;min-height:34px;border-top:1px solid #9b7d5533;font-size:11px}
.masterrow b{font-size:12px}.masterrow small{color:#6b5b45}

(function(){ const B = window.ArpgBridge; if (!B) return;
  document.documentElement.classList.add('app');
  const ls = window.localStorage, set = Storage.prototype.setItem, rm = Storage.prototype.removeItem;
  // 2026-10-03 장기 성장판: v1/v2 세이브는 완전 폐기하고 v3부터 시작.
  try { for (const k of ['arpg_save_v1','arpg_save_v2']){ rm.call(ls,k); B.del(k); } } catch (e) {}
  try { const m = JSON.parse(B.load() || '{}');
    for (const k in m){ const cur = ls.getItem(k);
      if (cur === null) set.call(ls, k, m[k]);
      else if (k === 'arpg_save_v3'){ try { if ((JSON.parse(m[k]).t || 0) > (JSON.parse(cur).t || 0)) set.call(ls, k, m[k]); } catch (e) {} } } } catch (e) {}
  Storage.prototype.setItem = function(k, v){ set.call(this, k, v); if (this === ls && /^arpg_/.test(k)) try { B.put(k, String(v)); } catch (e) {} };
  Storage.prototype.removeItem = function(k){ rm.call(this, k); if (this === ls && /^arpg_/.test(k)) try { B.del(k); } catch (e) {} };
})();

function vBlocked(x, y){
  const r = 9;
  if (x < r || y < 30 || x > MWp - r || y > MHp - 6) return true;
  for (const s of solids){
    const cx = Math.max(s.x0, Math.min(x, s.x1)), cy = Math.max(s.y0, Math.min(y, s.y1));

function updVils(dt, night){
  for (const v of vils){
    if (v.hidden){ // 아침이 되면 집에서 나옴
      if (!night && Math.random() < dt * 0.3){ v.hidden = false; v.x = v.home.x; v.y = v.home.y; v.wait = 0.5; }
      continue;
    }
    if (night && !v.goingHome){ v.goingHome = true; v.tx = v.home.x; v.ty = v.home.y; v.wait = 0; }
    if (!night) v.goingHome = false;
    if (v.wait > 0){ v.wait -= dt; v.moving = false; v.t = 0; continue; }
    const dx = v.tx - v.x, dy = v.ty - v.y, d = Math.hypot(dx, dy);
    if (d < 6){
      if (v.goingHome){ v.hidden = true; continue; }
      v.wait = rand(1.2, 4.5); const n = WP[Math.floor(rand(0, WP.length))]; v.tx = n.x + rand(-20, 20); v.ty = n.y + rand(-14, 14);
      v.dir = 'front'; continue;
    }
    const sp = (v.goingHome ? v.sp * 1.3 : v.sp) * (v.name === 'kid' && Math.sin(T * 0.7 + v.ph) > 0.6 ? 1.8 : 1);
    const mx = dx / d * sp * dt, my = dy / d * sp * dt, ox = v.x, oy = v.y;
    if (!vBlocked(v.x + mx, v.y)) v.x += mx;
    if (!vBlocked(v.x, v.y + my)) v.y += my;
    const moved = Math.hypot(v.x - ox, v.y - oy);
    v.moving = moved > 0.2; v.t += dt * (sp / 60);

      if (v.goingHome){ v.hidden = true; continue; }
      const n = WP[Math.floor(rand(0, WP.length))]; v.tx = n.x; v.ty = n.y; } }
    else v.stuck = 0;

  }
}

function weather(dt, camX, camY, vw, vh){

  while (drops.length < want) drops.push({ x: rand(0, vw), y: rand(-vh, 0), v: rand(620, 820), l: rand(10, 18) });
  if (drops.length > want) drops.length = want;

    d.y += d.v * dt; d.x += d.v * 0.22 * dt;
    if (d.y > vh){
      if (Math.random() < 0.35) splash.push({ x: camX + d.x, y: camY + rand(0, vh), t: 0 });
      d.y = rand(-40, 0); d.x = rand(-80, vw);

  }

  while (splash.length && splash[0].t > 0.4) splash.shift();

  }

  }
  rooms.sort((a, b) => a.cx - b.cx);
  const carve = (x0, y0, x1, y1) => { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) if (y > 1 && y < H - 1 && x > 0 && x < W - 1) g[y][x] = 1; };

    const a = rooms[i - 1], b = rooms[i];

function spawnDungeonMonsters(){

    const d=MOBDEF[type],imgs=mobImageSet(type);if(!d||!imgs)return;

    const hp=Math.round(d.hp*hpK*(boss?2.3:1)),dmg=Math.round(d.dmg*dmK*(boss?1.25:1));

      ranged:d.ranged||0,range:d.range||42,skill:d.skill||'',shotStatus:d.shotStatus||'',touchStatus:d.touchStatus||'',

  };

    for(let i=0;i<n;i++) add(pool[Math.floor(Math.random()*pool.length)],(r.x+1+Math.random()*(r.w-2))*TS,(r.y+1.5+Math.random()*(r.h-2))*TS,false);

async function goDungeon(floor,fromAbove){
  if(dunBusy||traveling)return false;
  dunBusy=true;
  try{
    say(floor===1?'어둡고 축축하다… 돈 냄새가 난다.':'지하 '+floor+'층');
    const m=await prepareDungeon(floor);
    // 계단 바로 위/타일 경계 대신 방 중심의 안전 바닥에서 시작.
    const pos=fromAbove===false?[(m.farRoom.cx+.5)*TS,(m.farRoom.cy+.5)*TS]:m.spawn;
    if(!travel('dungeon',pos,'front'))return false;
    await new Promise(r=>setTimeout(r,560));
    const safe=nearestSafePosition(P.x,P.y);P.x=safe[0];P.y=safe[1];
    if(window.GUILD)GUILD.onDungeonFloor(floor);

}

const shadeC = document.createElement('canvas'), shadeG = shadeC.getContext('2d');
function drawDungeonShade(camX, camY){
  if (MAP !== 'dungeon') return;
  if (shadeC.width !== cv.width || shadeC.height !== cv.height){ shadeC.width = cv.width; shadeC.height = cv.height; }
  const g = shadeG, k = dpr * Z; g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over'; g.fillStyle = 'rgba(6,5,10,0.9)'; g.fillRect(0, 0, shadeC.width, shadeC.height);
  g.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a) => { const sx = (x - camX) * k, sy = (y - camY) * k, R = r * k;
    const gr = g.createRadialGradient(sx, sy, 0, sx, sy, R); gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(0.55, `rgba(0,0,0,${a * 0.7})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(sx, sy, R, 0, 7); g.fill(); };
  const fl = 0.94 + Math.sin(T * 11) * 0.03 + Math.sin(T * 27) * 0.02;
  hole(P.x, P.y - 40, 250, 1);
  for (const t of CUR.torches || []) if (Math.abs(t.x - P.x) < 900 && Math.abs(t.y - P.y) < 700) hole(t.x, t.y + 30, 170 * fl, 0.95);
  for (const s of shots) if (s.kind === 'fire' || s.kind === 'staff') hole(s.x, s.y, 90, 0.8);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(shadeC, 0, 0);
  // 횃불 주위 따뜻한 빛
  ctx.globalCompositeOperation = 'lighter';
  for (const t of CUR.torches || []){
    const sx = (t.x - camX) * k, sy = (t.y - camY) * k, R = 120 * k * fl; if (sx < -R || sy < -R || sx > cv.width + R || sy > cv.height + R) continue;
    const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, R); gr.addColorStop(0, 'rgba(255,170,80,.30)'); gr.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(sx, sy, R, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

(() => {
  const wrap = (name, before, after) => {
    let f; try { f = eval(name); } catch (e) { return; } if (typeof f !== 'function') return;
    const g = function(...a){ if (before) before(...a); const r = f.apply(this, a); if (after) after(r, ...a); return r; };
    eval(name + ' = g');
  };
  wrap('attack', null, () => { if (P.atk && P.atk.t === 0){ const w = P.atk.wt; SFX.play(w === 'bow' ? 'bow' : w === 'staff' ? 'staff' : w === 'spear' ? 'thrust' : w === 'gauntlet' ? 'punch' : 'swing'); } });
  wrap('hitTarget', null, () => { const p = pops[pops.length - 1]; SFX.play(p && p.crit ? 'crit' : 'hit'); HAP(p && p.crit ? 28 : 12); });   // 허수아비·몬스터 공통 타격
  if (typeof killMonster === 'function') wrap('killMonster', null, () => { SFX.play('kill'); HAP(18); });
  if (typeof hurtPlayer === 'function') wrap('hurtPlayer', (v) => { if (playerInv <= 0 && !traveling){ SFX.play('hurt'); HAP(45); } });
  wrap('cast',null,(ok,id)=>{if(!ok)return;SFX.play({fire1:'fire',ice1:'ice',holy1_heal:'heal',sword1:'slash',sword2:'spin'}[id]||'staff');HAP(id==='sword2'?[18,20,28]:id==='fire1'?[12,22,34]:id==='sword1'?28:18);});
  wrap('drink', null, (ok) => { if (ok){ SFX.play('potion'); HAP([10, 40, 10]); } });
  wrap('travel', () => { if (!traveling) SFX.play('travel'); });
  if (typeof openDungeonChest === 'function') wrap('openDungeonChest', (spot) => { const m = spot && spot.data && spot.data.mimic; SFX.play(m ? 'mimic' : 'chest'); HAP(m ? [60, 30, 60] : [15, 40, 15]); });
  if (typeof nextDungeonFloor === 'function') wrap('nextDungeonFloor', () => SFX.play('stairs'));
  if (typeof previousDungeonFloor === 'function') wrap('previousDungeonFloor', () => SFX.play('stairs'));
  let lastGold = P.gold;
  wrap('setGold', (v) => { if (v > lastGold) SFX.play('coin'); else if (v < lastGold) SFX.play('buy'); lastGold = v; });

};
const TRADE_SLOT_MAX = 24, TRADE_STACK_MAX = 50, TRADE_DAY_MS = 480000;
const tradeState = { cargo:{}, pressure:{}, resetAt:Date.now()+TRADE_DAY_MS };
let tradeRegion='town', tradeSel='wheat';

function tradeRegionDef(k){ return TRADE_REGIONS[k] || TRADE_REGIONS.town; }
function tradeMod(region,id){ return tradeRegionDef(region).m[id] || 1; }
function tradePressure(region,id){
  if(Date.now() >= tradeState.resetAt){ tradeState.pressure={}; tradeState.resetAt=Date.now()+TRADE_DAY_MS; }
  const n=tradeState.pressure[region+':'+id]||0;
  return Math.max(.90,1-Math.floor(n/5)*.01); // 5개 팔 때마다 -1%, 하루 최대 -10%
}
function tradeDiscount(){ return Math.max(.90,1-.02*((P.lifeSkills&&P.lifeSkills.discount)||0)); }
function tradeOvercount(){ return Math.min(1.10,1+.02*((P.lifeSkills&&P.lifeSkills.overcount)||0)); }
function tradeQuote(region,id){
  const g=TRADE_BY_ID[id], m=tradeMod(region,id);
  if(!g)return {buy:0,sell:0,mod:1};
  return {
    buy:Math.max(1,Math.round(g.base*m*1.06*tradeDiscount())),
    sell:Math.max(1,Math.round(g.base*m*.94*tradePressure(region,id)*tradeOvercount())),
    mod:m
  };
}
function cargoSlots(){ return Object.keys(tradeState.cargo).filter(id=>tradeState.cargo[id]&&tradeState.cargo[id].qty>0).length; }
function cargoEntry(id){ return tradeState.cargo[id]||{qty:0,avg:0}; }
function tradeBuy(id,n){
  const g=TRADE_BY_ID[id]; if(!g)return false;
  const q=tradeQuote(tradeRegion,id), cur=cargoEntry(id);
  if(!cur.qty && cargoSlots()>=TRADE_SLOT_MAX){ tradeMsg('화물칸이 가득 찼습니다.'); return false; }
  n=Math.max(0,Math.min(n|0,TRADE_STACK_MAX-cur.qty));
  if(!n){ tradeMsg('한 품목은 최대 '+TRADE_STACK_MAX+'개까지 싣습니다.'); return false; }
  const afford=Math.floor(P.gold/q.buy); n=Math.min(n,afford);
  if(!n){ tradeMsg('금화가 부족합니다.'); return false; }
  const next=cur.qty+n, avg=(cur.avg*cur.qty+q.buy*n)/next;
  tradeState.cargo[id]={qty:next,avg:avg};
  setGold(P.gold-q.buy*n);if(window.GUILD)GUILD.refreshTrack();if(window.UI&&UI.save)UI.save();
  tradeMsg(g.name+' '+n+'개 매입. 금화 '+(q.buy*n)+'닢… 남는 장사여야 할 텐데요.');
  renderTrade(); return true;
}
function tradeSell(id,n){
  const g=TRADE_BY_ID[id], cur=cargoEntry(id); if(!g||!cur.qty)return false;
  n=Math.max(0,Math.min(n|0,cur.qty)); if(!n)return false;
  const q=tradeQuote(tradeRegion,id), revenue=q.sell*n, cost=cur.avg*n, profit=Math.round(revenue-cost);
  cur.qty-=n; if(cur.qty<=0) delete tradeState.cargo[id]; else tradeState.cargo[id]=cur;
  const key=tradeRegion+':'+id; tradeState.pressure[key]=(tradeState.pressure[key]||0)+n;
  setGold(P.gold+revenue);if(window.GUILD)GUILD.refreshTrack();if(window.UI&&UI.save)UI.save();
  tradeMsg((profit>=0?'좋습니다. ':'아깝군요. ')+g.name+' '+n+'개, '+(profit>=0?'+':'')+profit+'골드.');
  renderTrade(); return true;
}

function openTrade(region){
  closeAll(); ensureTradeUI(); tradeRegion=TRADE_REGIONS[region]?region:'town'; panel='trade'; $('trade').classList.add('on'); renderTrade();
}
function closeTrade(silent){
  const d=$('trade'); if(d)d.classList.remove('on'); if(panel==='trade')panel=null;
}
function renderTrade(){
  ensureTradeUI(); const R=tradeRegionDef(tradeRegion);
  $('tradeTitle').textContent=R.name; $('tradeGold').textContent=P.gold;
  $('tradeHint').textContent='화물 '+cargoSlots()+'/'+TRADE_SLOT_MAX+'칸';
  const list=$('tradeList'); list.innerHTML='';
  for(const g of TRADE_GOODS){
    const q=tradeQuote(tradeRegion,g.id), c=cargoEntry(g.id), b=document.createElement('button');
    b.className='tgood'+(tradeSel===g.id?' sel':''); b.type='button';
    const cls=q.mod>=1.18?'hi':q.mod<=.82?'lo':'';
    b.innerHTML='<i>'+g.icon+'</i><b>'+g.name+'</b><small class="'+cls+'">사 '+q.buy+' / 팔 '+q.sell+(c.qty?' · '+c.qty+'개':'')+'</small>';
    b.onclick=()=>{tradeSel=g.id;renderTrade();}; list.append(b);
  }

  $('tradeStock').innerHTML='보유 <b>'+c.qty+'</b>개'+(c.qty?'<br>평균 매입 '+Math.round(c.avg)+' · 지금 전부 팔면 <b>'+(allProfit>=0?'+':'')+allProfit+'</b>':'<br>화물칸에 없습니다.');

  btn[0].disabled=P.gold<q.buy||c.qty>=TRADE_STACK_MAX; btn[1].disabled=P.gold<q.buy||c.qty>=TRADE_STACK_MAX;
  btn[2].disabled=P.gold<q.buy||c.qty>=TRADE_STACK_MAX; btn[3].disabled=!c.qty; btn[4].disabled=c.qty<1; btn[5].disabled=!c.qty;
}
function tradeSaveData(){ return {cargo:tradeState.cargo,pressure:tradeState.pressure,resetAt:tradeState.resetAt}; }
function tradeLoadData(d){
  if(!d)return; tradeState.cargo=d.cargo&&typeof d.cargo==='object'?d.cargo:{}; tradeState.pressure=d.pressure&&typeof d.pressure==='object'?d.pressure:{};
  tradeState.resetAt=+d.resetAt||Date.now()+TRADE_DAY_MS;
}
function tradeConsume(id,qty){
  qty=Math.max(1,qty|0);const c=cargoEntry(id);
  if(c.qty<qty)return false;
  c.qty-=qty;if(c.qty<=0)delete tradeState.cargo[id];
  if(window.GUILD)GUILD.refreshTrack();
  if($('trade').classList.contains('on'))renderTrade();
  return true;
}
function renderTradeSummary(L){
  L.style.backgroundImage='none';L.style.width='458px';L.style.height='595px';
  const d=document.createElement('div');d.className='tradeSummary';
  let value=0,cost=0,units=0;
  for(const id in tradeState.cargo){const c=tradeState.cargo[id];if(!c||!c.qty)continue;units+=c.qty;cost+=c.avg*c.qty;value+=tradeQuote('town',id).sell*c.qty;}
  d.innerHTML='<h2>무역품 화물</h2><p>장비 가방과 별개로 보관됩니다.<br><strong>'+cargoSlots()+' / '+TRADE_SLOT_MAX+'칸</strong> · 총 '+units+'개</p><p>평균 매입 총액 '+Math.round(cost)+'G<br>큰 마을 기준 처분가 '+Math.round(value)+'G</p><p>지역 상인협회에서 싸게 사고, 다른 지역에서 비싸게 파십시오.<br>같은 품목을 너무 많이 풀면 그 지역 매입가가 하루 동안 조금 내려갑니다.</p>';
  L.append(d);
}

  R.innerHTML='';R.style.backgroundImage=`url(${A.kit['01']})`;
  const d=document.createElement('div');d.className='tradeCargo';d.innerHTML='<h3>무역품 · 화물칸</h3>';
  const ids=Object.keys(tradeState.cargo).filter(id=>tradeState.cargo[id]&&tradeState.cargo[id].qty>0);
  for(let i=0;i<TRADE_SLOT_MAX;i++){
    const c=document.createElement('div');c.className='tc';const id=ids[i];
    if(id){const g=TRADE_BY_ID[id],e=tradeState.cargo[id];c.innerHTML='<i>'+g.icon+'</i><b>'+g.name+' ×'+e.qty+'</b><small>평균 '+Math.round(e.avg)+'G</small>';}
    d.append(c);
  }

}

// ======================= 모험가 길드 의뢰판 =======================
const GUILD_MOB_NAME={
  wolf:'늑대',rabbit:'토끼',bear:'곰',orc:'오크',harpy:'하피',rogue:'로그',darkmage:'다크메이지',
  gargoyle:'가고일',demon:'데몬',slime:'슬라임',goblin:'고블린',skeleton:'스켈레톤',
  spider:'거미',mushroom:'버섯괴물',elem_fire:'화염 정령',elem_ice:'얼음 정령',mimic:'미믹',lich:'리치'
};
const GUILD_TIER_THEME=['','spring','summer','autumn','winter','ice','volcano','swamp'];
let guildState={seq:1,board:[],active:[],completed:0};

function guildTier(){return window.GAME&&GAME.levelTier?GAME.levelTier(P.lv):1;}
function guildReward(tier){
  const exp=window.GAME&&GAME.questExp?GAME.questExp('guild',P.lv):10;
  const gold=Math.round(35+P.lv*8+tier*22);
  return {exp,gold,gear:Math.random()<.28};
}
function guildMake(type,idx){
  const tier=guildTier(),rew=guildReward(tier),q={id:guildState.seq++,type,tier,prog:0,accepted:false,...rew};
  if(type==='kill_any'){
    q.need=8+tier*2+idx;q.title='주변 정리';q.desc='같은 티어 전투 지역에서 몬스터 '+q.need+'마리 처치';
  }else if(type==='kill_type'){
    const pool=THEME_MOBS[GUILD_TIER_THEME[tier]]||THEME_MOBS.spring,target=pool[(idx+tier)%pool.length];
    q.target=target;q.need=4+tier;q.title=GUILD_MOB_NAME[target]+' 소탕';q.desc=GUILD_MOB_NAME[target]+' '+q.need+'마리 처치';
  }else if(type==='floor'){
    q.need=Math.max(2,tier*3);q.title='던전 정찰';q.desc='던전 지하 '+q.need+'층에 도달';
  }else{
    const goods=TRADE.goods, g=goods[(tier*3+idx*5)%goods.length];
    q.goodId=g.id;q.goodName=g.name;q.need=4+tier*2;q.title='긴급 납품';q.desc=g.name+' '+q.need+'개 납품';
  }
  return q;
}
function guildGenerate(){
  if(guildState.board.length||guildState.active.length>=3)return;
  guildState.board=[
    guildMake('kill_any',0),guildMake('kill_any',1),
    guildMake('kill_type',0),guildMake('kill_type',1),
    guildMake('floor',0),guildMake('delivery',0)
  ];
}
function guildDone(q){
  if(q.type==='delivery'){
    const c=TRADE.cargo()[q.goodId];return !!c&&c.qty>=q.need;
  }
  return (q.prog||0)>=q.need;
}
function guildProgressText(q){
  if(q.type==='delivery'){
    const c=TRADE.cargo()[q.goodId];return (c?c.qty:0)+' / '+q.need;
  }
  return Math.min(q.need,q.prog||0)+' / '+q.need;
}
function guildTrack(){
  const host=$('questTrack');if(!host)return;
  host.innerHTML='';
  if(!guildState.active.length){host.classList.remove('on');return;}
  host.classList.add('on');
  for(const q of guildState.active.slice(0,3)){
    const done=guildDone(q),row=document.createElement('div');
    row.className='qtrack'+(done?' done':'');
    const hasNum=Number.isFinite(q.need)&&q.need>0;
    const prog=hasNum?guildProgressText(q):'';
    row.innerHTML='<span class="qcheck"></span><span class="qtitle">'+q.title+'</span><span class="qprog">'+prog+'</span>';
    host.append(row);
  }
}
function guildAccept(id){
  if(guildState.active.length>=3){say('진행 중 의뢰는 최대 3개입니다.');return false;}
  const i=guildState.board.findIndex(q=>q.id===id);if(i<0)return false;
  const q=guildState.board.splice(i,1)[0];q.accepted=true;guildState.active.push(q);guildRender();guildTrack();
  if(window.UI&&UI.save)UI.save();return true;
}
function guildRandomGear(tier){
  const r=Math.random();
  if(r<.58){const wt=['sword','spear','gauntlet','bow','staff'][Math.floor(Math.random()*5)];return UI.make({kind:'weapon',wt,tier,roll:true});}
  if(r<.9){const kinds=['head','body','hands','feet'];return UI.make({kind:kinds[Math.floor(Math.random()*kinds.length)],tier,roll:true});}
  return UI.make({kind:Math.random()<.5?'ring':'neck',tier,roll:true});
}
function guildClaim(id){
  const i=guildState.active.findIndex(q=>q.id===id);if(i<0)return false;
  const q=guildState.active[i];if(!guildDone(q)){say('아직 의뢰 조건을 채우지 못했습니다.');return false;}
  if(q.type==='delivery'&&!TRADE.consume(q.goodId,q.need)){say('납품 물품이 부족합니다.');return false;}
  GAME.gainExp(q.exp);GAME.setGold(P.gold+q.gold);
  let extra='';
  if(q.gear&&window.UI){
    const it=guildRandomGear(Math.max(1,Math.min(7,q.tier)));
    if(UI.add(it))extra=' · '+it.name;
    else {const comp=50+q.tier*35;GAME.setGold(P.gold+comp);extra=' · 가방이 차서 '+comp+'G 추가';}
  }
  guildState.active.splice(i,1);guildState.completed++;
  say('의뢰 완료! EXP '+q.exp+' · '+q.gold+'G'+extra);
  if(!guildState.board.length&&!guildState.active.length)guildGenerate();
  guildRender();guildTrack();if(window.UI&&UI.save)UI.save();return true;
}
function guildOnKill(m){
  if(!m||m.dead===false)return;
  let changed=false;
  for(const q of guildState.active){
    if(q.type==='kill_any'){q.prog=Math.min(q.need,(q.prog||0)+1);changed=true;}
    else if(q.type==='kill_type'&&m.type===q.target){q.prog=Math.min(q.need,(q.prog||0)+1);changed=true;}
  }
  if(changed&&$('guild').classList.contains('on'))guildRender();if(changed)guildTrack();if(changed)guildTrack();
}
function guildOnDungeonFloor(floor){
  let changed=false;
  for(const q of guildState.active)if(q.type==='floor'){q.prog=Math.max(q.prog||0,floor);changed=true;}
  if(changed&&$('guild').classList.contains('on'))guildRender();
}
function guildCard(q,active){
  const d=document.createElement('div');d.className='gq'+(guildDone(q)?' done':'');
  const gear=q.gear?' · 장비 가능':'';

function needWeapon(id){if(id==='townPortal')return null;const w=SKW[id.replace(/[0-9].*$/,'')];return w||null;}

skBtns.forEach((b, i) => b.addEventListener('pointerdown', e => {

  const nw=needWeapon(id),wt=eq[cur]?eq[cur].wt:null;
  G.cast(id,nw?(wt===nw?{dmg:1,mp:1}:{dmg:.6,mp:1.5}):(wt==='staff'?{dmg:1.25,mp:1}:{dmg:1,mp:1}));
}));
(function cdLoop(){ skBtns.forEach((b, i) => { const id = QS[i]; b.querySelector('i').style.setProperty('--cd', id ? G.cdLeft(id) + 'turn' : '0turn'); }); requestAnimationFrame(cdLoop); })();
// 끌어다 놓기 (손가락·마우스 모두)
let drag=null,dragSuppressClickUntil=0;const ghost=$('ghost');
function startDrag(e,id,from){

  $('cluster').classList.add('drop');
}
function moveGhost(e){
  if(drag&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>9)drag.moved=true;
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
}
function quickDropIndex(x,y){
  let best=-1,bd=1e9;
  skBtns.forEach((b,i)=>{
    const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(x-cx,y-cy);
    const inside=x>=r.left-18&&x<=r.right+18&&y>=r.top-18&&y<=r.bottom+18;

}
function dragClickSuppressed(){return Date.now()<dragSuppressClickUntil;}
addEventListener('pointermove',e=>{if(drag){if(e.cancelable)e.preventDefault();moveGhost(e);}},{passive:false});
addEventListener('pointerup',e=>{

    else{const old=QS.indexOf(d.id);if(old>=0)QS[old]=null;QS[i]=d.id;}
  }else if(d.from!=null)QS[d.from]=null;
  if(d.moved)dragSuppressClickUntil=Date.now()+350;
  drag=null;syncQS();saveGame();
});

// ---- 캐릭터 창 ----
// 키트 그림 좌표(원본 픽셀): 장비창 kit_c_02, 가방 kit_c_01, 능력치 kit_c_02b
const EQS = { head: [72, 107], w1: [72, 196], hands: [72, 287], ring1: [71, 393], neck: [337, 107], w2: [337, 196], body: [337, 286], feet: [340, 379], ring2: [339, 472] };

const INV = { x: 80, y: 117, px: 65.5, py: 66.8, w: 60, h: 62 };
let tab = 'equip', pickSel = null;
const wrap = $('charWrap');
function el(t, c, txt){ const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }

function openChar(t){ tab = t || tab; G.closeAll(); G.setOpen('char'); $('char').classList.add('on'); pickSel = null; render(); fit(); }

$('char').addEventListener('click', e => { if (e.target.id === 'char') closeChar(); });
for (const b of document.querySelectorAll('[data-tab]')) b.addEventListener('click', () => { tab = b.dataset.tab; pickSel = null; $('iinfo').classList.remove('on'); render(); });

function slotEl(it, x, y, w, h, onTap, selected){

}
function render(){
  for (const b of document.querySelectorAll('[data-tab]')) b.classList.toggle('on', b.dataset.tab === tab);
  const L = $('leftPane'); L.innerHTML = '';
  const d = derived(), Pp = G.P;

  } else if(tab==='skill'){

    const pane=el('div','skpane');L.append(pane);
    pane.append(el('div','skhead',`전투 스킬 · 보유 ${Pp.skillPts||0}P`),el('div','sknote','액티브와 패시브가 같은 포인트를 사용합니다. 배운 액티브는 퀵슬롯으로 끌어 놓을 수 있습니다.'));
    for(const [gname,ids] of SKG){
      const row=el('div','skrow');row.append(el('b','',gname));
      for(const id of ids){
        const wrap=el('div','skcwrap'),rank=skillRank(id),impl=IMPLEMENTED.has(id);
        const c=el('button','skc'+(impl&&rank>0?'':' lock'));c.type='button';c.title=SKN[id]||(impl?'아직 배우지 않음':'추후 구현');c.style.backgroundImage=`url(${A.skicon[id]})`;
        if(impl&&rank>0)c.addEventListener('pointerdown',e=>{e.preventDefault();startDrag(e,id,null);});

    for(const [key,dv] of Object.entries(G.PASSIVE_DEF||{})){
      const rank=(Pp.passives&&Pp.passives[key])||0,tile=el('div','skilltile');
      const ic=el('button','skc');ic.type='button';ic.title=dv.name;ic.style.backgroundImage=`url(${passiveIcon(key)})`;ic.tabIndex=-1;
      const plus=el('button','growplus stplus','+');plus.type='button';plus.disabled=Pp.skillPts<1||rank>=dv.max;plus.onclick=e=>{e.stopPropagation();G.investPassive(key);};
      tile.append(ic,el('b','stname',dv.name),el('small','stdesc',dv.desc),plus,el('span','strank',`Lv${rank}/${dv.max}`));pg.append(tile);
    }
    pane.append(el('div','sectionhead',`생활스킬 · 보유 ${Pp.lifePts||0}P`));
    const lg=el('div','lifegrid');pane.append(lg);
    for(const [key,dv] of Object.entries(G.LIFE_DEF||{})){
      const rank=(Pp.lifeSkills&&Pp.lifeSkills[key])||0,locked=Pp.lv<dv.unlock,tile=el('div','skilltile'+(locked?' lock':''));
      const ic=el('button','skc life'+(key==='townPortal'&&!locked&&rank>0?' drag':''));ic.type='button';ic.style.backgroundImage=`url(${lifeIcon(key)})`;ic.title=key==='townPortal'&&!locked&&rank>0?'길게 눌러 퀵슬롯에 등록 / 탭하여 사용':dv.name;

        ic.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)moved=true;});

      }

      const plus=el('button','growplus stplus','+');plus.type='button';plus.disabled=locked||rank<1||rank>=dv.max||Pp.lifePts<1;plus.onclick=e=>{e.stopPropagation();G.investLife(key);};
      tile.append(ic,el('b','stname',dv.name),el('small','stdesc',desc),plus,el('span','strank',locked?`Lv${dv.unlock}`:`Lv${rank}/${dv.max}`));lg.append(tile);
    }

  } else if (tab === 'trade' && window.TRADE){

  } else {

    const face = el('img', 'sface'); face.src = A.face; L.append(face);
    const expMax=Pp.lv>=70?1:G.expNeed(Pp.lv),bars=[[Pp.hp,d.maxHp,106],[Pp.mp,d.maxMp,141],[Pp.lv>=70?1:Pp.exp,expMax,176]];
    bars.forEach(([v,m,y],i)=>{const t=el('div','sbar');t.style.top=(y-1)+'px';const f=el('i','b'+i);f.style.width=Math.max(0,Math.min(100,v/m*100))+'%';t.append(f);t.append(el('span','',i===2?(Pp.lv>=70?'MAX LEVEL':`경험치 ${v} / ${m}`):`${v} / ${m}`));L.append(t);});
    d.rows.forEach(([key,n,v,sub],i)=>{const r=el('div','srow');r.style.top=(232+i*47.7)+'px';r.append(el('b','',n),el('em','',v),el('small','',sub));if(key){const plus=el('button','statplus','+');plus.type='button';plus.disabled=(Pp.statPts||0)<1;plus.onclick=()=>G.investStat(key);r.append(plus);}L.append(r);});

    R.append(el('div', 'btitle', '가방'));
    bag.forEach((it, i) => {
      const x = INV.x + (i % 7) * INV.px, y = INV.y + Math.floor(i / 7) * INV.py;
      R.append(slotEl(it, x, y, INV.w, INV.h, () => tapBag(i), pickSel && pickSel.from === 'bag' && pickSel.i === i));

}
function tapBag(i){

}
function tapEq(s){

  pickSel = { from: 'eq', slot: s }; render(); showInfo(eq[s], 'eq');
}
function cmpLine(it, other){
  const out = [];
  const keys = new Set([...Object.keys(it.st), ...Object.keys(other ? other.st : {})]);
  for (const k of keys){
    const a = it.st[k] || 0, b = other ? (other.st[k] || 0) : 0;
    const li = el('li', '', `${STN[k]} ${a}`);
    if (other && a !== b){ const sp = el('span', a > b ? 'up' : 'dn', a > b ? ` ▲${a - b}` : ` ▼${b - a}`); li.append(sp); }
    out.push(li);
  }
  return out;
}
function targetSlot(it){
  if (it.kind === 'weapon') return eq.w1 ? (eq.w2 ? cur : 'w2') : 'w1';
  if (it.kind === 'ring') return eq.ring1 ? (eq.ring2 ? 'ring1' : 'ring2') : 'ring1';
  return it.kind;
}
function showInfo(it, from){
  const I = $('iinfo'); I.innerHTML = '';
  const nm = el('div', 'iname', it.name); nm.style.color = RART[it.rar]; I.append(nm);
  I.append(el('div', 'isub', `${RARN[it.rar]} · ${it.kind === 'weapon' ? WN[it.wt] : SLOTN[targetSlot(it)]}`));
  if (it.kind === 'weapon') I.append(el('div', 'isub', WINFO[it.wt]));
  const ic = el('img', 'iic'); ic.src = A.icons[it.icon]; I.append(ic);
  const ul = el('ul', 'ist');
  const other = from === 'bag' ? eq[targetSlot(it)] : null;
  cmpLine(it, other).forEach(li => ul.append(li)); I.append(ul);
  if (from === 'bag' && other) I.append(el('div', 'icmp', `▲▼ 지금 낀 ${other.name}과 비교`));
  const row = el('div', 'ibtns');
  if (from === 'bag'){
    if (it.kind === 'weapon'){
      for (const s of ['w1', 'w2']){ const b = el('button', 'btn', `${SLOTN[s]}에 장착`); b.type = 'button'; b.onclick = () => equip(it, s); row.append(b); }
    } else if (it.kind === 'ring'){
      for (const s of ['ring1', 'ring2']){ const b = el('button', 'btn', s === 'ring1' ? '왼손 반지' : '오른손 반지'); b.type = 'button'; b.onclick = () => equip(it, s); row.append(b); }
    } else { const b = el('button', 'btn', '장착'); b.type = 'button'; b.onclick = () => equip(it, it.kind); row.append(b); }
    const d = el('button', 'btn ghost', '버리기'); d.type = 'button';
    d.onclick = () => { if (d.dataset.ok){ bag[pickSel.i] = null; pickSel = null; I.classList.remove('on'); render(); } else { d.dataset.ok = 1; d.textContent = '정말 버리기'; } };
    row.append(d);
  } else {
    const b = el('button', 'btn', '벗기'); b.type = 'button'; b.onclick = () => unequip(pickSel.slot); row.append(b);
  }

  I.classList.add('on');
}
function equip(it, s){
  const i = bag.indexOf(it); if (i < 0) return;
  bag[i] = eq[s]; eq[s] = it;
  if ((s === 'w1' || s === 'w2') && !eq[cur]) cur = s;
  pickSel = { from: 'eq', slot: s }; tab = 'equip'; render(); showInfo(it, 'eq'); syncHud();
}
function unequip(s){
  const i = bag.indexOf(null); if (i < 0){ G.say('가방이 가득 찼습니다'); return; }
  bag[i] = eq[s]; eq[s] = null;
  if (s === cur && !eq[cur]){ const o = s === 'w1' ? 'w2' : 'w1'; if (eq[o]) cur = o; }
  pickSel = { from: 'bag', i }; render(); showInfo(bag[i], 'bag'); syncHud();
}
window.UI = {
  addPotion(k,n){POT[k]+=n;syncPot();},
  make,add(it){const i=bag.indexOf(null);if(i<0)return false;bag[i]=it;return true;},
  combatMods,findBonus,coinBonus,skillRank,currentWeapon:()=>eq[cur],
  quickSlots:()=>QS.slice(),assignQuick(i,id){if(i<0||i>=5||!quickLearned(id))return false;const old=QS.indexOf(id);if(old>=0)QS[old]=null;QS[i]=id;syncQS();saveGame();return true;},
  dragDebug:()=>drag?{id:drag.id,from:drag.from,moved:drag.moved}:null,quickDropIndex,
  refresh(){syncHud();if($('char').classList.contains('on'))render();},
  bagFull:()=>bag.indexOf(null)<0,
  bagItems:()=>bag.map((it,i)=>it?{i,it}:null).filter(Boolean),
  removeBagAt(i){
    if (i < 0 || i >= BAG || !bag[i]) return null;
    const it = bag[i]; bag[i] = null; pickSel = null; $('iinfo').classList.remove('on');
    if ($('char').classList.contains('on')) render();
    if (typeof saveGame === 'function') saveGame();
    return it;
  },
  isOpen: () => $('char').classList.contains('on'), close: closeChar,
};
// ---- 저장 (이 기기의 브라우저에 자동 저장: 금화·체력·레벨·가방·장비·물약·퀵슬롯) ----
const SKEY='arpg_save_v3';
try{localStorage.removeItem('arpg_save_v1');localStorage.removeItem('arpg_save_v2');}catch(e){}
function saveGame(){
  try{
    const P=G.P;
    localStorage.setItem(SKEY,JSON.stringify({v:3,t:Date.now(),name:P.name,stats:P.stats,mastery:P.mastery,skillLv:P.skillLv,passives:P.passives,lifeSkills:P.lifeSkills,
      statPts:P.statPts,skillPts:P.skillPts,lifePts:P.lifePts,portalReadyAt:P.portalReadyAt,gold:P.gold,hp:P.hp,mp:P.mp,lv:P.lv,exp:P.exp,bag,eq,cur,pot:POT,qs:QS,
      trade:window.TRADE?TRADE.saveData():null,guild:window.GUILD?GUILD.saveData():null}));
  }catch(e){}
}
function loadGame(){
  let d=null;try{d=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){}
  if(!d||d.v!==3)return null;
  for(let i=0;i<BAG;i++)bag[i]=d.bag&&d.bag[i]||null;
  for(const k in eq)eq[k]=d.eq&&d.eq[k]||null;
  cur=d.cur==='w2'&&eq.w2?'w2':'w1';
  if(d.pot){POT.hp=d.pot.hp|0;POT.mp=d.pot.mp|0;}
  if(d.qs)for(let i=0;i<5;i++)QS[i]=d.qs[i]&&(d.qs[i]==='townPortal'||A.skicon[d.qs[i]])?d.qs[i]:null;
  let mx=0;for(const it of [...bag,...Object.values(eq)])if(it&&it.id>mx)mx=it.id;seq=mx+1;
  const P=G.P;P.name=d.name||P.name||'루크레아';P.lv=d.lv||1;P.exp=d.exp||0;P.statPts=d.statPts|0;P.skillPts=d.skillPts|0;P.lifePts=d.lifePts|0;
  P.stats=Object.assign({},P.stats,d.stats||{});P.mastery=Object.assign({},P.mastery,d.mastery||{});P.skillLv=Object.assign({},P.skillLv,d.skillLv||{});
  P.lifeSkills=Object.assign({},P.lifeSkills||{},d.lifeSkills||{});P.passives=Object.assign({},P.passives||{},d.passives||{});P.portalReadyAt=+d.portalReadyAt||0;
  if(G.syncLifeUnlocks)G.syncLifeUnlocks(true);G.setGold(d.gold|0);if(window.TRADE)TRADE.loadData(d.trade);if(window.GUILD)GUILD.loadData(d.guild);return d;
}
const saved=loadGame();syncHud();syncPot();
if(saved){G.P.hp=Math.max(1,Math.min(G.P.maxHp,saved.hp||G.P.maxHp));G.P.mp=Math.min(G.P.maxMp,saved.mp||0);G.setMax(G.P.maxHp,G.P.maxMp);G.say('이어서 합니다. 금화 '+G.P.gold+'닢 그대로!');}
setInterval(saveGame,4000);addEventListener('pagehide',saveGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
window.UI.save=saveGame;window.UI.reset=()=>{try{localStorage.removeItem(SKEY);}catch(e){}location.reload();};
})();
