<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>마을 시험판</title>
<style>
:root{--ink:#3b2412;--paper:#f3e6c8;--gold:#c9923e;--red:#9e2a22}
html,body{margin:0;height:100%;background:#1d1510;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none}
#tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;display:none;min-width:150px;height:46px;padding:0 26px;background:center/100% 100% no-repeat;color:#fff4d8;font-weight:800;font-size:15px;line-height:44px;text-align:center;white-space:nowrap;text-shadow:0 1px 2px #000}

.pan{position:fixed;display:none;z-index:5}
.pan.on{display:block}
.frame{border:34px solid transparent;border-image:var(--panel) 62 fill stretch;color:var(--ink)}
#msg{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,80vw);text-align:center;font-size:15px;line-height:1.6;padding:0}
#msg b{display:block;font-size:19px;margin-bottom:6px}
.btn{border:2px solid #b07a35;background:linear-gradient(#7a4422,#552c12);color:#f8ebcf;border-radius:9px;padding:7px 20px;font-weight:800;font-size:15px;font-family:inherit;box-shadow:0 2px 0 #2c160a}
.btn:disabled{opacity:.45}
.btn.ghost{background:#efe0bd;color:var(--ink)}
#dlg{left:50%;bottom:10px;transform:translateX(-50%);width:min(760px,92vw);display:none}
#dlg.on{display:flex;align-items:flex-end;gap:0}
#dlgImg{height:min(250px,56vh);margin-right:-18px;position:relative;z-index:2;filter:drop-shadow(0 4px 6px #0007)}
#dlg .frame{flex:1;min-height:120px;position:relative}
#dlgName{position:absolute;left:-6px;top:-58px;min-width:120px;height:44px;padding:0 24px;background:var(--banner) center/100% 100% no-repeat;color:#fff4d8;font-weight:900;font-size:17px;line-height:42px;text-align:center;text-shadow:0 1px 2px #000}
#dlgTitle{font-size:12px;color:#8a5a2a;font-weight:800}
#dlgLine{font-size:17px;line-height:1.55;margin:4px 0 10px;font-weight:600}
.row{display:flex;gap:8px;justify-content:flex-end}
#shop{left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);display:none}
#shop.on{display:flex;align-items:flex-end}
#shopImg{height:min(300px,62vh);margin-right:-24px;position:relative;z-index:2;filter:drop-shadow(0 4px 6px #0007)}
#shop .frame{flex:1;display:grid;grid-template-columns:1fr 190px;gap:10px;max-height:82vh}
#shopHead{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:18px}
#shopHead small{font-size:14px;color:#8a5a2a}
#shopTabs{display:flex;gap:5px;margin-left:auto;margin-right:10px}
#shopTabs .btn{padding:3px 12px;font-size:12px;opacity:.48}
#shopTabs .btn.on{opacity:1;box-shadow:inset 0 0 0 2px #f0c469,0 2px 0 #2c160a}
#shopMarket{grid-column:1/3;font-size:11px;color:#7a5a32;margin-top:-6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;align-content:start;overflow:auto;max-height:52vh}
.cell{position:relative;aspect-ratio:1;border:0;padding:6px;background:var(--slot) center/100% 100% no-repeat}
.cell.sel{background-image:var(--slotOn)}
.cell img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px #0006)}
.cell span{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:900;color:#ffe08a;text-shadow:0 1px 2px #000,0 0 2px #000}
#info{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
#infoIc{width:84px;height:84px;object-fit:contain;padding:8px;background:var(--slot) center/100% 100% no-repeat}
#infoName{font-weight:900;font-size:16px}
#infoSlot{font-size:12px;color:#6b5b45}
#infoPrice{font-weight:900;color:#8a5a0a}
#shopSay{font-size:12px;color:#7a3b1a;min-height:32px;line-height:1.35}

#guild{left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:86vh;display:none;overflow:auto}
#guild.on{display:block}
#guildHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-right:52px;position:relative}
#guildHead b{font-size:20px}#guildHead small{color:#8a5a2a;font-weight:800}
#guildClose{position:absolute;right:-10px;top:-12px;width:48px;height:48px;border:0;background:var(--x) center/100% 100% no-repeat;filter:drop-shadow(0 2px 3px #0008);z-index:3}
#gActive,#gBoard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.gq{border:2px solid #b69055;background:#f3e5c8cc;border-radius:10px;padding:9px;color:var(--ink);min-height:98px}
.gq.done{box-shadow:inset 0 0 0 2px #d39b24}
.gq b{display:block;font-size:14px;margin-bottom:3px}.gq small{display:block;color:#745a38;line-height:1.35}
.gprog{font-size:12px;font-weight:900;color:#7a3b1a;margin:6px 0}
.gq .btn{font-size:12px;padding:4px 10px}
.gsect{font-size:13px;font-weight:900;color:#6b3d18;margin-top:4px}
#bubble{position:fixed;transform:translate(-50%,-100%);display:none;pointer-events:none;background:#fff8e6;color:var(--ink);border:2px solid #b07a35;border-radius:12px;padding:4px 10px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px #0006}
#char{position:fixed;inset:0;background:#120b06b0;display:none;z-index:8}
#char.on{display:block}
#charWrap{position:absolute;left:50%;top:50%;width:1078px;height:659px;transform-origin:center}
#tabs{position:absolute;left:0;top:0;display:flex;gap:6px}
#tabs button{width:76px;height:62px;border:0;padding:0;background:center/100% 100% no-repeat;opacity:.55;filter:drop-shadow(0 2px 3px #0008)}
#tabs button.on{opacity:1;transform:translateY(2px)}
#tabs b{position:absolute;margin-top:62px;width:76px;text-align:center;color:#f3e6c8;font-size:15px;font-weight:900;text-shadow:0 1px 2px #000}
#charClose{position:absolute;right:-6px;top:0;width:58px;height:58px;border:0;padding:0;background:var(--x) center/100% 100% no-repeat;filter:drop-shadow(0 2px 3px #0008)}
#leftPane,#bagPane{position:absolute;top:64px;background:center/100% 100% no-repeat}
#leftPane{left:0}
#bagPane{right:0;width:608px;height:595px}
.slot{position:absolute;border:0;padding:6px;background:transparent;border-radius:10px}
.slot img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px #0008)}
.slot.has{box-shadow:inset 0 0 0 2px var(--rc),0 0 8px -2px var(--rc)}
.slot.sel{box-shadow:inset 0 0 0 3px #ffe08a,0 0 12px #ffd34d}
.slab{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:900;color:#f6e7c6;background:#2a160bcc;border-radius:6px;padding:0 5px}
.slab.hide{display:none}
.held{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:#9e2a22;color:#fff;font-size:11px;font-weight:900;border-radius:7px;padding:0 6px;white-space:nowrap}
.off{position:absolute;background:#1a0f08a0;border-radius:10px}
.fig{position:absolute;left:176px;top:118px;width:134px;height:322px;object-fit:contain;filter:drop-shadow(0 4px 4px #0006)}
.sface{position:absolute;left:52px;top:110px;width:80px;height:80px;border-radius:50%;object-fit:cover;background:#e8d6b0}
.sbar{position:absolute;left:176px;width:156px;height:17px;border-radius:8px;background:#3a2614;overflow:hidden}
.sbar i{display:block;height:100%}
.sbar .b0{background:linear-gradient(#ff6a5a,#c0221c)} .sbar .b1{background:linear-gradient(#6ab8ff,#1f5fc4)} .sbar .b2{background:linear-gradient(#ffd56a,#e09a12)}
.sbar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:17px;font-weight:900;color:#fff;text-shadow:0 1px 1px #000}
.srow{position:absolute;left:92px;width:236px;height:36px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.srow b{width:36px;font-size:15px} .srow em{font-style:normal;font-weight:900;font-size:17px;width:28px;text-align:right;color:#7a3b1a} .srow small{font-size:12px;color:#6b5b45;font-weight:700}
.slv{position:absolute;left:0;right:0;top:572px;text-align:center;font-size:13px;font-weight:900;color:#7a3b1a}
.btitle{position:absolute;left:0;right:0;top:40px;text-align:center;color:#fff4d8;font-weight:900;font-size:20px;text-shadow:0 1px 2px #000}
.bgold{position:absolute;left:96px;top:528px;font-weight:900;font-size:15px;color:#7a4a0a}
.bcnt{position:absolute;right:96px;top:528px;font-weight:800;font-size:13px;color:#6b5b45}
#iinfo{position:fixed;display:none;z-index:9;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);width:168px;border:24px solid transparent;border-image:var(--panel) 62 fill stretch;color:var(--ink);text-align:center}
#iinfo.on{display:block}
.iname{font-weight:900;font-size:15px;line-height:1.2}
.isub{font-size:11px;color:#6b5b45;margin:2px 0 3px;line-height:1.25}
.iic{width:54px;height:54px;object-fit:contain}
.ist{list-style:none;padding:0;margin:3px 0;font-size:13px;font-weight:700;line-height:1.35}
.ist .up{color:#2a8a2a} .ist .dn{color:#c0221c}
.icmp{position:absolute;right:100%;top:50%;transform:translateY(-50%);margin-right:0;display:flex;flex-direction:column;gap:4px;width:150px}
.ccard{border:16px solid transparent;border-image:var(--panel) 62 fill stretch;padding:5px 0 3px;color:var(--ink);text-align:center;font-size:12px}
.ctag{font-size:11px;font-weight:900;color:#7a3b1a}
.ctag.held{color:#b3541a}
.cname{font-weight:900;font-size:13px;line-height:1.2}
.cempty{color:#8a7a62;font-weight:700;margin:2px 0}
.ccard .ist{font-size:12px;margin:2px 0 0}
.cnote{align-self:center;font-size:10px;font-weight:700;color:#f3e6c8;background:#2b1b0fcc;border-radius:8px;padding:1px 8px}
.ibtns{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#fade.slow{transition-duration:.55s}
#fade.on{opacity:1}
#campArt{position:fixed;inset:0;background:#000 center/contain no-repeat;opacity:0;pointer-events:none;transition:opacity .7s;z-index:21}
#campArt.on{opacity:1}
#campArt span{position:absolute;left:0;right:0;bottom:6%;text-align:center;font:700 clamp(14px,2.6vw,22px) sans-serif;color:#fff;text-shadow:0 2px 6px #000}

/* ---- HUD (케인 시안: 좌상단 초상·체력·마나·작은 고리 / 우상단 둥근 미니맵 / 좌하단 조이스틱 / 우하단 큰 공격 버튼 + 스킬 5칸 + 교체) ---- */
#me{left:max(8px,env(safe-area-inset-left));top:6px;display:flex;align-items:flex-start;gap:4px}
#me .ring{position:relative;width:82px;height:88px;flex:none;cursor:pointer;touch-action:manipulation;pointer-events:auto}
#me .ring img{position:absolute;inset:0;width:100%;height:100%}
html.app #fs{display:none}
#me .ring .face{left:13px;top:19px;right:auto;bottom:auto;width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 50%;background:radial-gradient(circle at 50% 40%,#fbeed2,#d9bb8c)}
.bars{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.bar{position:relative;width:166px;aspect-ratio:5.896;background:var(--hpbar) center/100% 100% no-repeat;--l:17.84%;--t:24.44%;--w:75.25%;--h:45.19%}
.bar.mp{background-image:var(--mpbar);aspect-ratio:5.203;--t:30.07%;--w:75.38%;--h:40.52%}
.bar .tr{position:absolute;left:var(--l);width:var(--w);top:var(--t);height:var(--h);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;box-shadow:inset 0 2px 1px #fff5,inset 0 -2px 2px #0004;transition:width .2s}
.bar.hp i{background:linear-gradient(#ff7a6a,#d2291f 60%,#a51a14)}
.bar.mp i{background:linear-gradient(#7cc4ff,#2a6fd6 60%,#1d4fa8)}
.bar span{position:absolute;left:var(--l);width:var(--w);top:var(--t);height:var(--h);display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;text-align:center;color:#fff;font-weight:800;text-shadow:0 1px 1px #000}
.coin{color:#ffe08a;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000,0 0 3px #000;margin-left:30px}
#bagBtn{position:relative;flex:none;margin-top:16px;width:50px;height:50px;border:0;padding:0;border-radius:50%;background:var(--tab0) center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 2px 3px #0009)}
#questTrack{left:max(12px,env(safe-area-inset-left));top:112px;width:286px;display:none;flex-direction:column;gap:2px;pointer-events:auto;cursor:pointer}
#questTrack.on{display:flex}
.qtrack{display:grid;grid-template-columns:17px minmax(0,1fr) auto;align-items:center;gap:5px;min-height:22px;padding:1px 4px;color:#f6e7c8;font:800 11px/1.2 sans-serif;text-shadow:0 2px 3px #000,0 0 5px #000;pointer-events:none}
.qtrack.done{color:#fff0ad}
.qcheck{width:13px;height:13px;border:2px solid #d1a85b;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;background:#26180ccc;box-shadow:0 1px 2px #000}
.qtrack.done .qcheck::after{content:'✓';color:#ffe26f;font-weight:900}
.qtitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qprog{font-size:10px;color:#ffd978;white-space:nowrap}
#mm{right:max(10px,env(safe-area-inset-right));top:8px;width:176px;height:150px;border-radius:50%;border:4px solid #c9923e;box-shadow:0 0 0 3px #4a2a12,inset 0 0 0 2px #e3b35f,0 3px 8px #0009;overflow:hidden;background:#000}
#mm canvas{position:static;width:100%;height:100%}
#place{pointer-events:auto;cursor:pointer;right:max(10px,env(safe-area-inset-right));top:166px;width:190px;text-align:center;color:var(--paper);font-weight:800;font-size:13px;text-shadow:0 1px 2px #000}
#fs{right:max(196px,calc(env(safe-area-inset-right) + 196px));top:10px;pointer-events:auto;border:2px solid #b07a35;background:#2c160acc;color:#f3e6c8;border-radius:8px;font-size:12px;font-weight:700;padding:5px 8px}
#snd{right:max(196px,calc(env(safe-area-inset-right) + 196px));top:44px;pointer-events:auto;border:2px solid #b07a35;background:#2c160acc;color:#f3e6c8;border-radius:8px;font-size:12px;font-weight:700;padding:5px 8px}
#panic{right:max(196px,calc(env(safe-area-inset-right) + 196px));top:78px;pointer-events:auto;border:2px solid #d87358;background:#6b1d18e8;color:#fff1df;border-radius:8px;font-size:11px;font-weight:900;padding:5px 8px;box-shadow:0 2px 4px #0008}
#panic[hidden]{display:none}
#joy{left:0;bottom:0;width:46%;height:72%;pointer-events:auto;touch-action:none;overscroll-behavior:none}
#stick{position:fixed;left:max(46px,calc(env(safe-area-inset-left) + 46px));bottom:34px;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,#ffffff22,#ffffff14 60%,#ffffff08);border:2px solid #ffffff30;pointer-events:none;opacity:.45;transition:opacity .15s}
#stick.act{opacity:1}
#knob{position:absolute;left:36px;top:36px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff70,#ffffff35);box-shadow:0 2px 6px #0005}
#cluster{position:fixed;right:max(24px,calc(env(safe-area-inset-right) + 24px));bottom:52px;width:124px;height:124px;pointer-events:none}
#atk{position:absolute;inset:0;border:0;padding:0;border-radius:50%;background:var(--ring) center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 4px 6px #000a);transition:transform .08s}
#atk:active{transform:scale(.95)}
#atkIc{position:absolute;left:22%;top:22%;width:56%;height:56%;object-fit:contain;filter:drop-shadow(0 2px 2px #0008)}
#atkCap{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:900;color:#fff4d8;text-shadow:0 1px 2px #000,0 0 3px #000}
#atk.talk #atkIc{opacity:.35}
.sk{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:0;padding:0;border-radius:50%;background:center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 3px 4px #0009)}
.sk[hidden]{display:none}
.sk i{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(#000a var(--cd,0turn),transparent 0)}
.sk:active{transform:scale(.93)}
.pot{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border:0;padding:0;border-radius:50%;background:center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 3px 4px #0009)}
.pot:active{transform:scale(.93)}
.pot.none{filter:grayscale(1) brightness(.6) drop-shadow(0 3px 4px #0009)}
.pot b{position:absolute;right:-3px;bottom:-3px;min-width:19px;height:19px;border-radius:10px;background:#2a160b;border:2px solid #e3b35f;color:#fff;font-size:11px;line-height:15px;text-align:center;padding:0 3px}
#swap{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;padding:0;border-radius:50%;background:var(--swapI) center/100% 100% no-repeat;pointer-events:auto;color:#ffe9b8;font-weight:900;filter:drop-shadow(0 3px 4px #0009)}
#swap small{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;background:#9e2a22;border:2px solid #e3b35f;font-size:11px;line-height:16px;text-align:center}

#lvOrb{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--ring) center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;filter:drop-shadow(0 2px 2px #0008)}
#lvOrb b{font-size:14px;line-height:13px;color:#ffe08a;text-shadow:0 1px 2px #000}
#lvOrb small{font-size:8px;line-height:8px;color:#f3e6c8;font-weight:800}
.sk.empty{opacity:.75}
.sk[data-pen]:not([data-pen=''])::after{content:attr(data-pen);position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:10px;font-weight:900;color:#fff;background:#2a160bdd;border-radius:6px;padding:0 4px;white-space:nowrap}.sk[data-glyph]:not([data-glyph=''])::before{content:attr(data-glyph);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900;color:#ffe9b8;text-shadow:0 2px 3px #000;z-index:2}
#cluster.drop{z-index:12}
#cluster.drop .sk{outline:2px dashed #ffe08a;outline-offset:2px}
#ghost{position:fixed;width:58px;height:58px;margin:-29px 0 0 -29px;pointer-events:none;display:none;z-index:13;filter:drop-shadow(0 4px 6px #000a)}
.skpane{position:absolute;inset:0;border:30px solid transparent;border-image:var(--panel) 62 fill stretch;color:var(--ink);overflow-y:auto;overflow-x:hidden;padding-right:4px;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.skhead{font-weight:900;font-size:16px;margin:-8px 0 2px;text-align:center}
.sknote{font-size:11px;color:#6b5b45;text-align:center;margin-bottom:4px}
.skrow{display:flex;align-items:center;gap:6px;min-height:56px}
.skrow>b{width:58px;font-size:13px;flex:none}
.skcwrap{display:flex;align-items:center;gap:2px;position:relative}
.skc{width:46px;height:46px;border:0;padding:0;border-radius:50%;background:center/100% 100% no-repeat;touch-action:pan-y;cursor:grab}
.skc.lock{filter:grayscale(1) brightness(.55);cursor:default}
.skrank{font-size:10px;font-weight:900;min-width:26px;text-align:center;color:#6b3d18}
.growplus{width:25px;height:25px;border:1px solid #9b6d35;background:#6d421d;color:#ffe9b5;border-radius:6px;font-weight:900;padding:0;line-height:22px}
.growplus:disabled{opacity:.3}
.passgrid,.lifegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:4px 0 8px}
.skilltile{display:grid;grid-template-columns:50px 1fr 26px;grid-template-rows:23px 25px;gap:0 6px;align-items:center;min-height:56px;border:1px solid #a7855738;border-radius:9px;background:#f3e5c866;padding:4px 5px}

const vils = A.vils.map((v, i) => {

    sp: v.name === 'kid' ? 95 : v.name === 'grandpa' ? 42 : rand(55, 70), stuck: 0, hidden: false, ph: rand(0, 7) };
});
function vBlocked(x, y){
  const r = 9;
  if (x < r || y < 30 || x > MWp - r || y > MHp - 6) return true;
  for (const s of solids){
    const cx = Math.max(s.x0, Math.min(x, s.x1)), cy = Math.max(s.y0, Math.min(y, s.y1));
    if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true;
  }
  return Math.hypot(x - P.x, y - P.y) < 22;
}
function updVils(dt, night){
  for (const v of vils){
    if (v.hidden){ // 아침이 되면 집에서 나옴
      if (!night && Math.random() < dt * 0.3){ v.hidden = false; v.x = v.home.x; v.y = v.home.y; v.wait = 0.5; }
      continue;
    }
    if (night && !v.goingHome){ v.goingHome = true; v.tx = v.home.x; v.ty = v.home.y; v.wait = 0; }
    if (!night) v.goingHome = false;
    if (v.wait > 0){ v.wait -= dt; v.moving = false; v.t = 0; continue; }
    const dx = v.tx - v.x, dy = v.ty - v.y, d = Math.hypot(dx, dy);
    if (d < 6){
      if (v.goingHome){ v.hidden = true; continue; }
      v.wait = rand(1.2, 4.5); const n = WP[Math.floor(rand(0, WP.length))]; v.tx = n.x + rand(-20, 20); v.ty = n.y + rand(-14, 14);
      v.dir = 'front'; continue;
    }
    const sp = (v.goingHome ? v.sp * 1.3 : v.sp) * (v.name === 'kid' && Math.sin(T * 0.7 + v.ph) > 0.6 ? 1.8 : 1);
    const mx = dx / d * sp * dt, my = dy / d * sp * dt, ox = v.x, oy = v.y;
    if (!vBlocked(v.x + mx, v.y)) v.x += mx;
    if (!vBlocked(v.x, v.y + my)) v.y += my;
    const moved = Math.hypot(v.x - ox, v.y - oy);
    v.moving = moved > 0.2; v.t += dt * (sp / 60);
    if (moved < sp * dt * 0.3){ v.stuck += dt; if (v.stuck > 1.2){ v.stuck = 0;
      if (v.goingHome){ v.hidden = true; continue; }
      const n = WP[Math.floor(rand(0, WP.length))]; v.tx = n.x; v.ty = n.y; } }
    else v.stuck = 0;
    if (Math.abs(dx) > Math.abs(dy) * 1.2){ v.dir = 'side'; v.flip = dx > 0; } else v.dir = dy < 0 ? 'back' : 'front';
  }
}
function drawVil(v){

  ctx.save();
  if (v.flip && v.dir === 'side'){ ctx.translate(v.x, 0); ctx.scale(-1, 1); ctx.translate(-v.x, 0); }
  ctx.drawImage(fr, v.x - v.w / 2, v.y - v.h + 4, v.w, v.h);

}

function weather(dt, camX, camY, vw, vh){
  W.t -= dt;

    c.x += 9 * c.s * W.wind * dt; c.y += 2.5 * c.s * dt;
    if (c.x - c.r > MWp){ c.x = -c.r * 1.5; c.y = rand(0, MHp); }
  }
  // 비
  const want = Math.floor(W.rain * 220);
  while (drops.length < want) drops.push({ x: rand(0, vw), y: rand(-vh, 0), v: rand(620, 820), l: rand(10, 18) });
  if (drops.length > want) drops.length = want;
  for (const d of drops){
    d.y += d.v * dt; d.x += d.v * 0.22 * dt;
    if (d.y > vh){

  [0.00, [255, 226, 205], 0.35], [0.08, [255, 246, 236], 0], [0.30, [255, 255, 255], 0], [0.52, [255, 240, 212], 0],
  [0.63, [248, 196, 150], 0.25], [0.71, [150, 130, 190], 0.75], [0.78, [92, 104, 168], 1], [0.92, [86, 96, 160], 1], [1.00, [255, 226, 205], 0.35]];
function dayLook(t){
  for (let i = 0; i < KEYS.length - 1; i++){
    const a = KEYS[i], b = KEYS[i + 1];
    if (t >= a[0] && t <= b[0]){
      const k = (t - a[0]) / (b[0] - a[0]), s = k * k * (3 - 2 * k);
      return { c: a[1].map((v, j) => Math.round(v + (b[1][j] - v) * s)), lamp: a[2] + (b[2] - a[2]) * s };
    }
  }
  return { c: [255, 255, 255], lamp: 0 };
}

  while(sfx.length&&sfx[0].t>.8)sfx.shift();
}

// 휘두름 궤적(초승달)
function arcFx(cx, cy, r, a0, a1, k){
  if (k <= 0 || k >= 1) return;
  ctx.save(); ctx.globalAlpha = 0.85 * (1 - k); ctx.strokeStyle = '#fff6dc'; ctx.lineCap = 'round';
  ctx.lineWidth = 7 * (1 - k) + 1.5; ctx.beginPath();
  // 각도 0 = 위 → 캔버스 각도로 바꿈(-PI/2)
  ctx.arc(cx, cy, r, Math.min(a0, a1) - PI / 2, Math.max(a0, a1) - PI / 2); ctx.stroke(); ctx.restore();
}
const lerp = (a, b, t) => a + (b - a) * t;
// 찌르기 잔상(창 아래 공격)
function streak(x, y, dx, dy, t, r){
  if (t <= 0 || r >= 1) return;
  ctx.save(); ctx.globalAlpha = 0.9 * (1 - r); ctx.strokeStyle = '#fff6dc'; ctx.lineCap = 'round';
  ctx.lineWidth = 6 * (1 - r) + 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx * 60 * t, y + dy * 60 * t); ctx.stroke(); ctx.restore();
}
// 주먹 충격(건틀릿 아래 공격)
function burst(x, y, r){
  if (r >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - r; ctx.strokeStyle = '#fff1c8'; ctx.lineWidth = 3; const R0 = 6 + r * 16;
  for (let i = 0; i < 8; i++){ const a = i * PI / 4; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * R0 * 0.5, y + Math.sin(a) * R0 * 0.5); ctx.lineTo(x + Math.cos(a) * R0, y + Math.sin(a) * R0); ctx.stroke(); }
  ctx.restore();
}
// 공격 단계: 준비(0~0.3) → 타격(0.3~0.6) → 회수
function phase(k){ return k < 0.3 ? { w: k / 0.3, s: 0, r: 0 } : k < 0.6 ? { w: 1, s: (k - 0.3) / 0.3, r: 0 } : { w: 1, s: 1, r: Math.min(1, (k - 0.6) / 0.4) }; }
function weaponLayers(){
  // 반환: { back: fn, front: fn, lunge:[dx,dy] } — 좌표는 "오른쪽을 보는" 기준(옆모습은 나중에 뒤집음)
  const x = P.x, y = P.y, out = { back: null, front: null, lunge: [0, 0] };
  if (!WPN) return out;
  const wt = WPN.wt;
  if (!atkBusy()) return out; // 걷기·서 있기에는 무기를 그리지 않음
  const a = P.atk, k = Math.min(1, a.t / DUR[wt]), ph = phase(k), d = a.dir;
  const thrust = ph.s * (1 - ph.r), alt = a.n % 2 ? 1 : -1;
  out.lunge = d === 'side' ? [3 * thrust, 0] : d === 'front' ? [0, 3 * thrust] : [0, -3 * thrust];
  if (d === 'side'){ // 무기는 모두 몸 뒤
    if (wt === 'sword'){ const an = ph.s === 0 ? lerp(-0.6, -2.0, ph.w) : lerp(-2.0, 1.9, ph.s) - ph.r * 0.6;
      out.back = () => wDraw(x + 22, y - 32, an);
      out.front = () => arcFx(x + 22, y - 32, 52, -1.6, lerp(-1.6, 1.9, ph.s), ph.r * 1.4 + (ph.s > 0 ? 0.01 : 1)); }
    else if (wt === 'spear') out.back = () => wDraw(x - 6 - 10 * (1 - ph.w) + 34 * thrust, y - 40, PI / 2);
    else if (wt === 'bow') out.back = () => wDraw(x + 20, y - 44, 0, 1, true);
    else if (wt === 'staff') out.back = () => wDraw(x + 26 + 8 * thrust, y - 42, lerp(0.35, 1.2, thrust) - 0.25 * ph.w * (1 - ph.s));
    else out.back = () => wDraw(x + 18 + 20 * thrust, y - 44 + (alt > 0 ? 8 : -2), -PI / 2, 1.1, true);  // 주먹(그림 아래쪽)이 앞을 향하게
  } else if (d === 'back'){
    if (wt === 'sword'){ const an = ph.s === 0 ? lerp(0, -1.5, ph.w) : lerp(-1.5, 1.5, ph.s);
      out.back = () => { wDraw(x + 4, y - 58, an); arcFx(x + 4, y - 58, 48, -1.5, lerp(-1.5, 1.5, ph.s), ph.r * 1.4 + (ph.s > 0 ? 0.01 : 1)); }; }
    else if (wt === 'spear') out.back = () => wDraw(x + 7, y - 58 - 32 * thrust, 0);
    else if (wt === 'bow') out.back = () => wDraw(x, y - 80, PI / 2);
    else if (wt === 'staff') out.back = () => wDraw(x + 9, y - 60 - 8 * thrust, lerp(0.25, -0.1, thrust));
    else out.back = () => wDraw(x + 10 * alt, y - 70 - 16 * thrust, PI, 1.1);
  } else { // 정면(아래로 공격): 무기는 그리지 않고 이펙트만
    if (wt === 'sword') out.front = () => arcFx(x, y - 30, 46, PI - 1.4, lerp(PI - 1.4, PI + 1.4, ph.s), ph.r * 1.4 + (ph.s > 0 ? 0.01 : 1));
    else if (wt === 'spear') out.front = () => streak(x + 4, y - 30, 0, 1, thrust, ph.r);
    else if (wt === 'gauntlet') out.front = () => burst(x + 10 * alt, y - 18 + 14 * thrust, ph.s > 0 ? ph.r : 1);
  }
  return out;
}
function drawMe(){
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(P.x, P.y, 17, 6, 0, 0, 7); ctx.fill();
  const busy = atkBusy(), dir = busy ? P.atk.dir : P.dir, flip = busy ? P.atk.flip : P.flip;
  const fr = EL[dir][P.moving ? 1 + (Math.floor(P.t * (P.run ? 14 : 9)) % 4) : 0];
  const h = 98, w = h * 170 / 172, by = P.y + h * (11 / 344);
  const L = weaponLayers();
  ctx.save();
  if (flip && dir === 'side'){ ctx.translate(P.x, 0); ctx.scale(-1, 1); ctx.translate(-P.x, 0); }
  if (L.back) L.back();
  ctx.drawImage(fr, P.x - w / 2 + L.lunge[0], by - h + L.lunge[1], w, h);
  if (L.front) L.front();
  ctx.restore();
}

// ======================= 전투 이펙트(VFX) =======================
// 시트에서 잘라 낸 그림(assets/vfx, tools/vfx_slice.py)으로 스킬·타격·몬스터 공격·상태이상을 그린다.
// 그림이 아직 안 불러졌으면 각 호출부가 예전 선 그림으로 대신 그린다(vfxReady).
const VFXI = {};
(function(){
  const src = (typeof A !== 'undefined' && A.vfx) || {};
  for (const k in src){ const im = new Image(); im.src = src[k]; VFXI[k] = im; }
})();
// 투사체 그림이 가리키는 방향(도, 캔버스 기준: 0=오른쪽, 90=아래). 날아가는 방향에 맞춰 돌릴 때 쓴다.
const VFX_HEAD = { shot_fire:145, shot_rock:155, shot_poison:150, shot_dark:142, shot_holy:155, shot_ice:-33, shot_blade:0 };
const VFX_STATUS = { burn:'fire', slow:'slow', freeze:'ice', stone:'stone', bleed:'blood' };

// 효과별 지속 시간(초). town.js의 drawSkillFx와 아래 바닥 층이 같이 쓴다.
const VFX_DUR = { heal:.75, hit:.26, hurt:.3, kill:.55, fireburst:.55, iceburst:.55, icehit:.45, castfire:.75, castice:.75, slashpower:.42, spinpower:.45,
  firestorm:.6, frostwave:.55, chain:.4, voltburst:.45, darkburst:.5, waveburst:.4, castdark:.75, castbolt:.75 };

function vfxReady(n){ const im = VFXI[n]; return !!(im && im.complete && im.naturalWidth > 0); }
// n 그림을 (x,y)에 가로 w 크기로 그린다. o: rot(라디안) alpha add(밝게 겹치기) base(그림 아랫변을 y에 맞춤) sy(세로 눌림) flip
function vfxDraw(n, x, y, w, o){
  const im = VFXI[n]; if (!vfxReady(n)) return false;
  o = o || {};
  const h = w * im.naturalHeight / im.naturalWidth;
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, o.alpha == null ? ctx.globalAlpha : o.alpha));
  if (o.add) ctx.globalCompositeOperation = 'lighter';
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.sy) ctx.scale(1, o.sy);
  if (o.flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -w / 2, o.base ? -h : -h / 2, w, h);
  ctx.restore();
  return true;
}
// 한 번 터지는 연출: 작게 시작해 커지며 사라진다. k = 0~1 진행도
function vfxPlay(n, x, y, size, k, o){
  o = o || {};
  const s0 = o.s0 == null ? .55 : o.s0;
  const e = 1 - Math.pow(1 - Math.min(1, k * 1.7), 3);
  const w = size * (s0 + (1 - s0) * e) * (1 + k * .1);
  const a = k < .12 ? k / .12 : Math.max(0, 1 - Math.pow((k - .12) / .88, 1.5));
  return vfxDraw(n, x, y, w, Object.assign({}, o, { alpha: a * (o.alpha == null ? 1 : o.alpha) }));
}
function vfxPick(f, list){ if (f.v == null) f.v = Math.floor(Math.random() * 1000); return list[f.v % list.length]; }

// 스킬·타격 이펙트 하나를 그린다. 그렸으면 true (drawSkillFx가 부름)
function vfxSkill(f, k, x, y, r){
  if (f.type === 'chain') return vfxChain(f, k);
  if (!vfxReady('burst_fire_0')) return false;
  switch (f.type){
    // 폭발 그림 크기는 실제로 맞는 범위(r)에 맞춘다. 몬스터 몸집을 크게 넘지 않게.
    case 'fireburst': return vfxPlay('burst_fire_' + vfxPick(f, [0, 1, 2]), x, y + 14, Math.max(96, r * 1.9), k, { base: true, s0: .45 });
    case 'iceburst':  return vfxPlay('burst_ice_' + vfxPick(f, [0, 2, 4]), x, y + 14, Math.max(90, r * 1.9), k, { base: true, s0: .45 });
    case 'icehit':    return vfxPlay('burst_ice_2', x, y + 10, Math.max(70, r * 2.3), k, { base: true, s0: .5 });
    case 'heal':      return true;   // 치유 마법진은 vfxGroundPass가 캐릭터 발밑(아래 층)에 그린다
    case 'castfire': case 'castice': case 'castdark': case 'castbolt': return true;
    case 'firestorm':{
      const e = 1 - Math.pow(1 - Math.min(1, k * 1.6), 3);
      for (let i = 0; i < 10; i++){
        const a = i * .6283 + .3, rr = r * (.35 + .65 * e) * (i % 2 ? 1 : .8);
        vfxPlay('burst_fire_' + (i % 3), x + Math.cos(a) * rr, y + 14 + Math.sin(a) * rr * .6, 78, k, { base: true, s0: .4 });
      }
      return vfxPlay('burst_fire_1', x, y + 14, 100, k, { base: true, s0: .4 });
    }
    case 'frostwave':{
      const a = f.a || 0, e = 1 - Math.pow(1 - Math.min(1, k * 1.5), 3);
      for (let i = 0; i < 9; i++){
        const row = i % 3, idx = Math.floor(i / 3) - 1, dist = r * (.3 + .3 * row) * (.4 + .6 * e), lat = idx * dist * .5;
        vfxPlay('burst_ice_' + ((i * 2) % 5), x + Math.cos(a) * dist - Math.sin(a) * lat, y + 10 + Math.sin(a) * dist + Math.cos(a) * lat, 58 + row * 14, k, { base: true, s0: .4 });
      }
      return true;
    }
    case 'voltburst': return vfxPlay('burst_volt_' + vfxPick(f, [0, 2, 4]), x, y + 14, Math.max(70, r * 2.3), k, { base: true, s0: .5 });
    case 'darkburst': return vfxPlay('burst_dark_' + vfxPick(f, [0, 2, 4]), x, y + 14, Math.max(70, r * 2.3), k, { base: true, s0: .5 });
    case 'waveburst': return vfxPlay('hit_spark_3', x, y, Math.max(70, r * 2.4), k, { add: true, s0: .45 });   // 발밑 마법진은 vfxGroundPass가 캐릭터 아래 층에 그린다
    case 'slashpower':{
      const a = f.a || 0, nm = 'hit_slash_' + vfxPick(f, [0, 2, 3]);
      return vfxPlay(nm, x + Math.cos(a) * r * .5, y + Math.sin(a) * r * .5, r * 1.9, k, { rot: a + Math.PI / 4, add: true, s0: .7 });
    }
    case 'spinpower':{
      const a = Math.max(0, 1 - Math.pow(k, 1.6));
      vfxDraw('hit_slash_0', x, y, r * 2.1, { rot: k * 7 + Math.PI / 4, alpha: a, add: true });
      return vfxDraw('hit_slash_2', x, y, r * 2.1, { rot: k * 7 + Math.PI * 1.25, alpha: a, add: true });
    }
    case 'hit':       return vfxPlay('hit_spark_' + (f.crit ? 3 : vfxPick(f, [0, 2, 4])), x, y, r * 2.2, k, { add: true, s0: .45 });
    case 'hurt':      return vfxPlay('hit_spark_1', x, y, r * 2.0, k, { add: true, s0: .5 });
    case 'kill':      return vfxPlay('hit_rock_12', x, y + 6, r * 2.4, k, { base: true, s0: .5, alpha: .9 });
    default:          return vfxPlay('hit_spark_' + vfxPick(f, [0, 2, 4]), x, y, Math.max(70, r * 2.4), k, { add: true, s0: .5 });
  }
}
// 날아가는 것 밑에 바닥 그림자와 번지는 빛을 깔아서 "떠다니는 그림"처럼 보이지 않게 한다.
function vfxAura(x, y, col, r){
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x, y + 40, 15, 5, 0, 0, 7); ctx.fill();
  if (col){
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x, y, 0, x, y, r || 34);
    g.addColorStop(0, col + 'aa'); g.addColorStop(1, col + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r || 34, 0, 7); ctx.fill();
  }
  ctx.restore();
}
const VFX_AURA = { shot_fire:'#ff8a2a', shot_ice:'#7ddcff', shot_dark:'#a050ff', shot_holy:'#ffe9a0', shot_poison:'#8cff38', shot_rock:'', shot_blade:'#cfe8ff' };
// 플레이어가 쏘는 투사체(지팡이·마법·검기·파동). 그렸으면 true
const VFX_PSHOT = { ice:'shot_ice', fire:'shot_fire', dark:'shot_dark', blade:'shot_blade', wave:'shot_holy' };
function vfxShot(s, a){
  if (s.kind === 'bolt') return vfxBoltOrb(s);
  const nm = VFX_PSHOT[s.kind] || '';
  if (!nm || !vfxReady(nm)) return false;
  vfxAura(s.x, s.y, VFX_AURA[nm], nm === 'shot_blade' ? (s.hw || 60) * .8 : s.pellet ? 16 : 36);
  const w = s.pellet ? 30 : nm === 'shot_blade' ? (s.hw || 60) * 2.6 : nm === 'shot_ice' ? 78 : nm === 'shot_holy' ? 84 : nm === 'shot_dark' ? 76 : 70;
  return vfxDraw(nm, s.x, s.y, w, { rot: a - (VFX_HEAD[nm] || 0) * Math.PI / 180, alpha: 1 });
}
// 번개 구체: 그림 없이 빛 덩어리와 튀는 전기줄기로 그린다
function vfxBoltOrb(s){
  const t = performance.now() / 1000;
  vfxAura(s.x, s.y, '#ffe45c', 40);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 17);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.4, '#ffe45c'); g.addColorStop(1, 'rgba(255,200,40,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, 17, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fffbd0'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++){
    const a = t * 9 + i * 1.57 + Math.sin(t * 31 + i) * .6, l = 14 + 10 * Math.abs(Math.sin(t * 23 + i * 2.1));
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + Math.cos(a) * l * .55 + Math.sin(a * 3) * 3, s.y + Math.sin(a) * l * .55); ctx.lineTo(s.x + Math.cos(a) * l, s.y + Math.sin(a) * l); ctx.stroke();
  }
  ctx.restore();
  return true;
}
// 연쇄 벼락: 맞은 대상들을 잇는 지그재그 전기줄기 + 맞은 곳 번개 폭발
function vfxChain(f, k){
  const p = f.pts; if (!p || p.length < 2) return true;
  if (f.seed == null) f.seed = Math.random() * 100;
  const a = Math.max(0, 1 - k * k), tick = Math.floor(k * 14);
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 1; i < p.length; i++){
    const A = p[i - 1], B = p[i], dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, n = 7, amp = 14 * Math.min(1, L / 80);
    const path = () => {
      ctx.beginPath(); ctx.moveTo(A.x, A.y);
      for (let j = 1; j < n; j++){ const t = j / n, o = Math.sin(f.seed + i * 3.1 + j * 5.7 + tick * 1.7) * amp; ctx.lineTo(A.x + dx * t + nx * o, A.y + dy * t + ny * o); }
      ctx.lineTo(B.x, B.y);
    };
    ctx.globalAlpha = a * .55; ctx.strokeStyle = '#ffd93a'; ctx.lineWidth = 9 * (1 - k) + 3; path(); ctx.stroke();
    ctx.globalAlpha = a; ctx.strokeStyle = '#fffbe0'; ctx.lineWidth = 3.2 * (1 - k) + 1.2; path(); ctx.stroke();
  }
  ctx.restore();
  for (let i = 1; i < p.length; i++) vfxPlay('burst_volt_' + ((i * 2) % 5), p[i].x, p[i].y + 22, 76, k, { base: true, s0: .5 });
  return true;
}
// ---- 바닥 층: 캐릭터·몬스터보다 아래에 깔리는 효과 (town.js 그리기 순서에서 스프라이트 앞에 부름) ----
function vfxGroundPass(){
  if ((!sfx.length && !zones.length) || !vfxReady('burst_fire_0')) return;
  vfxZonesGround();
  for (const f of sfx){
    const k = f.t / (VFX_DUR[f.type] || .38); if (k < 0 || k >= 1) continue;
    const x = f.x == null ? P.x : f.x, y = f.y == null ? P.y - 30 : f.y, r = f.r || 72;
    // 시전 마법진은 캐릭터 발에 붙어 따라다닌다(달리면서 써도 발밑에 있음)
    if (f.type === 'castfire') vfxCastCircle(k, P.x, P.y + 4, r, '#ff7a2a', '#ffd9a0', 'ring_red');
    else if (f.type === 'castice') vfxCastCircle(k, P.x, P.y + 4, r, '#5fcfff', '#e8fbff', 'ring_blue');
    else if (f.type === 'castdark') vfxCastCircle(k, P.x, P.y + 4, r, '#a050ff', '#ecd9ff', 'ring_blue');
    else if (f.type === 'castbolt') vfxCastCircle(k, P.x, P.y + 4, r, '#ffe45c', '#fffbd0', 'ring_gold');
    else if (f.type === 'heal') vfxPlay('heal_green', P.x, P.y + 10, r * 2.2, k, { s0: .75, base: true, sy: .78 });
    else if (f.type === 'firestorm') vfxGroundBurst(k, x, y + 14, r, '#ff8a2a', true);
    else if (f.type === 'frostwave') vfxGroundBurst(k, x + Math.cos(f.a || 0) * r * .5, y + 14 + Math.sin(f.a || 0) * r * .5, r * .7, '#8de4ff', false);
    else if (f.type === 'fireburst') vfxGroundBurst(k, x, y + 14, r, '#ff8a2a', true);
    else if (f.type === 'iceburst' || f.type === 'icehit') vfxGroundBurst(k, x, y + 12, f.type === 'icehit' ? r * 1.3 : r, '#8de4ff', false);
  }
}
// ---- 시간이 걸리는 효과(운석·파멸의 링): 바닥 층 ----
function vfxZonesGround(){
  for (const z of zones){
    if (z.type === 'meteor'){
      if (z.t < z.delay){   // 낙하 예고: 붉은 원이 조여 들어온다
        const k = z.t / z.delay, pulse = .55 + .25 * Math.sin(z.t * 22);
        ctx.save(); ctx.translate(z.x, z.y); ctx.scale(1, .55);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, z.r); g.addColorStop(0, 'rgba(255,90,30,.28)'); g.addColorStop(1, 'rgba(255,60,20,.06)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, z.r, 0, 7); ctx.fill();
        ctx.strokeStyle = '#ff5a1a'; ctx.globalAlpha = pulse; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, z.r, 0, 7); ctx.stroke();
        ctx.globalAlpha = .9; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.arc(0, 0, z.r * (1 - k * .85), 0, 7); ctx.stroke();
        ctx.restore();
      } else {   // 불타는 바닥
        const left = z.delay + z.life - z.t, a = Math.min(1, left / .7);

// 발밑에서 위잉 돌며 떠오르는 마법진. 캐릭터 아래에 깔린다.
function vfxCastCircle(k, x, gy, r, col, col2, img){
  const a = k < .15 ? k / .15 : k > .65 ? (1 - k) / .35 : 1;
  const e = 1 - Math.pow(1 - Math.min(1, k * 2.2), 3), R = Math.max(30, r * 1.15) * (.6 + .4 * e);
  const spin = k * 11;
  ctx.save();
  // 바닥을 물들이는 빛(밝은 땅에서 하얗게 날아가지 않게 일반 합성)
  ctx.save(); ctx.translate(x, gy); ctx.scale(1, .5);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.3);
  g.addColorStop(0, col + '66'); g.addColorStop(.6, col + '33'); g.addColorStop(1, col + '00');
  ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 1.3, 0, 7); ctx.fill();
  // 도는 마법진(바닥에 눕힌 원)
  ctx.lineCap = 'round';
  const ring = (rad, rot, dash, lw, c, al) => {
    ctx.save(); ctx.rotate(rot); ctx.setLineDash(dash); ctx.strokeStyle = c; ctx.globalAlpha = a * al; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(0, 0, rad, 0, 7); ctx.stroke(); ctx.restore();
  };
  ring(R, spin * .6, [], 7, col, .75); ring(R, spin * .6, [], 2.5, col2, 1);
  ring(R * .78, -spin, [14, 9], 4.5, col, .9);
  ring(R * .5, spin * 1.4, [6, 8], 3.5, col, .9);
  for (const dir of [1, -1]){   // 겹친 두 삼각형(육망성)
    ctx.save(); ctx.rotate(spin * .8 * dir); ctx.strokeStyle = col; ctx.globalAlpha = a * .9; ctx.lineWidth = 3; ctx.setLineDash([]);
    ctx.beginPath();
    for (let i = 0; i < 3; i++){ const an = i * 2.0944 + (dir > 0 ? 0 : 1.0472); ctx[i ? 'lineTo' : 'moveTo'](Math.cos(an) * R * .72, Math.sin(an) * R * .72); }
    ctx.closePath(); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  // 그림 시트의 마법진을 아래에 은은하게 겹쳐 색감을 더함
  vfxDraw(img, x, gy + 2, R * 2.3, { alpha: a * .5, sy: .8 });
  // 위로 솟는 빛줄기
  ctx.strokeStyle = col2; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 9; i++){
    const an = i * .698 + spin * .5, px = x + Math.cos(an) * R * .85, py = gy + Math.sin(an) * R * .85 * .5;
    const rise = ((k * 2.2 + i * .13) % 1), h = 14 + 34 * rise;
    ctx.globalAlpha = a * (1 - rise) * .9;
    ctx.beginPath(); ctx.moveTo(px, py - 40 * rise); ctx.lineTo(px, py - 40 * rise - h); ctx.stroke();
  }
  ctx.restore();
}
// 폭발 자리 바닥: 번지는 빛 + 퍼지는 충격 고리 + (불은) 그을음. 폭발 그림 아래에 깔린다.
function vfxGroundBurst(k, x, gy, r, col, scorch){
  const e = 1 - Math.pow(1 - Math.min(1, k * 1.8), 3), a = 1 - Math.pow(k, 1.6);
  ctx.save(); ctx.translate(x, gy); ctx.scale(1, .5);

    sg.addColorStop(0, 'rgba(20,8,2,.38)'); sg.addColorStop(1, 'rgba(20,8,2,0)');
    ctx.globalAlpha = Math.min(1, k * 6) * (1 - Math.pow(k, 2.2)); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, r * .95, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.3);
  g.addColorStop(0, col + '88'); g.addColorStop(.55, col + '30'); g.addColorStop(1, col + '00');
  ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 1.3, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = col; ctx.lineWidth = 6 * (1 - k) + 1.5; ctx.globalAlpha = a * .7;

}

// 쓸 수 있으면 true, 대상이 없어 못 썼으면 false(마나·쿨타임 되돌림)
function castExtra(id, d, rank, cm, mod, skillMul){

    }
    case 'fire3': {
      const tg = nearestShotTarget(P.x, P.y - 30, 420);

      if (blocked(gx, gy)){ gx = P.x + d[0] * 50; gy = P.y + d[1] * 40; }
      const em = mag * (1 + (cm.fire || 0) / 100);
      zones.push({ type:'meteor', map:(typeof MAP !== 'undefined' ? MAP : ''), x:gx, y:gy, t:0, delay:.85, r:125 + (rank >= 5 ? 15 : 0),
        dmg:Math.round(em * (9 + rank * .3)), tickDmg:Math.round(em * (.8 + rank * .04)), life:3 + (rank >= 4 ? 2 : 0), hit:false, tick:.5 });
      sfx.push({ type:'castfire', t:0, x:P.x, y:P.y - 36, r:72 });

    }
    case 'ice2': {

          hitTarget(t, d, true, dm);

      sfx.push({ type:'castice', t:0, x:P.x, y:P.y - 34, r:54 }, { type:'frostwave', t:0, a:ang, x:P.x, y:P.y - 30, r:R });

      return true;
    }
    case 'bolt1': {
      // 전기 구체 3개가 전방 60도로 아주 느리게 퍼져 나가며, 닿아 있는 동안 계속 감전시킨다
      const rng = 360 + home * 80, aim = home > 0 ? magicAim(95, rng) : { vx:d[0] * 95, vy:d[1] * 95 };
      const a0 = Math.atan2(aim.vy, aim.vx), tick = Math.round(mag * (.28 + rank * .014));   // 느려진 만큼 한 적에게 틱이 더 많이 들어가므로 틱 피해를 낮춤
      for (const off of [-1, 0, 1]){
        const a = a0 + off * Math.PI / 6;

          pierce:true, rehit:.24, hit:new Map(), hw:30, blast:0, fx:'voltburst', dmg:tick, stagger:false });

    case 'dark1': {

function pierceHit(s, t){

function updZones(dt){
  for (let i = zones.length - 1; i >= 0; i--){
    const z = zones[i];
    if (typeof MAP !== 'undefined' && z.map !== MAP){ zones.splice(i, 1); continue; }
    z.t += dt;
    if (z.type === 'meteor'){
      if (!z.hit && z.t >= z.delay){
        z.hit = true;
        for (const t of combatTargets()) if (skGround(t, z) < z.r){ hitTarget(t, [Math.sign(t.x - z.x) || 1, Math.sign(t.y - z.y) || 0], true, z.dmg); applyMonsterStatus(t, 'burn', 3.5); }
        sfx.push({ type:'fireburst', t:0, x:z.x, y:z.y - 14, r:z.r });
      }
      if (z.hit){
        z.tick -= dt;
        if (z.tick <= 0){ z.tick += .5; for (const t of combatTargets()) if (skGround(t, z) < z.r * .85){ hitTarget(t, [0, 0], false, z.tickDmg); applyMonsterStatus(t, 'burn', 2.5); } }
      }
      if (z.t > z.delay + z.life) zones.splice(i, 1);
    } else if (z.type === 'darkpulse'){
      const e = Math.min(1, z.t / z.exp), cr = z.R * (1 - Math.pow(1 - e, 2));
      while (z.nextTick <= z.dur + .001 && z.t >= z.nextTick){
        z.nextTick += .28;
        for (const t of combatTargets()){
          if (skGround(t, z) > cr + 14) continue;
          hitTarget(t, [Math.sign(t.x - z.x) || 1, Math.sign(t.y - z.y) || 0], false, z.dmg);
          if (!z.chaosRolled.has(t)){ z.chaosRolled.add(t); if (Math.random() < z.chaos){ applyMonsterStatus(t, 'confuse', 2.5); pops.push({ x:t.x, y:t.y - (t.h || 60) - 6, t:0, txt:'혼돈!', crit:true }); } }
        }
      }
      if (z.t > z.dur + .3) zones.splice(i, 1);
    } else if (z.type === 'voidring'){
      const e = Math.min(1, z.t / z.dur), cr = z.R * (1 - Math.pow(1 - e, 2));
      for (const t of combatTargets()){
        if (z.hit.has(t) || skGround(t, z) > cr + 14) continue;
        z.hit.add(t);
        hitTarget(t, [Math.sign(t.x - z.x) || 1, Math.sign(t.y - z.y) || 0], true, z.dmg);
        applyMonsterStatus(t, 'slow', 2.5);
        if (z.drain){ const v = Math.round(z.dmg * z.drain); P.hp = Math.min(P.maxHp, P.hp + v); syncBars(); pops.push({ x:P.x, y:P.y - 100, t:0, txt:'+' + v, heal:true }); }
      }
      if (z.t > z.dur + .35) zones.splice(i, 1);
    }
  }
}

function updEncounters(dt){

  if(!combatMap()) return;

  for(const h of enemyHazards){
    h.t+=dt;
    if(!h.done&&h.t>=h.delay){h.done=true;if(Math.hypot(P.x-h.x,(P.y-30)-h.y)<h.r)hurtPlayer(h.dmg,P.x-h.x,P.y-h.y,h.status||'',h.status==='slow'?2.5:0);}
  }
  for(let i=enemyHazards.length-1;i>=0;i--) if(enemyHazards[i].t>enemyHazards[i].life)enemyHazards.splice(i,1);

  for(const s of enemyShots){

    if(!s.done&&blocked(s.x,s.y)){s.done=true;continue;}
    if(!s.done&&Math.hypot(s.x-P.x,s.y-(P.y-35))<18){
      s.done=true; hurtPlayer(s.dmg,s.vx,s.vy,s.status,s.statusDur);

  }
  for(let i=enemyShots.length-1;i>=0;i--) if(enemyShots[i].done) enemyShots.splice(i,1);

  for(const m of monsters){
    if(m.removed) continue;
    if(m.dead){
      if(m.reviveT>0){
        m.reviveT-=dt;
        if(m.reviveT<=0){m.dead=false;m.hp=Math.max(1,Math.round(m.maxHp*.38));m.death=0;m.stun=.45;pops.push({x:m.x,y:m.y-m.h,t:0,txt:'다시 일어남!',enemy:true});}
      } else {m.death+=dt;if(m.death>1)m.removed=true;}
      continue;
    }
    m.hurt=Math.max(0,m.hurt-dt);m.stun=Math.max(0,m.stun-dt);m.stunImm=Math.max(0,(m.stunImm||0)-dt);m.cd=Math.max(0,(m.cd||0)-dt);m.skillCd=Math.max(0,(m.skillCd||0)-dt);
    m.slowT=Math.max(0,(m.slowT||0)-dt);m.freezeT=Math.max(0,(m.freezeT||0)-dt);
    if(m.burnT>0){
      m.burnT=Math.max(0,m.burnT-dt);m.burnTick=(m.burnTick||0)-dt;
      if(m.burnTick<=0){m.burnTick=.55;const bv=Math.max(1,Math.round(m.maxHp*.022));m.hp-=bv;pops.push({x:m.x,y:m.y-m.h*.8,t:0,txt:'화상 '+bv,crit:true});if(m.hp<=0){killMonster(m);continue;}}
    }

    }

    }
  }

    if(!spawnPack(group,cx,cy,{floor:dunFloor}))throw Error('던전 군집 배치 실패');
  }
  for(const room of M.rooms){
    if(room===M.startRoom||room===arena)continue;
    const n=2+Math.floor(Math.random()*3)+Math.min(3,tier-1);
    for(let i=0;i<n;i++){
      const id=elites.length&&i===n-1?elites[Math.floor(Math.random()*elites.length)]:pool[Math.floor(Math.random()*pool.length)];
      for(let tries=0;tries<150;tries++){
        const m=createMonster(id,(room.x+1+Math.random()*(room.w-2))*TS,(room.y+1.5+Math.random()*(room.h-2))*TS,{floor:dunFloor});
        if(spawnClear(m)){monsters.push(m);break;}
      }
    }
  }
  const mimicId=TIER_MATCH.mimics[tier-1];
  if(mimicId&&Math.random()<.35){
    const chest=M.props.find(p=>p.kind==='chest');
    if(chest){
      chest.mimic=1;chest.mimicId=mimicId;
      const spot=spots.find(s=>s.data===chest);
      if(spot){spot.prop.img=mobImageSet(mimicId).closed;spot.prop.mimic=1;}
    }
  }
}

// ---- 들어가기·층 이동 ----
async function goDungeon(floor,fromAbove){
  if(dunBusy||traveling)return false;
  dunBusy=true;
  try{
    say(floor===1?'어둡고 축축하다… 돈 냄새가 난다.':'지하 '+floor+'층');
    const m=await prepareDungeon(floor);
    // 계단 바로 위/타일 경계 대신 방 중심의 안전 바닥에서 시작.
    const pos=fromAbove===false?[(m.farRoom.x+m.farRoom.w-2)*TS,(m.farRoom.y+m.farRoom.h-2)*TS]:m.spawn;
    if(!travel('dungeon',pos,'front'))return false;
    await new Promise(r=>setTimeout(r,560));
    const safe=nearestSafePosition(P.x,P.y);P.x=safe[0];P.y=safe[1];
    if(window.GUILD)GUILD.onDungeonFloor(floor);
    return true;
  }finally{dunBusy=false;}
}
function enterDungeonFromOut(){closeAll();dunTheme='ruins';goDungeon(1);}
function enterDungeonFromHere(){dunTheme='cave';goDungeon(1);}
function nextDungeonFloor(){if(!dunBusy)goDungeon(dunFloor+1);}
function previousDungeonFloor(){
  if(dunBusy)return;
  if(dunFloor<=1){dunGrid=null;travel('out',[27.3*TS,11.6*TS],'front');return;}
  goDungeon(dunFloor-1,false);
}
function openDungeonChest(spot){
  const p = spot.prop, src = spot.data || {}; if (!p || p.opened) return;
  if (src.mimic){ // 미믹!
    p.opened = 1; p.hide = 1; spots.splice(spots.indexOf(spot), 1);
    // 위장 상자가 사라지면 그 상자만의 충돌도 해제한다. 주변 벽/소품은 유지한다.
    const solidIndex=solids.findIndex(s=>s.x0===src.x-src.w*src.cw/2&&s.x1===src.x+src.w*src.cw/2&&s.y0===src.y-src.cd&&s.y1===src.y-2);
    const chestSolid=solidIndex>=0?solids.splice(solidIndex,1)[0]:null;
    const id=src.mimicId||TIER_MATCH.mimics[dungeonTier(dunFloor)-1];
    if(!id)throw Error('미믹 티어 누락');
    const m=createMonster(id,p.x,p.y,{floor:dunFloor});
    let placed=spawnClear(m);
    for(let ring=1;ring<=5&&!placed;ring++)for(let step=0;step<16;step++){
      const a=step*Math.PI/8;m.x=p.x+Math.cos(a)*TS*ring;m.y=p.y+Math.sin(a)*TS*ring;
      if(spawnClear(m)){placed=true;break;}
    }
    if(!placed){
      if(chestSolid)solids.splice(solidIndex,0,chestSolid);
      p.opened=0;p.hide=0;spots.push(spot);say('상자가 몸을 숨기고 있습니다. 주변을 비워 주세요.');return;
    }
    m.tx=m.homeX=m.x;m.ty=m.homeY=m.y;m.state='chase';monsters.push(m);
    say('상자가… 이빨이 있다?!'); return;
  }
  p.opened = 1; p.img = BI.d_chest_open || p.img; spots.splice(spots.indexOf(spot), 1);
  const gold = 15 + Math.floor(Math.random() * 20) * dunFloor;
  dropsLoot.push({ kind: 'gold', x: p.x - 12, y: p.y + 14, amount: gold, ph: 0 });
  if (Math.random() < 0.7){ const it = randomDropItem({tier:dungeonTier(dunFloor)}); if (it) dropsLoot.push({ kind:'item', x:p.x+14, y:p.y+14, item:it, ph:1 }); }
  say('금화 냄새!');
}

const shadeC = document.createElement('canvas'), shadeG = shadeC.getContext('2d');
function drawDungeonShade(camX, camY){
  if (MAP !== 'dungeon') return;
  if (shadeC.width !== cv.width || shadeC.height !== cv.height){ shadeC.width = cv.width; shadeC.height = cv.height; }
  const g = shadeG, k = dpr * Z; g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over'; g.fillStyle = 'rgba(6,5,10,0.9)'; g.fillRect(0, 0, shadeC.width, shadeC.height);
  g.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a) => { const sx = (x - camX) * k, sy = (y - camY) * k, R = r * k;
    const gr = g.createRadialGradient(sx, sy, 0, sx, sy, R); gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(0.55, `rgba(0,0,0,${a * 0.7})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(sx, sy, R, 0, 7); g.fill(); };
  const fl = 0.94 + Math.sin(T * 11) * 0.03 + Math.sin(T * 27) * 0.02;
  hole(P.x, P.y - 40, 250, 1);
  for (const t of CUR.torches || []) if (Math.abs(t.x - P.x) < 900 && Math.abs(t.y - P.y) < 700) hole(t.x, t.y + 30, 170 * fl, 0.95);
  for (const s of shots) if (s.kind === 'fire' || s.kind === 'staff') hole(s.x, s.y, 90, 0.8);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(shadeC, 0, 0);
  // 횃불 주위 따뜻한 빛
  ctx.globalCompositeOperation = 'lighter';
  for (const t of CUR.torches || []){
    const sx = (t.x - camX) * k, sy = (t.y - camY) * k, R = 120 * k * fl; if (sx < -R || sy < -R || sx > cv.width + R || sy > cv.height + R) continue;
    const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, R); gr.addColorStop(0, 'rgba(255,170,80,.30)'); gr.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(sx, sy, R, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// 지역 음악: 첫 입력 이후에만 재생하고, 이동·우두머리 조우 시 천천히 교차한다.
const BGM = (() => {
  const tracks = (typeof A !== 'undefined' && A.bgm) || {};
  const level = { town: 0.25, field: 0.24, dungeon: 0.19, boss: 0.28 };
  const fadeMs = 1400;
  let unlocked = false, current = null, activeBoss = null;
  const fading = new Set(), ramps = new WeakMap();

  function target(){
    if (MAP !== 'dungeon') { activeBoss = null; return MAP === 'town' ? 'town' : 'field'; }
    if (activeBoss && (!monsters.includes(activeBoss) || activeBoss.dead)) activeBoss = null;
    if (!activeBoss) activeBoss = monsters.find(m => m.boss && !m.dead &&
      (m.state === 'chase' || Math.hypot(m.x - P.x, m.y - P.y) < 360)) || null;
    return activeBoss ? 'boss' : 'dungeon';
  }
  function ramp(a, goal, done){
    const token = {}; ramps.set(a, token);
    const start = performance.now(), from = a.volume;
    function tick(now){
      if (ramps.get(a) !== token) return;
      const p = Math.min(1, (now - start) / fadeMs);
      a.volume = Math.max(0, Math.min(1, from + (goal - from) * p));
      if (p < 1) requestAnimationFrame(tick);
      else if (done) done();
    }
    requestAnimationFrame(tick);
  }
  function play(a){ a.play().catch(() => {}); }
  function sync(){
    if (!unlocked) return;
    if (!SFX.on || document.hidden){
      if (current) current.audio.pause();
      for (const a of fading) a.pause();
      return;
    }
    const name = target();
    if (!tracks[name]) return;
    if (current && current.name === name){
      if (current.audio.paused) play(current.audio);
      return;
    }
    if (current){
      const old = current.audio; fading.add(old);
      ramp(old, 0, () => { old.pause(); old.currentTime = 0; fading.delete(old); });
    }
    const audio = new Audio(tracks[name]);
    audio.loop = true; audio.preload = 'none'; audio.volume = 0;
    current = { name, audio };
    play(audio);
    ramp(audio, level[name]);
  }
  function unlock(){ unlocked = true; sync(); }
  addEventListener('pointerdown', unlock, { capture: true });
  addEventListener('keydown', unlock, { capture: true });
  document.addEventListener('visibilitychange', sync);
  setInterval(sync, 300);
  return { sync, get track(){ return current && current.name; } };
})();

const TRADE_SLOT_MAX = 24, TRADE_STACK_MAX = 50, TRADE_DAY_MS = 480000;
const tradeState = { cargo:{}, pressure:{}, resetAt:Date.now()+TRADE_DAY_MS };
let tradeRegion='town', tradeSel='wheat';

function tradeRegionDef(k){ return TRADE_REGIONS[k] || TRADE_REGIONS.town; }
function tradeMod(region,id){ return tradeRegionDef(region).m[id] || 1; }
function tradePressure(region,id){
  if(Date.now() >= tradeState.resetAt){ tradeState.pressure={}; tradeState.resetAt=Date.now()+TRADE_DAY_MS; }
  const n=tradeState.pressure[region+':'+id]||0;
  return Math.max(.90,1-Math.floor(n/5)*.01); // 5개 팔 때마다 -1%, 하루 최대 -10%
}
function tradeDiscount(){ return Math.max(.90,1-.02*((P.lifeSkills&&P.lifeSkills.discount)||0)); }
function tradeOvercount(){ return Math.min(1.10,1+.02*((P.lifeSkills&&P.lifeSkills.overcount)||0)); }
function tradeQuote(region,id){
  const g=TRADE_BY_ID[id], m=tradeMod(region,id);
  if(!g)return {buy:0,sell:0,mod:1};
  return {
    buy:Math.max(1,Math.round(g.base*m*1.06*tradeDiscount())),
    sell:Math.max(1,Math.round(g.base*m*.94*tradePressure(region,id)*tradeOvercount())),
    mod:m
  };
}
function cargoSlots(){ return Object.keys(tradeState.cargo).filter(id=>tradeState.cargo[id]&&tradeState.cargo[id].qty>0).length; }
function cargoEntry(id){ return tradeState.cargo[id]||{qty:0,avg:0}; }
function tradeBuy(id,n){
  const g=TRADE_BY_ID[id]; if(!g)return false;
  const q=tradeQuote(tradeRegion,id), cur=cargoEntry(id);
  if(!cur.qty && cargoSlots()>=TRADE_SLOT_MAX){ tradeMsg('화물칸이 가득 찼습니다.'); return false; }
  n=Math.max(0,Math.min(n|0,TRADE_STACK_MAX-cur.qty));
  if(!n){ tradeMsg('한 품목은 최대 '+TRADE_STACK_MAX+'개까지 싣습니다.'); return false; }
  const afford=Math.floor(P.gold/q.buy); n=Math.min(n,afford);
  if(!n){ tradeMsg('금화가 부족합니다.'); return false; }
  const next=cur.qty+n, avg=(cur.avg*cur.qty+q.buy*n)/next;
  tradeState.cargo[id]={qty:next,avg:avg};
  setGold(P.gold-q.buy*n);if(window.GUILD)GUILD.refreshTrack();if(window.UI&&UI.save)UI.save();
  tradeMsg(g.name+' '+n+'개 매입. 금화 '+(q.buy*n)+'닢… 남는 장사여야 할 텐데요.');
  renderTrade(); return true;
}
function tradeSell(id,n){
  const g=TRADE_BY_ID[id], cur=cargoEntry(id); if(!g||!cur.qty)return false;
  n=Math.max(0,Math.min(n|0,cur.qty)); if(!n)return false;
  const q=tradeQuote(tradeRegion,id), revenue=q.sell*n, cost=cur.avg*n, profit=Math.round(revenue-cost);
  cur.qty-=n; if(cur.qty<=0) delete tradeState.cargo[id]; else tradeState.cargo[id]=cur;
  const key=tradeRegion+':'+id; tradeState.pressure[key]=(tradeState.pressure[key]||0)+n;
  setGold(P.gold+revenue);if(window.GUILD)GUILD.refreshTrack();if(window.UI&&UI.save)UI.save();
  tradeMsg((profit>=0?'좋습니다. ':'아깝군요. ')+g.name+' '+n+'개, '+(profit>=0?'+':'')+profit+'골드.');
  renderTrade(); return true;
}

function tradeSaveData(){ return {cargo:tradeState.cargo,pressure:tradeState.pressure,resetAt:tradeState.resetAt}; }

  tradeState.resetAt=+d.resetAt||Date.now()+TRADE_DAY_MS;
}
function tradeConsume(id,qty){
  qty=Math.max(1,qty|0);const c=cargoEntry(id);
  if(c.qty<qty)return false;
  c.qty-=qty;if(c.qty<=0)delete tradeState.cargo[id];
  if(window.GUILD)GUILD.refreshTrack();
  if($('trade').classList.contains('on'))renderTrade();

}

const GUILD_MOB_NAME=Object.fromEntries(Object.values(MOBDEF).map(d=>[d.id,d.name]));
const GUILD_TIER_THEME=['','spring','summer','autumn','winter','ice','volcano','swamp'];
let guildState={seq:1,board:[],active:[],completed:0};

function guildTier(){return window.GAME&&GAME.levelTier?GAME.levelTier(P.lv):1;}
function guildReward(tier){
  const exp=window.GAME&&GAME.questExp?GAME.questExp('guild',P.lv):10;
  const gold=Math.round(35+P.lv*8+tier*22);
  return {exp,gold,gear:Math.random()<.28};
}
function guildMake(type,idx){
  const tier=guildTier(),rew=guildReward(tier),q={id:guildState.seq++,type,tier,prog:0,accepted:false,...rew};
  if(type==='kill_any'){
    q.need=8+tier*2+idx;q.title='주변 정리';q.desc='같은 티어 전투 지역에서 몬스터 '+q.need+'마리 처치';
  }else if(type==='kill_type'){
    const pool=THEME_MOBS[GUILD_TIER_THEME[tier]]||THEME_MOBS.spring,target=pool[(idx+tier)%pool.length];
    q.target=target;q.need=4+tier;q.title=GUILD_MOB_NAME[target]+' 소탕';q.desc=GUILD_MOB_NAME[target]+' '+q.need+'마리 처치';
  }else if(type==='floor'){
    q.need=Math.max(2,tier*3);q.title='던전 정찰';q.desc='던전 지하 '+q.need+'층에 도달';
  }else{
    const goods=TRADE.goods, g=goods[(tier*3+idx*5)%goods.length];
    q.goodId=g.id;q.goodName=g.name;q.need=4+tier*2;q.title='긴급 납품';q.desc=g.name+' '+q.need+'개 납품';
  }
  return q;
}
function guildGenerate(){
  if(guildState.board.length||guildState.active.length>=3)return;
  guildState.board=[
    guildMake('kill_any',0),guildMake('kill_any',1),
    guildMake('kill_type',0),guildMake('kill_type',1),
    guildMake('floor',0),guildMake('delivery',0)
  ];
}
function guildDone(q){
  if(q.type==='delivery'){
    const c=TRADE.cargo()[q.goodId];return !!c&&c.qty>=q.need;
  }
  return (q.prog||0)>=q.need;
}
function guildProgressText(q){
  if(q.type==='delivery'){
    const c=TRADE.cargo()[q.goodId];return (c?c.qty:0)+' / '+q.need;
  }
  return Math.min(q.need,q.prog||0)+' / '+q.need;
}
function guildTrack(){
  const host=$('questTrack');if(!host)return;
  host.onclick=()=>guildOpen();
  host.title='의뢰창 열기';
  host.innerHTML='';
  if(!guildState.active.length){host.classList.remove('on');return;}
  host.classList.add('on');
  for(const q of guildState.active.slice(0,3)){
    const done=guildDone(q),row=document.createElement('div');
    row.className='qtrack'+(done?' done':'');
    const hasNum=Number.isFinite(q.need)&&q.need>0;
    const prog=hasNum?guildProgressText(q):'';
    row.innerHTML='<span class="qcheck"></span><span class="qtitle">'+q.title+'</span><span class="qprog">'+prog+'</span>';
    host.append(row);
  }
}
function guildAccept(id){
  if(guildState.active.length>=3){say('진행 중 의뢰는 최대 3개입니다.');return false;}
  const i=guildState.board.findIndex(q=>q.id===id);if(i<0)return false;
  const q=guildState.board.splice(i,1)[0];q.accepted=true;guildState.active.push(q);guildRender();guildTrack();
  if(window.UI&&UI.save)UI.save();return true;
}
function guildRandomGear(tier){
  const r=Math.random();
  if(r<.58){const wt=['sword','spear','gauntlet','bow','staff'][Math.floor(Math.random()*5)];return UI.make({kind:'weapon',wt,tier,roll:true});}
  if(r<.9){const kinds=['head','body','hands','feet'];return UI.make({kind:kinds[Math.floor(Math.random()*kinds.length)],tier,roll:true});}
  return UI.make({kind:Math.random()<.5?'ring':'neck',tier,roll:true});
}
function guildClaim(id){
  const i=guildState.active.findIndex(q=>q.id===id);if(i<0)return false;
  const q=guildState.active[i];if(!guildDone(q)){say('아직 의뢰 조건을 채우지 못했습니다.');return false;}
  if(q.type==='delivery'&&!TRADE.consume(q.goodId,q.need)){say('납품 물품이 부족합니다.');return false;}
  GAME.gainExp(q.exp);GAME.setGold(P.gold+q.gold);
  let extra='';
  if(q.gear&&window.UI){
    const it=guildRandomGear(Math.max(1,Math.min(7,q.tier)));
    if(UI.add(it))extra=' · '+it.name;
    else {const comp=50+q.tier*35;GAME.setGold(P.gold+comp);extra=' · 가방이 차서 '+comp+'G 추가';}
  }
  guildState.active.splice(i,1);guildState.completed++;
  say('의뢰 완료! EXP '+q.exp+' · '+q.gold+'G'+extra);
  if(!guildState.board.length&&!guildState.active.length)guildGenerate();
  guildRender();guildTrack();if(window.UI&&UI.save)UI.save();return true;
}
function guildOnKill(m){
  if(!m||m.dead===false)return;
  let changed=false;
  for(const q of guildState.active){
    if(q.type==='kill_any'){q.prog=Math.min(q.need,(q.prog||0)+1);changed=true;}
    else if(q.type==='kill_type'&&(m.type===q.target||m.family===q.target)){q.prog=Math.min(q.need,(q.prog||0)+1);changed=true;}
  }
  if(changed&&$('guild').classList.contains('on'))guildRender();if(changed)guildTrack();if(changed)guildTrack();
}
function guildOnDungeonFloor(floor){
  let changed=false;
  for(const q of guildState.active)if(q.type==='floor'){q.prog=Math.max(q.prog||0,floor);changed=true;}
  if(changed&&$('guild').classList.contains('on'))guildRender();
}
function guildCard(q,active){
  const d=document.createElement('div');d.className='gq'+(guildDone(q)?' done':'');
  const gear=q.gear?' · 장비 가능':'';
  d.innerHTML='<b>'+q.title+'</b><small>'+q.desc+'</small><div class="gprog">'+guildProgressText(q)+'</div><small>보상 EXP '+q.exp+' · '+q.gold+'G'+gear+'</small>';
  const btn=document.createElement('button');btn.className='btn';btn.type='button';
  if(active){btn.textContent=guildDone(q)?'보상 받기':'진행 중';btn.disabled=!guildDone(q);btn.onclick=()=>guildClaim(q.id);}
  else{btn.textContent='수락';btn.disabled=guildState.active.length>=3;btn.onclick=()=>guildAccept(q.id);}
  d.append(btn);return d;
}
function guildRender(){
  guildGenerate();guildTrack();$('guildRank').textContent='견습 · 완료 '+guildState.completed+'건';
  const a=$('gActive'),b=$('gBoard');a.innerHTML='';b.innerHTML='';
  if(!guildState.active.length)a.innerHTML='<div class="gq"><small>진행 중인 의뢰가 없습니다.</small></div>';
  for(const q of guildState.active)a.append(guildCard(q,true));
  for(const q of guildState.board)b.append(guildCard(q,false));
}
function guildOpen(){
  closeAll();panel='guild';$('guild').classList.add('on');guildRender();

function guildClose(){ $('guild').classList.remove('on');if(panel==='guild')panel=null; }
function guildSaveData(){return JSON.parse(JSON.stringify(guildState));}
function guildLoadData(d){

function rarityForTier(tier, rank='normal'){
  tier=clamp(tier||1,1,7);

  const legend=tier<4?0:(rank==='boss'?5:rank==='elite'?2:0);
  const scent=(G.P.lifeSkills&&G.P.lifeSkills.moneyScent)||0, greed=(G.P.passives&&G.P.passives.greed)||0;
  const bonus=scent*1.2+greed*.6;
  if(bonus>0){const shift=Math.min(w[0]-20,bonus);w[0]-=shift;w[2]+=shift*.75;w[3]+=shift*.25;}

}
function rollAffix(it, used){

  const v=a.pct?Math.round(raw):Math.max(1,Math.round(flat?raw*NUM:raw));
  it.aff.push({id:a.id,k:a.k,nm:a.nm,st:a.st,v,pct:a.pct});

function cmpLine(o, it){

  for (const k of keys){
    const a = o ? (o.st[k] || 0) : 0, b = it ? (it.st[k] || 0) : 0;
    const li = el('li', '', `${STN[k]} ${a}`);

function showInfo(it, from){
  const I = $('iinfo'); I.innerHTML = '';
  const nm = el('div', 'iname', it.name); nm.style.color = RART[it.rar]; I.append(nm);
  I.append(el('div', 'isub', `${RARN[it.rar]} · ${it.kind === 'weapon' ? WN[it.wt] : SLOTN[targetSlot(it)]}`));
  I.append(el('div','isub',`T${it.tier} · 착용 Lv${it.requiredLevel||1}`));
  if (it.kind === 'weapon') I.append(el('div', 'isub', WINFO[it.wt]));
  const ic = el('img', 'iic'); ic.src = A.icons[it.icon]; I.append(ic);
  const ul = el('ul', 'ist');
  cmpLine(it, null).forEach(li => ul.append(li)); I.append(ul);
  if (from === 'bag') I.append(cmpCards(it));
  const row = el('div', 'ibtns');
  if (from === 'bag'){
    if (it.kind === 'weapon'){
      for (const s of ['w1', 'w2']){ const b = el('button', 'btn', `${SLOTN[s]}에 장착`); b.type = 'button'; b.disabled=!canEquip(it); b.onclick = () => equip(it, s); row.append(b); }
    } else if (it.kind === 'ring'){
      for (const s of ['ring1', 'ring2']){ const b = el('button', 'btn', s === 'ring1' ? '왼손 반지' : '오른손 반지'); b.type = 'button'; b.disabled=!canEquip(it); b.onclick = () => equip(it, s); row.append(b); }
    } else { const b = el('button', 'btn', '장착'); b.type = 'button'; b.disabled=!canEquip(it); b.onclick = () => equip(it, it.kind); row.append(b); }
    const d = el('button', 'btn ghost', '버리기'); d.type = 'button';
    d.onclick = () => { if (d.dataset.ok){ bag[pickSel.i] = null; pickSel = null; I.classList.remove('on'); render(); } else { d.dataset.ok = 1; d.textContent = '정말 버리기'; } };
    row.append(d);
  } else {
    const b = el('button', 'btn', '벗기'); b.type = 'button'; b.onclick = () => unequip(pickSel.slot); row.append(b);
  }
  I.append(row);
  I.classList.add('on');
}
function equip(it, s){
  if(!slotOk(it,s)||!canEquip(it)){G.say('착용 레벨이 부족합니다. Lv'+it.requiredLevel+'부터 착용할 수 있습니다.');return false;}
  const i = bag.indexOf(it); if (i < 0) return;
  bag[i] = eq[s]; eq[s] = it;
  if ((s === 'w1' || s === 'w2') && !eq[cur]) cur = s;
  pickSel = { from: 'eq', slot: s }; tab = 'equip'; render(); showInfo(it, 'eq'); syncHud();
}
function unequip(s){
  const i = bag.indexOf(null); if (i < 0){ G.say('가방이 가득 찼습니다'); return; }
  bag[i] = eq[s]; eq[s] = null;
  if (s === cur && !eq[cur]){ const o = s === 'w1' ? 'w2' : 'w1'; if (eq[o]) cur = o; }
  pickSel = { from: 'bag', i }; render(); showInfo(bag[i], 'bag'); syncHud();
}
window.UI = {
  addPotion(k,n){POT[k]+=n;syncPot();},
  make,canEquip,equip,add(it){const i=bag.indexOf(null);if(i<0)return false;bag[i]=it;return true;},
  combatMods,findBonus,coinBonus,skillRank,currentWeapon:()=>eq[cur],
  quickSlots:()=>QS.slice(),assignQuick(i,id){if(i<0||i>=5||!quickLearned(id))return false;const old=QS.indexOf(id);if(old>=0)QS[old]=null;QS[i]=id;syncQS();saveGame();return true;},
  dragDebug:()=>drag?{id:drag.id,from:drag.from,moved:drag.moved}:null,quickDropIndex,
  refresh(){syncHud();if($('char').classList.contains('on'))render();},
  bagFull:()=>bag.indexOf(null)<0,
  bagItems:()=>bag.map((it,i)=>it?{i,it}:null).filter(Boolean),
  removeBagAt(i){
    if (i < 0 || i >= BAG || !bag[i]) return null;
    const it = bag[i]; bag[i] = null; pickSel = null; $('iinfo').classList.remove('on');
    if ($('char').classList.contains('on')) render();
    if (typeof saveGame === 'function') saveGame();
    return it;
  },
  isOpen: () => $('char').classList.contains('on'), close: closeChar,
};
// ---- 저장 (이 기기의 브라우저에 자동 저장: 금화·체력·레벨·가방·장비·물약·퀵슬롯) ----
const SKEY='arpg_save_v3';
try{localStorage.removeItem('arpg_save_v1');localStorage.removeItem('arpg_save_v2');}catch(e){}
function saveGame(){
  try{
    const P=G.P;
    localStorage.setItem(SKEY,JSON.stringify({v:3,gearSchema:TIER_MATCH.schema,t:Date.now(),name:P.name,stats:P.stats,mastery:P.mastery,skillLv:P.skillLv,passives:P.passives,lifeSkills:P.lifeSkills,
      statPts:P.statPts,skillPts:P.skillPts,lifePts:P.lifePts,portalReadyAt:P.portalReadyAt,gold:P.gold,hp:P.hp,mp:P.mp,lv:P.lv,exp:P.exp,bag,eq,cur,pot:POT,qs:QS,
      location:G.locationState?G.locationState():null,trade:window.TRADE?TRADE.saveData():null,guild:window.GUILD?GUILD.saveData():null}));
  }catch(e){}
}
function loadGame(){
  let d=null;try{d=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){}
  if(!d||d.v!==3)return null;
  for(let i=0;i<BAG;i++)bag[i]=d.bag&&d.bag[i]||null;
  for(const k in eq)eq[k]=d.eq&&d.eq[k]||null;
  cur=d.cur==='w2'&&eq.w2?'w2':'w1';
  if(d.pot){POT.hp=d.pot.hp|0;POT.mp=d.pot.mp|0;}
  if(d.qs)for(let i=0;i<5;i++)QS[i]=d.qs[i]&&(d.qs[i]==='townPortal'||A.skicon[d.qs[i]])?d.qs[i]:null;
  let mx=0;for(const it of [...bag,...Object.values(eq)])if(it&&it.id>mx)mx=it.id;seq=mx+1;
  const P=G.P;P.name=d.name||P.name||'루크레아';P.lv=d.lv||1;P.exp=d.exp||0;P.statPts=d.statPts|0;P.skillPts=d.skillPts|0;P.lifePts=d.lifePts|0;
  P.stats=Object.assign({},P.stats,d.stats||{});P.mastery=Object.assign({},P.mastery,d.mastery||{});P.skillLv=Object.assign({},P.skillLv,d.skillLv||{});
  P.lifeSkills=Object.assign({},P.lifeSkills||{},d.lifeSkills||{});P.passives=Object.assign({},P.passives||{},d.passives||{});P.portalReadyAt=+d.portalReadyAt||0;
  if(G.syncLifeUnlocks)G.syncLifeUnlocks(true);G.setGold(d.gold|0);if(window.TRADE)TRADE.loadData(d.trade);if(window.GUILD)GUILD.loadData(d.guild);return d;
}
const saved=loadGame();
// 테스트용: 구현된 액티브 스킬을 전부 배운 상태(1랭크)로 만든다(포인트는 건드리지 않음 — 저장 검사와 충돌). 정식 시작 전에 false로 바꿀 것.
const TEST_UNLOCK_ALL_SKILLS=true;
if(TEST_UNLOCK_ALL_SKILLS){for(const id of IMPLEMENTED)if(!((G.P.skillLv||{})[id]>0)){G.P.skillLv=G.P.skillLv||{};G.P.skillLv[id]=1;}}
syncHud();syncPot();
if(saved){
  G.P.hp=Math.max(1,Math.min(G.P.maxHp,saved.hp||G.P.maxHp));G.P.mp=Math.min(G.P.maxMp,saved.mp||0);G.setMax(G.P.maxHp,G.P.maxMp);
  Promise.resolve(G.resumeLocation?G.resumeLocation(saved.location):false).then(()=>{
    G.say('이어서 합니다. 금화 '+G.P.gold+'닢 그대로!');
  });
}
setInterval(saveGame,4000);addEventListener('pagehide',saveGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
window.UI.save=saveGame;window.UI.reset=()=>{try{localStorage.removeItem(SKEY);}catch(e){}location.reload();};
})();

</script>
