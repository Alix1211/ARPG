<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>마을 시험판</title>
<style>
:root{--ink:#3b2412;--paper:#f3e6c8;--gold:#c9923e;--red:#9e2a22}
html,body{margin:0;height:100%;background:#1d1510;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none}
#tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;display:none;min-width:150px;height:46px;padding:0 26px;background:center/100% 100% no-repeat;color:#fff4d8;font-weight:800;font-size:15px;line-height:44px;text-align:center;white-space:nowrap;text-shadow:0 1px 2px #000}

.pan{position:fixed;display:none;z-index:5}
.pan.on{display:block}
.frame{border:34px solid transparent;border-image:var(--panel) 62 fill stretch;color:var(--ink)}

#dlg{left:50%;bottom:10px;transform:translateX(-50%);width:min(760px,92vw);display:none}
#dlg.on{display:flex;align-items:flex-end;gap:0}
#dlgImg{height:min(250px,56vh);margin-right:-18px;position:relative;z-index:2;filter:drop-shadow(0 4px 6px #0007)}
#dlg .frame{flex:1;min-height:120px;position:relative}
#dlgName{position:absolute;left:-6px;top:-58px;min-width:120px;height:44px;padding:0 24px;background:var(--banner) center/100% 100% no-repeat;color:#fff4d8;font-weight:900;font-size:17px;line-height:42px;text-align:center;text-shadow:0 1px 2px #000}

.row{display:flex;gap:8px;justify-content:flex-end}.row[hidden]{display:none}
#shop{left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);display:none}

#shopMarket{grid-column:1/3;font-size:11px;color:#7a5a32;margin-top:-6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;align-content:start;overflow:auto;max-height:52vh}
.cell{position:relative;aspect-ratio:1;border:0;padding:6px;background:var(--slot) center/100% 100% no-repeat}

.cell img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px #0006)}
.cell span{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:900;color:#ffe08a;text-shadow:0 1px 2px #000,0 0 2px #000}
#info{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}

#infoName{font-weight:900;font-size:16px}

#infoPrice{font-weight:900;color:#8a5a0a}
#shopSay{font-size:12px;color:#7a3b1a;min-height:32px;line-height:1.35}

#guild{left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:86vh;display:none;overflow:auto}
#guild.on{display:block}
#guildHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-right:52px;position:relative}
#guildHead b{font-size:20px}#guildHead small{color:#8a5a2a;font-weight:800}
#guildClose{position:absolute;right:-10px;top:-12px;width:48px;height:48px;border:0;background:var(--x) center/100% 100% no-repeat;filter:drop-shadow(0 2px 3px #0008);z-index:3}
#gActive,#gBoard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.gq{border:2px solid #b69055;background:#f3e5c8cc;border-radius:10px;padding:9px;color:var(--ink);min-height:98px}

.gq b{display:block;font-size:14px;margin-bottom:3px}.gq small{display:block;color:#745a38;line-height:1.35}
.gprog{font-size:12px;font-weight:900;color:#7a3b1a;margin:6px 0}
.gq .btn{font-size:12px;padding:4px 10px}
.gsect{font-size:13px;font-weight:900;color:#6b3d18;margin-top:4px}
#bubble.mono{background:#f1eaff;border-color:#8a63c9;font-style:italic;font-weight:700}
#bubble{position:fixed;transform:translate(-50%,-100%);display:none;pointer-events:none;background:#fff8e6;color:var(--ink);border:2px solid #b07a35;border-radius:12px;padding:4px 10px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px #0006}
#char{position:fixed;inset:0;background:#120b06b0;display:none;z-index:8}
#char.on{display:block}
#charWrap{position:absolute;left:50%;top:50%;width:1078px;height:659px;transform-origin:center}
#tabs{position:absolute;left:0;top:0;display:flex;gap:6px}
#tabs button{width:76px;height:62px;border:0;padding:0;background:center/100% 100% no-repeat;opacity:.55;filter:drop-shadow(0 2px 3px #0008)}
#tabs button.on{opacity:1;transform:translateY(2px)}
#tabs b{position:absolute;margin-top:62px;width:76px;text-align:center;color:#f3e6c8;font-size:15px;font-weight:900;text-shadow:0 1px 2px #000}
#charClose{position:absolute;right:-6px;top:0;width:58px;height:58px;border:0;padding:0;background:var(--x) center/100% 100% no-repeat;filter:drop-shadow(0 2px 3px #0008)}
#leftPane,#bagPane{position:absolute;top:64px;background:center/100% 100% no-repeat}
#leftPane{left:0}
#bagPane{right:0;width:608px;height:595px}
.slot{position:absolute;border:0;padding:6px;background:transparent;border-radius:10px}
.slot img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px #0008)}
.slot.has{box-shadow:inset 0 0 0 2px var(--rc),0 0 8px -2px var(--rc)}
.slot.sel{box-shadow:inset 0 0 0 3px #ffe08a,0 0 12px #ffd34d}
.slab{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:900;color:#f6e7c6;background:#2a160bcc;border-radius:6px;padding:0 5px}
.slab.hide{display:none}
.held{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:#9e2a22;color:#fff;font-size:11px;font-weight:900;border-radius:7px;padding:0 6px;white-space:nowrap}
.off{position:absolute;background:#1a0f08a0;border-radius:10px}
.fig{position:absolute;left:176px;top:118px;width:134px;height:322px;object-fit:contain;filter:drop-shadow(0 4px 4px #0006)}
.sface{position:absolute;left:52px;top:110px;width:80px;height:80px;border-radius:50%;object-fit:cover;background:#e8d6b0}
.sbar{position:absolute;left:176px;width:156px;height:17px;border-radius:8px;background:#3a2614;overflow:hidden}
.sbar i{display:block;height:100%}
.sbar .b0{background:linear-gradient(#ff6a5a,#c0221c)} .sbar .b1{background:linear-gradient(#6ab8ff,#1f5fc4)} .sbar .b2{background:linear-gradient(#ffd56a,#e09a12)}
.sbar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:17px;font-weight:900;color:#fff;text-shadow:0 1px 1px #000}
.srow{position:absolute;left:92px;width:236px;height:36px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.srow b{width:36px;font-size:15px} .srow em{font-style:normal;font-weight:900;font-size:17px;width:28px;text-align:right;color:#7a3b1a} .srow small{font-size:12px;color:#6b5b45;font-weight:700}
.slv{position:absolute;left:0;right:0;top:572px;text-align:center;font-size:13px;font-weight:900;color:#7a3b1a}
.btitle{position:absolute;left:0;right:0;top:40px;text-align:center;color:#fff4d8;font-weight:900;font-size:20px;text-shadow:0 1px 2px #000}
.bgold{position:absolute;left:96px;top:528px;font-weight:900;font-size:15px;color:#7a4a0a}
.bcnt{position:absolute;right:96px;top:528px;font-weight:800;font-size:13px;color:#6b5b45}
#iinfo{position:fixed;display:none;z-index:9;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);width:168px;border:24px solid transparent;border-image:var(--panel) 62 fill stretch;color:var(--ink);text-align:center}
#iinfo.on{display:block}
.iname{font-weight:900;font-size:15px;line-height:1.2}
.isub{font-size:11px;color:#6b5b45;margin:2px 0 3px;line-height:1.25}
.iic{width:54px;height:54px;object-fit:contain}
.ist{list-style:none;padding:0;margin:3px 0;font-size:13px;font-weight:700;line-height:1.35}
.ist .up{color:#2a8a2a} .ist .dn{color:#c0221c}
.icmp{position:absolute;right:100%;top:50%;transform:translateY(-50%);margin-right:0;display:flex;flex-direction:column;gap:4px;width:150px}
.ccard{border:16px solid transparent;border-image:var(--panel) 62 fill stretch;padding:5px 0 3px;color:var(--ink);text-align:center;font-size:12px}
.ctag{font-size:11px;font-weight:900;color:#7a3b1a}
.ctag.held{color:#b3541a}
.cname{font-weight:900;font-size:13px;line-height:1.2}
.cempty{color:#8a7a62;font-weight:700;margin:2px 0}
.ccard .ist{font-size:12px;margin:2px 0 0}
.cnote{align-self:center;font-size:10px;font-weight:700;color:#f3e6c8;background:#2b1b0fcc;border-radius:8px;padding:1px 8px}
.ibtns{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#fade.slow{transition-duration:.55s}
#fade.on{opacity:1}
#campArt{position:fixed;inset:0;background:#000 center/contain no-repeat;opacity:0;pointer-events:none;transition:opacity .7s;z-index:21}
#campArt.on{opacity:1}
#campArt span{position:absolute;left:0;right:0;bottom:6%;text-align:center;font:700 clamp(14px,2.6vw,22px) sans-serif;color:#fff;text-shadow:0 2px 6px #000}

/* ---- HUD (케인 시안: 좌상단 초상·체력·마나·작은 고리 / 우상단 둥근 미니맵 / 좌하단 조이스틱 / 우하단 큰 공격 버튼 + 스킬 5칸 + 교체) ---- */
#me{left:max(8px,env(safe-area-inset-left));top:6px;display:flex;align-items:flex-start;gap:4px}
#me .ring{position:relative;width:82px;height:88px;flex:none;cursor:pointer;touch-action:manipulation;pointer-events:auto}
#me .ring img{position:absolute;inset:0;width:100%;height:100%}
html.app #fs{display:none}
#me .ring .face{left:13px;top:19px;right:auto;bottom:auto;width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 50%;background:radial-gradient(circle at 50% 40%,#fbeed2,#d9bb8c)}
.bars{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.bar{position:relative;width:166px;aspect-ratio:5.896;background:var(--hpbar) center/100% 100% no-repeat;--l:17.84%;--t:24.44%;--w:75.25%;--h:45.19%}
.bar.mp{background-image:var(--mpbar);aspect-ratio:5.203;--t:30.07%;--w:75.38%;--h:40.52%}
.bar .tr{position:absolute;left:var(--l);width:var(--w);top:var(--t);height:var(--h);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;box-shadow:inset 0 2px 1px #fff5,inset 0 -2px 2px #0004;transition:width .2s}
.bar.hp i{background:linear-gradient(#ff7a6a,#d2291f 60%,#a51a14)}
.bar.mp i{background:linear-gradient(#7cc4ff,#2a6fd6 60%,#1d4fa8)}
.bar span{position:absolute;left:var(--l);width:var(--w);top:var(--t);height:var(--h);display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;text-align:center;color:#fff;font-weight:800;text-shadow:0 1px 1px #000}
.coin{color:#ffe08a;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000,0 0 3px #000;margin-left:30px}
#bagBtn{position:relative;flex:none;margin-top:16px;width:50px;height:50px;border:0;padding:0;border-radius:50%;background:var(--tab0) center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 2px 3px #0009)}
#questTrack{left:max(12px,env(safe-area-inset-left));top:112px;width:286px;display:none;flex-direction:column;gap:2px;pointer-events:auto;cursor:pointer}
#questTrack.on{display:flex}
.qtrack{display:grid;grid-template-columns:17px minmax(0,1fr) auto;align-items:center;gap:5px;min-height:22px;padding:1px 4px;color:#f6e7c8;font:800 11px/1.2 sans-serif;text-shadow:0 2px 3px #000,0 0 5px #000;pointer-events:none}
.qtrack.done{color:#fff0ad}
.qcheck{width:13px;height:13px;border:2px solid #d1a85b;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;background:#26180ccc;box-shadow:0 1px 2px #000}
.qtrack.done .qcheck::after{content:'✓';color:#ffe26f;font-weight:900}
.qtitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qprog{font-size:10px;color:#ffd978;white-space:nowrap}
#mm{right:max(10px,env(safe-area-inset-right));top:8px;width:176px;height:150px;border-radius:50%;border:4px solid #c9923e;box-shadow:0 0 0 3px #4a2a12,inset 0 0 0 2px #e3b35f,0 3px 8px #0009;overflow:hidden;background:#000}
#mm canvas{position:static;width:100%;height:100%}
#mmPortal{right:max(4px,env(safe-area-inset-right));top:112px;width:50px;height:50px;border-radius:50%;border:3px solid #c9923e;box-shadow:0 0 0 2px #4a2a12,inset 0 0 0 2px #e3b35f,0 3px 8px #0009;background:#2a1a0c center/84% no-repeat;pointer-events:auto;touch-action:none;padding:0;z-index:3}
#mmPortal::before{content:'↩';position:absolute;right:-2px;top:-4px;font:900 15px sans-serif;color:#ffe9a8;text-shadow:0 1px 2px #000,0 0 4px #000}
#mmPortal.off{filter:grayscale(.85) brightness(.6)}
#mmPortalCd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 13px sans-serif;color:#fff;text-shadow:0 1px 3px #000,0 0 4px #000;pointer-events:none}
#mmPortalScr{position:absolute;right:-3px;bottom:-4px;min-width:18px;height:18px;border-radius:9px;background:#5b2c8f;border:2px solid #e3b35f;color:#fff;font:900 11px/14px sans-serif;text-align:center;padding:0 2px;box-sizing:border-box;pointer-events:none}#mmPortalScr:empty{display:none}
#mmPortal:active{transform:scale(.94)}

#place{pointer-events:auto;cursor:pointer;right:max(10px,env(safe-area-inset-right));top:166px;width:190px;text-align:center;color:var(--paper);font-weight:800;font-size:13px;text-shadow:0 1px 2px #000}
#fs{right:max(196px,calc(env(safe-area-inset-right) + 196px));top:10px;pointer-events:auto;border:2px solid #b07a35;background:#2c160acc;color:#f3e6c8;border-radius:8px;font-size:12px;font-weight:700;padding:5px 8px}
#snd{right:max(196px,calc(env(safe-area-inset-right) + 196px));top:44px;pointer-events:auto;border:2px solid #b07a35;background:#2c160acc;color:#f3e6c8;border-radius:8px;font-size:12px;font-weight:700;padding:5px 8px}
#panic{right:max(196px,calc(env(safe-area-inset-right) + 196px));top:78px;pointer-events:auto;border:2px solid #d87358;background:#6b1d18e8;color:#fff1df;border-radius:8px;font-size:11px;font-weight:900;padding:5px 8px;box-shadow:0 2px 4px #0008}
#panic[hidden]{display:none}
#resetBtn{right:max(196px,calc(env(safe-area-inset-right) + 196px));top:112px;pointer-events:auto;border:2px solid #7a6a55;background:#2c2218e8;color:#e9dcc4;border-radius:8px;font-size:11px;font-weight:900;padding:5px 8px;box-shadow:0 2px 4px #0008}
#resetBtn[hidden]{display:none}
#joy{left:0;bottom:0;width:46%;height:72%;pointer-events:auto;touch-action:none;overscroll-behavior:none}
#stick{position:fixed;left:max(46px,calc(env(safe-area-inset-left) + 46px));bottom:34px;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,#ffffff22,#ffffff14 60%,#ffffff08);border:2px solid #ffffff30;pointer-events:none;opacity:.45;transition:opacity .15s}
#stick.act{opacity:1}
#knob{position:absolute;left:36px;top:36px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff70,#ffffff35);box-shadow:0 2px 6px #0005}
#cluster{position:fixed;right:max(24px,calc(env(safe-area-inset-right) + 24px));bottom:52px;width:124px;height:124px;pointer-events:none}
#atk{position:absolute;inset:0;border:0;padding:0;border-radius:50%;background:var(--ring) center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 4px 6px #000a);transition:transform .08s}
#atk:active{transform:scale(.95)}
#atkIc{position:absolute;left:22%;top:22%;width:56%;height:56%;object-fit:contain;filter:drop-shadow(0 2px 2px #0008)}
#atkCap{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:900;color:#fff4d8;text-shadow:0 1px 2px #000,0 0 3px #000}
#atk.talk #atkIc{opacity:.35}
.sk{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:0;padding:0;border-radius:50%;background:center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 3px 4px #0009)}
.sk[hidden]{display:none}
.sk i{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(#000a var(--cd,0turn),transparent 0)}
.sk:active{transform:scale(.93)}
.pot{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border:0;padding:0;border-radius:50%;background:center/100% 100% no-repeat;pointer-events:auto;filter:drop-shadow(0 3px 4px #0009)}
.pot:active{transform:scale(.93)}
.pot.none{filter:grayscale(1) brightness(.6) drop-shadow(0 3px 4px #0009)}
.pot b{position:absolute;right:-3px;bottom:-3px;min-width:19px;height:19px;border-radius:10px;background:#2a160b;border:2px solid #e3b35f;color:#fff;font-size:11px;line-height:15px;text-align:center;padding:0 3px}
#swap{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;padding:0;border-radius:50%;background:var(--swapI) center/100% 100% no-repeat;pointer-events:auto;color:#ffe9b8;font-weight:900;filter:drop-shadow(0 3px 4px #0009)}
#swap small{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;background:#9e2a22;border:2px solid #e3b35f;font-size:11px;line-height:16px;text-align:center}

#lvOrb{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--ring) center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;filter:drop-shadow(0 2px 2px #0008)}
#lvOrb b{font-size:14px;line-height:13px;color:#ffe08a;text-shadow:0 1px 2px #000}
#lvOrb small{font-size:8px;line-height:8px;color:#f3e6c8;font-weight:800}
.sk.empty{opacity:.75}
.sk[data-pen]:not([data-pen=''])::after{content:attr(data-pen);position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:10px;font-weight:900;color:#fff;background:#2a160bdd;border-radius:6px;padding:0 4px;white-space:nowrap}.sk[data-glyph]:not([data-glyph=''])::before{content:attr(data-glyph);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900;color:#ffe9b8;text-shadow:0 2px 3px #000;z-index:2}
#cluster.drop{z-index:12}

  }

  if (flip && dir === 'side'){ ctx.translate(P.x, 0); ctx.scale(-1, 1); ctx.translate(-P.x, 0); }
  if (L.back) L.back();
  ctx.drawImage(fr, P.x - w / 2 + L.lunge[0], by - h + L.lunge[1], w, h);
  if (L.front) L.front();
  ctx.restore();
}

// ======================= 전투 이펙트(VFX) =======================
// 시트에서 잘라 낸 그림(assets/vfx, tools/vfx_slice.py)으로 스킬·타격·몬스터 공격·상태이상을 그린다.
// 그림이 아직 안 불러졌으면 각 호출부가 예전 선 그림으로 대신 그린다(vfxReady).
const VFXI = {};
(function(){
  const src = (typeof A !== 'undefined' && A.vfx) || {};
  for (const k in src){ const im = new Image(); im.src = src[k]; VFXI[k] = im; }
})();
// 투사체 그림이 가리키는 방향(도, 캔버스 기준: 0=오른쪽, 90=아래). 날아가는 방향에 맞춰 돌릴 때 쓴다.
const VFX_HEAD = { shot_fire:145, shot_rock:155, shot_poison:150, shot_dark:142, shot_holy:155, shot_ice:-33, shot_blade:0 };
const VFX_STATUS = { burn:'fire', slow:'slow', freeze:'ice', stone:'stone', bleed:'blood' };

// 효과별 지속 시간(초). town.js의 drawSkillFx와 아래 바닥 층이 같이 쓴다.
const VFX_DUR = { holyshield:.65,resurrection:1.2, thunderstrike:.55, heal:.75, hit:.26, hurt:.3, kill:.6, fireburst:.7, iceburst:.65, icehit:.5, castfire:.75, castice:.75, slashpower:.42, spinpower:.45,
  firestorm:.75, frostwave:.65, chain:.4, voltburst:.5, darkburst:.6, poisonburst:.55, waveburst:.4, castdark:.75, castbolt:.75,
  spearthrust:.3,spearburst:.5,fistdash:.35,quake:.55 };

function vfxReady(n){ const im = VFXI[n]; return !!(im && im.complete && im.naturalWidth > 0); }
// n 그림을 (x,y)에 가로 w 크기로 그린다. o: rot(라디안) alpha add(밝게 겹치기) base(그림 아랫변을 y에 맞춤) sy(세로 눌림) flip
function vfxDraw(n, x, y, w, o){
  const im = VFXI[n]; if (!vfxReady(n)) return false;
  o = o || {};
  const h = w * im.naturalHeight / im.naturalWidth;
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, o.alpha == null ? ctx.globalAlpha : o.alpha));
  if (o.add) ctx.globalCompositeOperation = 'lighter';
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.sy) ctx.scale(1, o.sy);
  if (o.flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -w / 2, o.base ? -h : -h / 2, w, h);
  ctx.restore();
  return true;
}
// 한 번 터지는 연출: 작게 시작해 커지며 사라진다. k = 0~1 진행도
function vfxPlay(n, x, y, size, k, o){
  o = o || {};
  const s0 = o.s0 == null ? .55 : o.s0;
  const e = 1 - Math.pow(1 - Math.min(1, k * 1.7), 3);
  const w = size * (s0 + (1 - s0) * e) * (1 + k * .1);
  const a = k < .12 ? k / .12 : Math.max(0, 1 - Math.pow((k - .12) / .88, 1.5));
  return vfxDraw(n, x, y, w, Object.assign({}, o, { alpha: a * (o.alpha == null ? 1 : o.alpha) }));
}
function vfxPick(f, list){ if (f.v == null) f.v = Math.floor(Math.random() * 1000); return list[f.v % list.length]; }

// ================= 코드로 직접 그리는 폭발(그림 없이) =================
// 섬광 → 불덩이 → 연기, 튀는 파편, 속성별 특징(얼음 조각·번개 줄기·어둠 수축·독 거품)을 겹쳐 그린다.
// 모양은 진행도 k(0~1)와 씨앗(seed)만으로 정해져서, 같은 폭발은 매 프레임 같은 모양이다.
const VFX_PAL = {
  fire:  { core:[255,248,214], mid:[255,176,46],  out:[255,72,18],  smoke:[44,32,28],  s1:'#fff0a0', s2:'#ff8a2a' },
  ice:   { core:[255,255,255], mid:[190,240,255], out:[70,170,255], smoke:[205,238,255], s1:'#ffffff', s2:'#9fe4ff' },
  volt:  { core:[255,255,255], mid:[255,244,120], out:[255,190,20], smoke:[60,50,20],  s1:'#ffffff', s2:'#ffe45c' },
  dark:  { core:[240,220,255], mid:[170,100,255], out:[80,25,150],  smoke:[28,8,48],   s1:'#f0e0ff', s2:'#b070ff' },
  poison:{ core:[240,255,190], mid:[150,255,60],  out:[50,150,20],  smoke:[30,60,15],  s1:'#eaffb0', s2:'#8cff38' }
};
function vfxRnd(s, i){ const v = Math.sin(s * 12.9898 + i * 78.233) * 43758.5453; return v - Math.floor(v); }
function vfxSeed(o){ if (o.v == null) o.v = Math.floor(Math.random() * 1000); return o.v + 1; }
function vfxC(c, a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + Math.max(0, Math.min(1, a)).toFixed(3) + ')'; }
function vfxGlow(x, y, rad, stops){
  const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(1, rad));
  for (const s of stops) g.addColorStop(s[0], s[1]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, Math.max(1, rad), 0, 7); ctx.fill();
}
// 지그재그 줄기(번개) 하나. 두 번 겹쳐 그려 빛번짐과 심지를 만든다.
function vfxZig(x0, y0, x1, y1, amp, tick, seed, a, wide, col, core){
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, n = 6;
  const path = () => {
    ctx.beginPath(); ctx.moveTo(x0, y0);
    for (let j = 1; j < n; j++){ const t = j / n, o = (vfxRnd(seed + tick * 3.7, j) - .5) * 2 * amp * Math.sin(t * 3.14); ctx.lineTo(x0 + dx * t + nx * o, y0 + dy * t + ny * o); }
    ctx.lineTo(x1, y1);
  };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = a * .55; ctx.strokeStyle = col; ctx.lineWidth = wide; path(); ctx.stroke();
  ctx.globalAlpha = a; ctx.strokeStyle = core; ctx.lineWidth = Math.max(1, wide * .35); path(); ctx.stroke();
}

// 속성 폭발 한 방. (x, gy) = 바닥에 닿는 자리, R = 폭발 반지름(실제로 맞는 범위에 맞춘다), k = 0~1 진행도
function vfxBlast(kind, seed, x, gy, R, k){
  const Pa = VFX_PAL[kind]; if (!Pa) return false;
  k = Math.max(0, Math.min(1, k));
  const e = 1 - Math.pow(1 - Math.min(1, k * 2.4), 3);
  const life = k < .12 ? k / .12 : Math.max(0, 1 - Math.pow((k - .12) / .88, 1.5));
  const heat = Math.max(0, 1 - k * 1.7);
  const cy = gy - R * .38, tt = k * .6;
  const rn = (i) => vfxRnd(seed, i);
  ctx.save();
  // 1) 연기·안개: 몸통 뒤에 깔려서 터진 뒤에도 잠깐 남는다
  if (k > .16 && kind !== 'volt'){
    const s = (k - .16) / .84, sa = Math.sin(s * Math.PI) * (kind === 'ice' ? .3 : kind === 'dark' ? .5 : .38);
    for (let i = 0; i < 5; i++){
      const an = rn(40 + i) * 6.283, d = R * .35 * rn(50 + i);
      const px = x + Math.cos(an) * d, py = cy + Math.sin(an) * d * .5 - R * (.15 + .55 * s) * (.5 + rn(60 + i));
      const rad = R * (.28 + .3 * rn(70 + i)) * (.6 + .6 * s);
      vfxGlow(px, py, rad, [[0, vfxC(Pa.smoke, sa)], [.6, vfxC(Pa.smoke, sa * .6)], [1, vfxC(Pa.smoke, 0)]]);
    }
  }
  // 2) 몸통: 겹친 덩어리들이 부풀며 식는다(속이 하얗다가 노랑→주황→붉게)
  for (let i = 0; i < 7; i++){
    const an = rn(i) * 6.283, d = R * .5 * e * (.3 + .7 * rn(10 + i));
    const px = x + Math.cos(an) * d, py = cy + Math.sin(an) * d * .7 - R * .3 * k * (.4 + rn(20 + i));
    const rad = R * (.3 + .28 * rn(30 + i)) * (.35 + .65 * e) * (1 - .2 * k);
    vfxGlow(px, py, rad, [[0, vfxC(Pa.core, life * heat)], [.3, vfxC(Pa.mid, life * .95)], [.7, vfxC(Pa.out, life * .65)], [1, vfxC(Pa.out, 0)]]);
  }
  // 3) 속성별 몸통 보강
  if (kind === 'dark'){   // 한가운데가 검게 뚫린 구체: 터지기 전에 빨려 들어가는 점들
    vfxGlow(x, cy, R * .55 * (.7 + .5 * e), [[0, 'rgba(8,0,20,' + (life * .92).toFixed(3) + ')'], [.55, 'rgba(60,15,110,' + (life * .6).toFixed(3) + ')'], [1, 'rgba(90,30,160,0)']]);
    if (k < .4){
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 10; i++){
        const an = i * .628 + rn(80 + i), rr = R * (1.05 - .95 * (k / .4)) * (.8 + .4 * rn(90 + i));
        vfxGlow(x + Math.cos(an) * rr, cy + Math.sin(an) * rr * .7, 5, [[0, vfxC(Pa.s1 === '' ? Pa.mid : Pa.mid, .95)], [1, vfxC(Pa.out, 0)]]);
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  if (kind === 'poison'){   // 터지는 거품
    for (let i = 0; i < 8; i++){
      const bx = x + (rn(100 + i) - .5) * R * 1.4 * e, rise = k * R * (.35 + .7 * rn(110 + i)), by = cy + R * .1 - rise;
      const br = R * (.07 + .08 * rn(120 + i)) * (1 + k * .5), ba = Math.max(0, 1 - Math.pow(k, 2.2)) * Math.min(1, k * 8);
      ctx.fillStyle = vfxC([140, 255, 70], ba * .22); ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill();
      ctx.strokeStyle = vfxC([205, 255, 150], ba * .9); ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = vfxC([255, 255, 255], ba * .9); ctx.beginPath(); ctx.arc(bx - br * .35, by - br * .35, Math.max(1, br * .22), 0, 7); ctx.fill();
    }
  }
  // 4) 터지는 순간의 섬광(밝게 겹치기)
  if (k < .3){
    const q = k / .3;
    ctx.globalCompositeOperation = 'lighter';
    vfxGlow(x, cy, R * (.55 + .9 * q), [[0, vfxC(Pa.core, Math.pow(1 - q, 1.3))], [.45, vfxC(Pa.mid, .6 * Math.pow(1 - q, 1.3))], [1, vfxC(Pa.out, 0)]]);
    ctx.globalCompositeOperation = 'source-over';
  }
  // 5) 튀는 파편: 중력에 휘며 떨어지는 불꽃/불씨 (줄무늬 꼬리)
  const nsp = ({ fire:14, volt:9, dark:8, poison:6, ice:0 })[kind];
  if (nsp){
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    const sa = Math.pow(1 - k, 1.2);
    for (let i = 0; i < nsp; i++){
      const an = rn(130 + i) * 6.283, sp = R * (2.2 + 2.4 * rn(140 + i));
      const vx = Math.cos(an) * sp, vy = Math.sin(an) * sp * .8 - sp * .3;
      const px = x + vx * tt * (1 - .3 * k), py = cy + vy * tt * (1 - .3 * k) + R * 5 * tt * tt;
      ctx.strokeStyle = i % 2 ? Pa.s2 : Pa.s1; ctx.globalAlpha = sa; ctx.lineWidth = 2.4 * (1 - k) + .8;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - vx * .035, py - vy * .035); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // 6) 얼음: 깨져 튀는 유리 조각 + 십자 서리 섬광
  if (kind === 'ice'){
    if (k < .35){
      const q = k / .35; ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = vfxC([230, 250, 255], 1 - q); ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++){ const an = i * 1.047 + .3, l1 = R * (.25 + .8 * q), l0 = R * .1; ctx.beginPath(); ctx.moveTo(x + Math.cos(an) * l0, cy + Math.sin(an) * l0); ctx.lineTo(x + Math.cos(an) * l1, cy + Math.sin(an) * l1); ctx.stroke(); }
      ctx.globalCompositeOperation = 'source-over';
    }
    for (let i = 0; i < 9; i++){
      const an = rn(150 + i) * 6.283, sp = R * (1.5 + 1.5 * rn(160 + i)), L = R * (.12 + .12 * rn(170 + i)), w = L * .36;
      const px = x + Math.cos(an) * sp * tt * (1 - .25 * k), py = cy + Math.sin(an) * sp * .85 * tt * (1 - .25 * k) - sp * .1 * tt + R * 4.5 * tt * tt;
      const rot = an + k * 5 * (rn(180 + i) - .5), a = Math.pow(1 - k, .8) * Math.min(1, k * 14);
      ctx.save(); ctx.translate(px, py); ctx.rotate(rot);
      ctx.beginPath(); ctx.moveTo(L, 0); ctx.lineTo(0, w); ctx.lineTo(-L * .6, 0); ctx.lineTo(0, -w); ctx.closePath();
      ctx.fillStyle = vfxC([196, 238, 255], a * .85); ctx.fill(); ctx.strokeStyle = vfxC([255, 255, 255], a); ctx.lineWidth = 1.3; ctx.stroke();
      ctx.restore();
    }
  }
  // 7) 번개: 사방으로 갈라지는 전기 줄기(몇 프레임마다 모양이 바뀜)
  if (kind === 'volt'){
    const tick = Math.floor(k * 16), a = Math.max(0, 1 - Math.pow(k, 1.5));
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 6; i++){
      const an = i * 1.047 + rn(190 + i) * .6, len = R * (.75 + .5 * rn(200 + i)) * (.5 + .5 * e);
      vfxZig(x, cy, x + Math.cos(an) * len, cy + Math.sin(an) * len * .8, R * .16, tick, seed + i, a, 6 * (1 - k) + 2, '#ffd93a', '#fffbe0');
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  return true;
}

// 타격 불꽃: 번쩍 + 사방으로 뻗는 선 (치명타는 십자 섬광이 더해짐, 'hurt'는 붉은색)
function vfxHitSpark(seed, x, y, R, k, mode){
  k = Math.max(0, Math.min(1, k));
  const crit = mode === 'crit', hurt = mode === 'hurt';
  const e = 1 - Math.pow(1 - Math.min(1, k * 2.6), 3), fade = Math.pow(1 - k, 1.4);
  const main = hurt ? [255, 90, 70] : crit ? [255, 170, 40] : [255, 214, 120], core = hurt ? [255, 225, 215] : [255, 250, 220];
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  vfxGlow(x, y, R * (.45 + .5 * k), [[0, vfxC(core, fade)], [.5, vfxC(main, fade * .6)], [1, vfxC(main, 0)]]);
  const n = crit ? 11 : 7;
  for (let i = 0; i < n; i++){
    const an = i / n * 6.283 + vfxRnd(seed, i) * .5, r0 = R * (.12 + .5 * e), r1 = r0 + R * (.35 + .4 * vfxRnd(seed, 20 + i)) * (1 - k);
    ctx.strokeStyle = vfxC(main, fade * .55); ctx.lineWidth = (crit ? 6 : 4.5) * (1 - k) + 1;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(an) * r0, y + Math.sin(an) * r0); ctx.lineTo(x + Math.cos(an) * r1, y + Math.sin(an) * r1); ctx.stroke();
    ctx.strokeStyle = vfxC(core, fade); ctx.lineWidth = (crit ? 2.6 : 1.8) * (1 - k) + .6; ctx.stroke();
  }
  if (crit){   // 네 갈래 별빛
    const L = R * 1.15 * (1 - k * .5), W = R * .1 * (1 - k);
    for (let q = 0; q < 2; q++){
      ctx.save(); ctx.translate(x, y); ctx.rotate(q * 1.5708 + .785);
      ctx.fillStyle = vfxC(core, fade); ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(0, W); ctx.lineTo(L, 0); ctx.lineTo(0, -W); ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = vfxC(main, fade * .5); ctx.lineWidth = 2 * (1 - k) + .5; ctx.beginPath(); ctx.arc(x, y, R * (.2 + .8 * e), 0, 7); ctx.stroke();
  ctx.restore();
  return true;
}
// 쓰러질 때 먼지: 바닥으로 퍼지는 흙먼지 + 튀는 부스러기
function vfxDust(seed, x, gy, R, k){
  k = Math.max(0, Math.min(1, k));
  const e = 1 - Math.pow(1 - Math.min(1, k * 2), 3), a = Math.sin(Math.min(1, k * 1.15) * Math.PI) * .5;
  ctx.save();
  for (let i = 0; i < 7; i++){
    const an = i / 7 * 6.283 + vfxRnd(seed, i) * .8, d = R * (.35 + .65 * vfxRnd(seed, 10 + i)) * e;
    const px = x + Math.cos(an) * d, py = gy + Math.sin(an) * d * .38 - R * .22 * k * (.4 + vfxRnd(seed, 20 + i)), rad = R * (.22 + .18 * vfxRnd(seed, 30 + i)) * (.6 + .6 * e);
    vfxGlow(px, py, rad, [[0, 'rgba(176,160,132,' + a.toFixed(3) + ')'], [.6, 'rgba(150,136,112,' + (a * .6).toFixed(3) + ')'], [1, 'rgba(150,136,112,0)']]);
  }
  for (let i = 0; i < 6; i++){
    const an = -3.14 * (.15 + .7 * vfxRnd(seed, 40 + i)), sp = R * (1.4 + 1.6 * vfxRnd(seed, 50 + i)), tt = k * .6;
    ctx.fillStyle = 'rgba(120,104,84,' + (Math.pow(1 - k, 1.2) * .9).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x + Math.cos(an) * sp * tt, gy + Math.sin(an) * sp * tt + R * 5 * tt * tt, 2.4 * (1 - k * .5), 0, 7); ctx.fill();
  }
  ctx.restore();
  return true;
}
// 타오르는 불꽃 한 가닥(장판용): 아래가 넓고 끝이 일렁이며 뾰족한 방울꼴. ph = 0~1 위상
function vfxFlame(x, gy, w, ph, al){
  const h = w * (1.5 + .5 * Math.sin(ph * 6.283)), sway = Math.sin(ph * 12.566) * w * .18;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(x, gy);
  const layer = (s, c0, c1) => {
    const ww = w * s, hh = h * (.55 + .45 * s);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-ww * .6, -hh * .15, -ww * .55, -hh * .6, sway * s, -hh);
    ctx.bezierCurveTo(ww * .55, -hh * .6, ww * .6, -hh * .15, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, -hh); g.addColorStop(0, c0); g.addColorStop(1, c1);
    ctx.fillStyle = g; ctx.fill();
  };
  layer(1, vfxC([255, 120, 20], al * .8), vfxC([255, 60, 10], 0));
  layer(.62, vfxC([255, 200, 70], al * .9), vfxC([255, 150, 30], 0));
  layer(.3, vfxC([255, 250, 210], al), vfxC([255, 230, 150], 0));
  ctx.restore();
}

// 폭발 종류별로 맞는 반지름을 정한다 (몬스터 몸집을 크게 넘지 않게)
function vfxBlastR(r, min, mul){ return Math.max(min, r * mul); }
// 스킬·타격 이펙트 하나를 그린다. 그렸으면 true (drawSkillFx가 부름)
function vfxSkill(f, k, x, y, r){
  if (f.type === 'chain') return vfxChain(f, k);
  const sd = vfxSeed(f);
  switch (f.type){
    case 'fireburst': return vfxBlast('fire', sd, x, y + 14, vfxBlastR(r, 50, .95), k);
    case 'iceburst':  return vfxBlast('ice', sd, x, y + 14, vfxBlastR(r, 46, .95), k);
    case 'icehit':    return vfxBlast('ice', sd, x, y + 10, vfxBlastR(r, 36, 1.15), k);
    case 'voltburst': return vfxBlast('volt', sd, x, y + 14, vfxBlastR(r, 36, 1.15), k);
    case 'darkburst': return vfxBlast('dark', sd, x, y + 14, vfxBlastR(r, 36, 1.15), k);
    case 'poisonburst': return vfxBlast('poison', sd, x, y + 14, vfxBlastR(r, 36, 1.15), k);
    case 'firestorm':{
      const e = 1 - Math.pow(1 - Math.min(1, k * 1.6), 3);

// 날아가는 것 밑에 바닥 그림자와 번지는 빛을 깔아서 "떠다니는 그림"처럼 보이지 않게 한다.
function vfxAura(x, y, col, r){

const VFX_AURA = { shot_fire:'#ff8a2a', shot_ice:'#7ddcff', shot_dark:'#a050ff', shot_holy:'#ffe9a0', shot_poison:'#8cff38', shot_rock:'', shot_blade:'#cfe8ff' };

const VFX_PSHOT = { ice:'shot_ice', fire:'shot_fire', dark:'shot_dark', blade:'shot_blade', wave:'shot_holy' };
function vfxShot(s, a){

    ctx.strokeStyle='rgba(255,214,120,.35)';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(18,0);ctx.stroke();

// 번개 구체: 그림 없이 빛 덩어리와 튀는 전기줄기로 그린다
function vfxBoltOrb(s){

// 연쇄 벼락: 맞은 대상들을 잇는 지그재그 전기줄기 + 맞은 곳 번개 폭발
function vfxChain(f, k){
  const p = f.pts; if (!p || p.length < 2) return true;

// ---- 바닥 층: 캐릭터·몬스터보다 아래에 깔리는 효과 (town.js 그리기 순서에서 스프라이트 앞에 부름) ----
function vfxGroundPass(){
  if ((!sfx.length && !zones.length) || !vfxReady('burst_fire_0')) return;
  vfxZonesGround();
  for (const f of sfx){
    const k = f.t / (VFX_DUR[f.type] || .38); if (k < 0 || k >= 1) continue;

    // 시전 마법진은 캐릭터 발에 붙어 따라다닌다(달리면서 써도 발밑에 있음)
    if (f.type === 'castfire') vfxCastCircle(k, P.x, P.y + 4, r, '#ff7a2a', '#ffd9a0', 'ring_red');
    else if (f.type === 'castice') vfxCastCircle(k, P.x, P.y + 4, r, '#5fcfff', '#e8fbff', 'ring_blue');
    else if (f.type === 'castdark') vfxCastCircle(k, P.x, P.y + 4, r, '#a050ff', '#ecd9ff', 'ring_blue');
    else if (f.type === 'castbolt') vfxCastCircle(k, P.x, P.y + 4, r, '#ffe45c', '#fffbd0', 'ring_gold');

// 발밑에서 위잉 돌며 떠오르는 마법진. 캐릭터 아래에 깔린다.
function vfxCastCircle(k, x, gy, r, col, col2, img){

function vfxGroundBurst(k, x, gy, r, col, scorch){

      const sx=P.x-x0,sy=P.y-y0,L2=sx*sx+sy*sy||1;
      for(const t of combatTargets()){
        const px=t.x-x0,py=t.y-y0,u=Math.max(0,Math.min(1,(px*sx+py*sy)/L2)),cx=x0+sx*u,cy=y0+sy*u;
        if(Math.hypot(t.x-cx,t.y-cy)<44)hitTarget(t,d,true,Math.round(phy*(2+rank*.07)),12);

// 관통 투사체가 한 대상에 처음 닿았을 때
function pierceHit(s, t){
  hitTarget(t, [Math.sign(t.x - s.x) || Math.sign(s.vx) || 1, Math.sign(s.vy) * .4 || 0], !!s.stagger, s.dmg);
  if (s.status) applyMonsterStatus(t, s.status, s.statusDur || 2.5);
  sfx.push({ type:s.fx || 'impact', t:0, x:t.x, y:t.y - (t.h || 60) * .5, r:34 });
  if (s.mpGain && (s.mpGot || 0) < (s.mpCap || 2)){ s.mpGot = (s.mpGot || 0) + s.mpGain; P.mp = Math.min(P.maxMp, P.mp + s.mpGain * NUM); syncBars(); }
}

function updZones(dt){
  for (let i = zones.length - 1; i >= 0; i--){
    const z = zones[i];
    if (typeof MAP !== 'undefined' && z.map !== MAP){ zones.splice(i, 1); continue; }
    z.t += dt;
    if (z.type === 'blizzard' || z.type === 'swamp' || z.type === 'thunderstorm'){
      if(z.type==='blizzard'){z.x=P.x;z.y=P.y;}
      while(z.nextTick<=z.dur+.001 && z.t>=z.nextTick){
        z.nextTick+=z.interval;
        const thunder=z.type==='thunderstorm',center=thunder?{x:z.x+z.d[0]*(95+z.hits*90),y:z.y+z.d[1]*(95+z.hits*90)}:z;
        for(const target of combatTargets()) if(skGround(target,center)<z.R+14){
          hitTarget(target,[0,0],false,z.dmg);
          if(!thunder)applyMonsterStatus(target,'slow',.8);
          if(z.freeze && Math.random()<z.freeze)applyMonsterStatus(target,'freeze',.6);
          if(z.paralyze)applyMonsterStatus(target,'freeze',1);
        }
        if(thunder){z.hits++;sfx.push({type:'thunderstrike',t:0,x:center.x,y:center.y-14,r:z.R});}
      }
      if(z.t>z.dur+.05)zones.splice(i,1);
    } else if(z.type==='spearcombo'){
      while(z.hits<3&&z.t>=z.nextTick){
        z.nextTick+=z.interval;const third=z.hits===2;z.hits++;
        for(const target of combatTargets()){
          const dx=target.x-z.x,dy=target.y-z.y,along=dx*z.d[0]+dy*z.d[1],side=Math.abs(dx*z.d[1]-dy*z.d[0]);
          if(along>-10&&along<z.R&&side<z.width)hitTarget(target,z.d,third,Math.round(z.dmg*(third?1.5:1)),third?36:20);
        }
        sfx.push({type:'spearthrust',t:0,a:Math.atan2(z.d[1],z.d[0]),x:z.x+z.d[0]*(72+z.hits*12),y:z.y-34+z.d[1]*(72+z.hits*12),r:third?55:38,crit:third});
      }
      if(z.hits>=3&&z.t>z.dur)zones.splice(i,1);
    } else if(z.type==='spearfall'){
      if(!z.hit&&z.t>=z.delay){z.hit=true;for(const target of combatTargets())if(skGround(target,z)<z.r+14)hitTarget(target,[Math.sign(target.x-z.x)||1,Math.sign(target.y-z.y)||0],true,z.dmg,38);
        sfx.push({type:'spearburst',t:0,x:z.x,y:z.y-12,r:z.r});}
      if(z.t>z.delay+.45)zones.splice(i,1);
    } else if(z.type==='arrowrain'){
      while(z.nextTick<=z.dur+.001&&z.t>=z.nextTick){z.nextTick+=z.interval;
        for(const target of combatTargets())if(skGround(target,z)<z.R+14){hitTarget(target,[0,0],false,z.dmg);applyMonsterStatus(target,'slow',.9);}
      }
      if(z.t>z.dur+.05)zones.splice(i,1);
    } else if(z.type==='fistquake'){
      while(z.hits<3&&z.t>=z.nextTick){z.nextTick+=z.interval;z.hits++;
        for(const target of combatTargets())if(skGround(target,z)<z.R+14){hitTarget(target,[Math.sign(target.x-z.x)||1,Math.sign(target.y-z.y)||0],true,z.dmg,28);applyMonsterStatus(target,'slow',1.5);}
        sfx.push({type:'quake',t:0,x:z.x,y:z.y-8,r:z.R*(.7+z.hits*.1)});
      }
      if(z.hits>=3&&z.t>z.dur)zones.splice(i,1);
    } else if (z.type === 'meteor'){
      if (!z.hit && z.t >= z.delay){
        z.hit = true;
        for (const t of combatTargets()) if (skGround(t, z) < z.r){ hitTarget(t, [Math.sign(t.x - z.x) || 1, Math.sign(t.y - z.y) || 0], true, z.dmg); applyMonsterStatus(t, 'burn', 3.5); }
        sfx.push({ type:'fireburst', t:0, x:z.x, y:z.y - 14, r:z.r });
      }
      if (z.hit){
        z.tick -= dt;
        if (z.tick <= 0){ z.tick += .5; for (const t of combatTargets()) if (skGround(t, z) < z.r * .85){ hitTarget(t, [0, 0], false, z.tickDmg); applyMonsterStatus(t, 'burn', 2.5); } }
      }
      if (z.t > z.delay + z.life) zones.splice(i, 1);
    } else if (z.type === 'darkpulse'){
      const e = Math.min(1, z.t / z.exp), cr = z.R * (1 - Math.pow(1 - e, 2));
      while (z.nextTick <= z.dur + .001 && z.t >= z.nextTick){
        z.nextTick += .28;
        for (const t of combatTargets()){
          if (skGround(t, z) > cr + 14) continue;
          hitTarget(t, [Math.sign(t.x - z.x) || 1, Math.sign(t.y - z.y) || 0], false, z.dmg);
          if (!z.chaosRolled.has(t)){ z.chaosRolled.add(t); if (Math.random() < z.chaos){ applyMonsterStatus(t, 'confuse', 2.5); pops.push({ x:t.x, y:t.y - (t.h || 60) - 6, t:0, txt:'혼돈!', crit:true }); } }
        }
      }
      if (z.t > z.dur + .3) zones.splice(i, 1);
    } else if (z.type === 'voidring'){
      const e = Math.min(1, z.t / z.dur), cr = z.R * (1 - Math.pow(1 - e, 2));
      for (const t of combatTargets()){
        if (z.hit.has(t) || skGround(t, z) > cr + 14) continue;
        z.hit.add(t);
        hitTarget(t, [Math.sign(t.x - z.x) || 1, Math.sign(t.y - z.y) || 0], true, z.dmg);
        applyMonsterStatus(t, 'slow', 2.5);
        if (z.drain){ const v = Math.round(z.dmg * z.drain); P.hp = Math.min(P.maxHp, P.hp + v); syncBars(); pops.push({ x:P.x, y:P.y - 100, t:0, txt:'+' + v, heal:true }); }
      }
      if (z.t > z.dur + .35) zones.splice(i, 1);
    }
  }
}

// 소생은 한 번 준비하면 사망 시 소모된다. 재사용 시각은 저장해 재접속으로 초기화되지 않는다.
function tryRevivePlayer(){
  if(!P.reviveArmed)return false;
  P.reviveArmed=false;
  const rank=Math.max(1,Math.min(5,P.reviveRank||1));
  P.hp=Math.max(1,Math.round(P.maxHp*(.3+(rank-1)*.175)));
  P.reviveReadyAt=Date.now()+180000;CD.holy3_revive=180;P.reviveGrace=1.5;playerInv=1.5;
  P.castRoot=0;P.atk=null;P.shield=0;
  for(const key in PLAYER_STATUS)PLAYER_STATUS[key]=0;
  syncBars();sfx.push({type:'resurrection',t:0,x:P.x,y:P.y-20,r:110});
  pops.push({x:P.x,y:P.y-110,t:0,txt:'기적의 소생!',heal:true});
  if(window.UI&&UI.save)UI.save();return true;
}

// 여관 1단계 + 감정사: 실내 이동, 회복, 미확인 장비 감정.
function innCost(){return Math.max(0,(P.lv||1)*8);}
function enterInn(){if(MAP!=='town')return false;return travel('inn',MAPS.inn.spawn,'back');}
function leaveInn(){closeAll();return MAP==='inn'?travel('town',MAPS.inn.back,'front'):false;}
function openInnDlg(n){
  talking=n;
  $('dlgImg').src=A.port[n.k];$('dlgName').textContent=n.name;$('dlgTitle').textContent=n.title;
  $('dlgLine').textContent=n.line||'어서 와요~ 잠깐 쉬었다 가세요.';
  $('dlgMainRow').hidden=true;$('dlgInnRow').hidden=false;
  $('dlgRest').textContent='푹 쉬기 ('+innCost()+'G)';
  show('dlg');return true;
}
function identifyInn(){
  if(MAP!=='inn'||!window.UI||!UI.openIdentifyVendor)return false;
  closeAll();return UI.openIdentifyVendor();
}
function restInn(){
  if(MAP!=='inn')return false;
  if(P.hp>=P.maxHp&&P.mp>=P.maxMp){$('dlgLine').textContent='지금은 쉴 필요가 없어 보입니다.';return false;}
  const cost=innCost();
  if(P.gold<cost){$('dlgLine').textContent='금화가 부족합니다.';return false;}
  setGold(P.gold-cost);
  const f=$('fade');f.classList.add('slow');requestAnimationFrame(()=>f.classList.add('on'));
  setTimeout(()=>{
    P.hp=P.maxHp;P.mp=P.maxMp;P.mpAcc=0;
    if(typeof PLAYER_STATUS!=='undefined')for(const k in PLAYER_STATUS)PLAYER_STATUS[k]=0;
    syncBars();$('dlgLine').textContent='푹 쉬었어요. 체력과 마나가 모두 회복됐습니다.';
    if(window.UI&&UI.save)UI.save();
    setTimeout(()=>{f.classList.remove('on');setTimeout(()=>f.classList.remove('slow'),420);},160);
  },360);
  return true;
}
$('dlgRest').addEventListener('click',restInn);
$('dlgIdentify').addEventListener('click',identifyInn);
$('dlgLeave').addEventListener('click',()=>{if(MAP==='inn')leaveInn();else closeAll();});
window.__INN={enter:enterInn,leave:leaveInn,open:()=>{const n=npcs.find(x=>x.shop==='inn');return n?openInnDlg(n):false;},rest:restInn,identify:identifyInn,cost:innCost,state:()=>({map:MAP,x:P.x,y:P.y,gold:P.gold,hp:P.hp,mp:P.mp})};

const chatBag={},chatLast={};

function chatShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function chatSub(s){return s.replace(/\{이름\}/g,(P&&P.name)||'루크레아');}
function chatNext(key,pool){
  let b=chatBag[key];
  if(!b||!b.length){
    b=chatShuffle(pool.slice());
    if(b.length>1&&b[b.length-1]===chatLast[key]){const t=b[0];b[0]=b[b.length-1];b[b.length-1]=t;}
    chatBag[key]=b;
  }
  const s=b.pop();chatLast[key]=s;return s;
}
function chatKey(n){if(!n)return null;return CHAT.npc[n.name]?n.name:(CHAT.npc[n.title]?n.title:null);}
function chatTalk(n){const k=chatKey(n);return k?chatSub(chatNext('n:'+k,CHAT.npc[k])):null;}

function chatQuiet(now){
  if(!(MAP==='dungeon'||MAP==='field'))return false;
  if(panel||traveling)return false;
  if(window.UI&&UI.isOpen&&UI.isOpen())return false;
  if(now-chatLastHurt<CHAT_CFG.quietAfterHurt*1000)return false;
  if(typeof monsters!=='undefined'&&monsters.some(m=>!m.dead&&Math.hypot(m.x-P.x,m.y-P.y)<CHAT_CFG.nearMonster))return false;
  return true;
}
function chatEvent(kind,delayMs){
  if(P.chatter===false)return false;
  const now=performance.now();
  if(chatPending&&now<chatPending.exp)return false;
  if(now-chatLastMono<CHAT_CFG.monoGap*1000)return false;
  if(Math.random()>(CHAT_CFG.chance[kind]||0))return false;
  const pool=CHAT.mono[kind];if(!pool)return false;
  chatPending={txt:chatSub(chatNext('m:'+kind,pool)),due:now+(delayMs||0),exp:now+6000};
  return true;
}
setInterval(()=>{
  const now=performance.now();
  if(chatPending){
    if(now>chatPending.exp)chatPending=null;
    else if(now>=chatPending.due&&!bubble&&chatQuiet(now)){bubble={txt:chatPending.txt,t:0,dur:CHAT_CFG.monoSec,mono:true};chatLastMono=now;chatPending=null;}
  }
  if(!chatPending&&chatQuiet(now)){
    if(P.hp>0&&P.hp<=P.maxHp*.25)chatEvent('lowhp');
    const steps=[1000,3000,10000,30000,100000],g=P.gold|0;
    if(chatRichStep<0){chatRichStep=steps.filter(x=>g>=x).length;}
    else if(chatRichStep<steps.length&&g>=steps[chatRichStep]){chatRichStep++;chatEvent('rich');}
  }
},300);

async function makeFieldGround(theme){
  const w = 60 * TS, h = 40 * TS, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), t = fieldTiles[theme], ims = Object.values(t);
  await waitImages(ims);
  const base = t.grass || ims[0], flower = t.grass_flower || base;
  for (let y = 0; y < 40; y++) for (let x = 0; x < 60; x++){
    const im = Math.random() < 0.13 ? flower : base;
    g.drawImage(im, x * TS, y * TS, TS + 1, TS + 1);
  }
  const dirt = t.dirt || t.path || base, path = t.path || dirt;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(2.5 * TS, 20 * TS); g.bezierCurveTo(18 * TS, 17 * TS, 34 * TS, 27 * TS, 56.5 * TS, 8 * TS);
  g.strokeStyle = fieldPattern(g, dirt); g.globalAlpha = 0.36; g.lineWidth = 150; g.stroke();

  g.beginPath(); g.moveTo(13.2*TS,19.7*TS); g.bezierCurveTo(13.0*TS,16.5*TS,12.7*TS,14.0*TS,12.4*TS,11.3*TS);
  g.strokeStyle=fieldPattern(g,dirt); g.globalAlpha=.42; g.lineWidth=92; g.stroke();
  g.strokeStyle=fieldPattern(g,path); g.globalAlpha=.92; g.lineWidth=54; g.stroke();
  g.globalAlpha=.78; g.fillStyle=fieldPattern(g,dirt);
  g.beginPath(); g.ellipse(12.7*TS,8.9*TS,4.2*TS,2.7*TS,0,0,7); g.fill();
  g.restore();
  if (t.water && t.sand){
    const spots = [[29,8,2.8,1.5],[48,29,2.4,1.3]];
    for (const q of spots){
      g.save(); g.beginPath(); g.ellipse(q[0]*TS,q[1]*TS,q[2]*TS,q[3]*TS,0,0,7); g.clip();
      g.globalAlpha=.72; g.fillStyle=fieldPattern(g,t.sand); g.fillRect((q[0]-q[2])*TS,(q[1]-q[3])*TS,q[2]*2*TS,q[3]*2*TS);
      g.globalAlpha=.86; g.beginPath(); g.ellipse(q[0]*TS,q[1]*TS,q[2]*.76*TS,q[3]*.72*TS,0,0,7); g.clip();
      g.fillStyle=fieldPattern(g,t.water); g.fillRect((q[0]-q[2])*TS,(q[1]-q[3])*TS,q[2]*2*TS,q[3]*2*TS); g.restore();

}
function mkFieldProp(meta, x, y, kind, name){
  if (!meta) return null; const wt = fieldPropSize(meta.name), w = wt * TS, im = BI[meta.key], ar = im && im.naturalWidth ? im.naturalHeight / im.naturalWidth : 1;
  const h = Math.max(TS*.8, w * ar);
  const soft = isSoftName(meta.name), tree = isTreeName(meta.name);
  return { k:meta.key, name:name || null, x:x*TS, y:y*TS, w, h, cw:soft?0:(tree?.16:.72), cd:soft?0:(tree?.35*TS:.45*TS), tree, shadow:!soft, kind:kind || '', r:kind==='dungeon'?64:46 };
}
function fieldPropClear(x, y, meta, out){
  const soft = isSoftName(meta.name), rr = soft ? 0.7 : Math.max(1.0, fieldPropSize(meta.name) * 0.48);
  for (const p of out){
    if (!p || !p.k) continue;
    const pm = (A.field.props[fieldTheme] || []).find(q => q.key === p.k);
    const pr = pm && isSoftName(pm.name) ? 0.55 : Math.max(0.9, (p.w / TS) * 0.42);

}
function randomFieldProps(theme){
  const all = A.field.props[theme] || [], out = [];
  const cave = fieldPropMeta(theme,'16_'), camp = fieldPropMeta(theme,'14_'), ruin = fieldPropMeta(theme,'13_'), sign = fieldPropMeta(theme,'15_'), special = fieldPropMeta(theme,'12_');
  for (const p of [
    mkFieldProp(sign,4.5,19.4,'','지역 이정표'),
    mkFieldProp(camp,20,31,'fire','야영지'),
    mkFieldProp(ruin,38,23,'','무너진 폐허'),
    mkFieldProp(special,46,31,'','이상한 흔적'),
    mkFieldProp(cave,56,8,'dungeon','필드 동굴 입구')
  ]) if (p) out.push(p);
  const pool = all.filter(x => !/^1[3-6]_/.test(x.name));
  let tries = 0;
  while (out.length < 52 && tries++ < 500){
    const x = 2 + Math.random()*56, y = 2 + Math.random()*36;
    if (nearMainPath(x,y,2.4) || inTownReserve(x,y) || Math.hypot(x-56,y-8)<4 || Math.hypot(x-3,y-20)<4 || Math.hypot(x-57.5,y-20)<4) continue;
    const meta = pool[Math.floor(Math.random()*pool.length)]; if (!meta) break;

}

function spawnClear(m,placed=monsters,field=false){

function spawnPack(config,cx,cy,opts={}){

  }
  const radius=Math.max(leader.w,...members.map(id=>82*MOBDEF[id].bodySize))*1.5,local=[leader];
  const phase=Math.random()*Math.PI*2;

  const frontline=members.filter(id=>!MOBDEF[id].ranged),rear=members.filter(id=>MOBDEF[id].ranged);
  for(let i=0;i<members.length;i++){
    const id=members[i],ranged=!!MOBDEF[id].ranged,formation=ranged?rear:frontline,j=formation.indexOf(id)+members.slice(0,i).filter(x=>x===id).length;
    let x=cx+Math.cos(phase+i*Math.PI*2/members.length)*radius,y=cy+Math.sin(phase+i*Math.PI*2/members.length)*radius;

      const row=Math.floor(j/3),column=j%3,count=Math.min(3,formation.length-row*3),gap=82*MOBDEF[id].bodySize*1.15;
      x=cx+(ranged?1:-1)*(radius+row*gap);y=cy+(column-(count-1)/2)*gap;
    }

  }

}

// 지역 음악: 첫 입력 이후에만 재생하고, 이동·우두머리 조우 시 천천히 교차한다.
const BGM = (() => {
  const tracks = (typeof A !== 'undefined' && A.bgm) || {};
  const level = { town: 0.25, field: 0.24, dungeon: 0.19, boss: 0.28 };
  const fadeMs = 1400;
  let unlocked = false, current = null, activeBoss = null;
  const fading = new Set(), ramps = new WeakMap();

  function target(){
    if (MAP !== 'dungeon') { activeBoss = null; return MAP === 'town' ? 'town' : 'field'; }
    if (activeBoss && (!monsters.includes(activeBoss) || activeBoss.dead)) activeBoss = null;
    if (!activeBoss) activeBoss = monsters.find(m => m.boss && !m.dead &&
      (m.state === 'chase' || Math.hypot(m.x - P.x, m.y - P.y) < 360)) || null;
    return activeBoss ? 'boss' : 'dungeon';
  }
  function ramp(a, goal, done){
    const token = {}; ramps.set(a, token);
    const start = performance.now(), from = a.volume;
    function tick(now){
      if (ramps.get(a) !== token) return;
      const p = Math.min(1, (now - start) / fadeMs);
      a.volume = Math.max(0, Math.min(1, from + (goal - from) * p));
      if (p < 1) requestAnimationFrame(tick);
      else if (done) done();
    }
    requestAnimationFrame(tick);
  }
  function play(a){ a.play().catch(() => {}); }
  function sync(){
    if (!unlocked) return;
    if (!SFX.on || document.hidden){
      if (current) current.audio.pause();
      for (const a of fading) a.pause();
      return;
    }
    const name = target();
    if (!tracks[name]) return;
    if (current && current.name === name){
      if (current.audio.paused) play(current.audio);
      return;
    }
    if (current){
      const old = current.audio; fading.add(old);
      ramp(old, 0, () => { old.pause(); old.currentTime = 0; fading.delete(old); });
    }
    const audio = new Audio(tracks[name]);
    audio.loop = true; audio.preload = 'none'; audio.volume = 0;
    current = { name, audio };
    play(audio);
    ramp(audio, level[name]);
  }
  function unlock(){ unlocked = true; sync(); }
  addEventListener('pointerdown', unlock, { capture: true });
  addEventListener('keydown', unlock, { capture: true });
  document.addEventListener('visibilitychange', sync);
  setInterval(sync, 300);
  return { sync, get track(){ return current && current.name; } };
})();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rarityForTier(tier, rank='normal'){
  tier=clamp(tier||1,1,7);
  const table=[[62,31,7,0],[56,32,12,0],[50,33,17,0],[45,34,20,1],[40,34,23,3],[35,34,26,5],[30,34,28,8]];
  const w=table[tier-1].slice();
  const shift=rank==='elite'?10:(rank==='boss'?20:0);
  const legend=tier<4?0:(rank==='boss'?5:rank==='elite'?2:0);
  const scent=(G.P.lifeSkills&&G.P.lifeSkills.moneyScent)||0, greed=(G.P.passives&&G.P.passives.greed)||0;
  const bonus=scent*1.2+greed*.6;
  if(bonus>0){const shift=Math.min(w[0]-20,bonus);w[0]-=shift;w[2]+=shift*.75;w[3]+=shift*.25;}
  w[0]-=shift;w[2]+=shift-legend;w[3]+=legend;
  let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return i;}return 0;
}
function rollAffix(it, used){
  const pool=AFFIX.filter(a=>a.slots.includes(it.kind)&&!used.has(a.id)); if(!pool.length)return;
  const a=pool[Math.floor(Math.random()*pool.length)]; used.add(a.id);
  const tier=it.tier||1, q=.25+Math.random()*.75, scale=(tier-1)/6;
  const raw=a.lo+(a.hi-a.lo)*(scale*.55+q*(.45+.55*scale)), flat=!a.pct&&a.st!=='luck';   // 체력·마나·방어 같은 고정값은 NUM배로 더 잘게 굴린다
  const v=a.pct?Math.round(raw):Math.max(1,Math.round(flat?raw*NUM:raw));
  it.aff.push({id:a.id,k:a.k,nm:a.nm,st:a.st,v,pct:a.pct});
  it.st[a.st]=(it.st[a.st]||0)+v;
}
function finalizeName(it){
  const base=GEAR_BASE[it.baseId];if(!base)throw Error('장비 기초 이름 누락');
  it.name=gearFullName(base,it.aff);
}
function make(spec){
  const base=gearBase(spec),tier=base.tier,g=base.powerGrade,roll=!!spec.roll;
  const it={id:seq++,baseId:base.id,kind:base.kind,icon:base.icon,requiredLevel:base.requiredLevel,
    rar:spec.rar!=null?spec.rar:(roll?rarityForTier(tier,spec.rank):0),tier,g,st:{},aff:[]};
  const mul=GRADE_MUL[g-1];
  if(base.kind==='weapon'){
    it.wt=base.wt;const key=base.wt==='staff'?'matk':'atk';
    it.st[key]=Math.max(1,Math.round(10*WMULT[base.wt]*mul*NUM));
  }else if(base.kind==='ring'||base.kind==='neck'){
    if(base.kind==='ring')it.st.luck=tier;else {it.st.hp=3*tier*NUM;it.st.mp=2*tier*NUM;}
  }else {
    it.style=base.style;const stats={head:[2,1,1],body:[4,4,0],hands:[1,1,0],feet:[1,2,0]}[base.kind];
    it.st.def=Math.max(1,Math.round(stats[0]*mul*NUM));
    if(stats[1])it.st.hp=Math.max(1,Math.round(stats[1]*mul*NUM));
    if(stats[2])it.st.mp=Math.max(1,Math.round(stats[2]*mul*NUM));
  }
  if(roll&&it.rar>0){
    const used=new Set(),n=it.rar===1?1:it.rar===2?2+Math.floor(Math.random()*3):4;
    while(it.aff.length<n)rollAffix(it,used);
  }
  finalizeName(it);
  if(roll&&it.aff.length>=UNID_MIN_AFFIXES){it.unid=true;it.name='미확인 '+base.name;}
  it.price=spec.price||Math.max(10,Math.round(16*mul*[1,2.2,5,12][it.rar]));return it;
}
function canEquip(it){return G.P.lv>=(it.requiredLevel||1);}
function itemStats(it){
  const st=Object.assign({},it&&it.st||{});
  if(it&&it.unid)for(const a of (it.aff||[])){
    const k=a.st,v=Number(a.v)||0;if(!k||!v)continue;
    st[k]=(st[k]||0)-v;if(Math.abs(st[k])<1e-9)delete st[k];
  }
  return st;
}

function totals(){
  const t={atk:0,matk:0,atkPct:0,matkPct:0,as:0,crit:0,critDmg:0,fire:0,ice:0,skill:0,def:0,hp:0,mp:0,ms:0,coin:0,find:0,luck:0};
  for(const s in eq){
    const it=eq[s];if(!it)continue;
    if((s==='w1'||s==='w2')&&s!==cur)continue;
    const st=itemStats(it);for(const k in st)t[k]=(t[k]||0)+st[k];
  }
  return t;
}
function derived(){
  const t=totals(),b=G.P.stats||{str:5,vit:5,int:5,mag:6,dex:8,luck:3};
  const wt=eq[cur]&&eq[cur].wt, mb=wt&&G.masteryBonus?G.masteryBonus(wt):{lv:0,dmg:0,as:0};
  const passive=G.P.passives||{}, life=G.P.lifeSkills||{};
  const phys=Math.max(1,Math.round((t.atk+b.str*.85*NUM)*(1+t.atkPct/100)*(1+mb.dmg/100)));
  let magicBase=t.matk+b.int*.85*NUM;
  if(wt&&wt!=='staff'){
    // 마법 공용: 같은 단계·지능·숙련의 일반 지팡이 기준 70% 보장.
    // 물리 공격 옵션은 변환하지 않는다. 직접 얻은 matk가 더 높으면 그대로 사용한다.
    const staffBase=10*WMULT.staff*GRADE_MUL[eq[cur].g-1]*NUM;
    magicBase=Math.max(magicBase,(staffBase+b.int*.85*NUM)*(1+mb.dmg/100)*.7);
  }
  const magic=Math.max(1,Math.round(magicBase*(1+t.matkPct/100)*(1+(wt==='staff'?mb.dmg:0)/100)));
  const maxHp=Math.round((20+b.vit*5)*NUM+t.hp), maxMp=Math.round((10+b.mag*4)*NUM+t.mp);
  const as=b.dex*.45+t.as+mb.as+(passive.rapid||0)*3;
  const crit=Math.min(65,5+b.dex*.08+t.crit+(passive.precision||0)*2);
  const critDmg=150+t.critDmg;
  const damageReduce=Math.min(65,t.def/NUM*.75+(passive.survival||0)*3);
  const manaReduce=Math.min(35,(passive.manaFlow||0)*4);
  const coin=(b.luck+t.luck)*1.5+t.coin+(passive.greed||0)*3+(life.moneyScent||0)*2;
  const find=t.find+(passive.greed||0)*5+(life.moneyScent||0)*5;
  const move=b.dex*.12+t.ms;
  return {
    t,phys,magic,maxHp,maxMp,as,crit,critDmg,damageReduce,manaReduce,coin,find,move,mastery:mb,
    fire:t.fire||0,ice:t.ice||0,skill:t.skill||0,
    rows:[
      ['str','힘',b.str,`물리 공격 ${phys}`],
      [null,'방어',t.def,`피해 감소 ${damageReduce.toFixed(1)}%`],
      ['vit','체력',b.vit,`최대 체력 ${maxHp}`],
      ['int','지능',b.int,`마법 공격 ${magic}`],
      ['mag','마력',b.mag,`최대 마나 ${maxMp}`],
      ['dex','민첩',b.dex,`공격 속도 +${as.toFixed(1)}%`],
      [null,'운',b.luck+t.luck,`골드 +${coin.toFixed(0)}% · 발견 +${find.toFixed(0)}%`]
    ]
  };
}

    const inInn=window.__INN&&__INN.state&&__INN.state().map==='inn';
    if(!identifyVendor||!inInn){G.say('여관 감정사를 이용해 주세요.');return false;}
    const cost=identifyCost(it);if(G.P.gold<cost){G.say('금화가 부족합니다.');return false;}G.setGold(G.P.gold-cost);
  }else if(via==='scroll'){
    if(!(SCR.ident>0)){G.say('감정 스크롤이 없습니다.');return false;}
    SCR.ident--;G.say(['감정 스크롤… 100골드가 연기가 됐네!','아까워라… 그래도 궁금하니까!'][Math.random()<.5?0:1]);
  }else{
    const need=identifyNeedRank(it),rank=(G.P.lifeSkills&&G.P.lifeSkills.identify)||0;
    if(rank<need){G.say('감정 랭크가 부족합니다. 여관 감정사를 이용해 주세요.');return false;}
  }
  it.unid=false;finalizeName(it);syncHud();render();
  if(pickSel)showInfo(it,pickSel.from==='eq'?'eq':'bag');
  saveGame();return true;
}
function showInfo(it, from){
  const I = $('iinfo'); I.innerHTML = '';
  const nm = el('div', 'iname', it.name); nm.style.color = RART[it.rar]; I.append(nm);
  I.append(el('div', 'isub', `${RARN[it.rar]} · ${it.kind === 'weapon' ? WN[it.wt] : SLOTN[targetSlot(it)]}`));
  I.append(el('div','isub',`T${it.tier} · 착용 Lv${it.requiredLevel||1}`));
  if (it.kind === 'weapon') I.append(el('div', 'isub', WINFO[it.wt]));
  const ic = el('img', 'iic'); ic.src = A.icons[it.icon]; I.append(ic);
  const ul = el('ul', 'ist');
  cmpLine(it, null).forEach(li => ul.append(li));
  if(it.unid)for(let i=0;i<(it.aff||[]).length;i++)ul.append(el('li','unidline','???'));
  I.append(ul);
  if (from === 'bag') I.append(cmpCards(it));
  const row = el('div', 'ibtns');
  if(it.unid){
    const need=identifyNeedRank(it),rank=(G.P.lifeSkills&&G.P.lifeSkills.identify)||0;
    if(identifyVendor){const b=el('button','btn',`감정사 감정 (${identifyCost(it)}G)`);b.type='button';b.onclick=()=>identifyItem(it,'vendor');row.append(b);}
    if(SCR.ident>0){const b=el('button','btn',`감정 스크롤 (보유 ${SCR.ident})`);b.type='button';b.onclick=()=>identifyItem(it,'scroll');row.append(b);}
    if(rank>=need){const b=el('button','btn','자가 감정');b.type='button';b.onclick=()=>identifyItem(it,'self');row.append(b);}
    else I.append(el('div','isub','자가 감정 랭크 부족 · 여관 감정사를 이용하세요.'));
  }
  if (from === 'bag'){
    if (it.kind === 'weapon'){
      for (const s of ['w1', 'w2']){ const b = el('button', 'btn', `${SLOTN[s]}에 장착`); b.type = 'button'; b.disabled=!canEquip(it); b.onclick = () => equip(it, s); row.append(b); }
    } else if (it.kind === 'ring'){
      for (const s of ['ring1', 'ring2']){ const b = el('button', 'btn', s === 'ring1' ? '왼손 반지' : '오른손 반지'); b.type = 'button'; b.disabled=!canEquip(it); b.onclick = () => equip(it, s); row.append(b); }
    } else { const b = el('button', 'btn', '장착'); b.type = 'button'; b.disabled=!canEquip(it); b.onclick = () => equip(it, it.kind); row.append(b); }
    const d = el('button', 'btn ghost', '버리기'); d.type = 'button';
    d.onclick = () => { if (d.dataset.ok){ bag[pickSel.i] = null; pickSel = null; I.classList.remove('on'); render(); } else { d.dataset.ok = 1; d.textContent = '정말 버리기'; } };
    row.append(d);
  } else {
    const b = el('button', 'btn', '벗기'); b.type = 'button'; b.onclick = () => unequip(pickSel.slot); row.append(b);
  }
  I.append(row);
  I.classList.add('on');
}
function equip(it, s){
  if(!slotOk(it,s)||!canEquip(it)){G.say('착용 레벨이 부족합니다. Lv'+it.requiredLevel+'부터 착용할 수 있습니다.');return false;}
  const i = bag.indexOf(it); if (i < 0) return;
  bag[i] = eq[s]; eq[s] = it;
  if ((s === 'w1' || s === 'w2') && !eq[cur]) cur = s;
  pickSel = { from: 'eq', slot: s }; tab = 'equip'; render(); showInfo(it, 'eq'); syncHud();saveGame();
}
function unequip(s){
  const i = bag.indexOf(null); if (i < 0){ G.say('가방이 가득 찼습니다'); return; }
  bag[i] = eq[s]; eq[s] = null;
  if (s === cur && !eq[cur]){ const o = s === 'w1' ? 'w2' : 'w1'; if (eq[o]) cur = o; }
  pickSel = { from: 'bag', i }; render(); showInfo(bag[i], 'bag'); syncHud();saveGame();
}

// 가방·상점·창고는 같은 Pointer Events 이동 규칙을 사용합니다.
let itemDrag=null,itemClickUntil=0;
const kindOrder=it=>{const list=it.kind==='weapon'?['sword','spear','gauntlet','bow','staff']:['head','body','hands','feet','ring','neck','material','potion','junk'],i=list.indexOf(it.kind==='weapon'?it.wt:it.kind);return i<0?99:(it.kind==='weapon'?i:5+i);};
function sortInventory(where,by){
  const a=where==='stash'?stash:bag;
  const tier=(x,y)=>(y.tier||1)-(x.tier||1)||(y.rar||0)-(x.rar||0)||kindOrder(x)-kindOrder(y);
  const cmp=by==='price'?(x,y)=>__SHOP.baseValue(y)-__SHOP.baseValue(x):by==='kind'?(x,y)=>kindOrder(x)-kindOrder(y)||tier(x,y):tier;
  const filled=a.filter(Boolean).map((it,i)=>({it,i})).sort((x,y)=>cmp(x.it,y.it)||x.i-y.i).map(x=>x.it);
  a.splice(0,a.length,...filled,...Array(a.length-filled.length).fill(null));pickSel=null;$('iinfo').classList.remove('on');if(tab==='shop')__SHOP.clearSelection();render();saveGame();
}
function sortButtons(where){
  const bar=el('div','inventorySort');for(const [key,label] of [['tier','티어'],['price','가격'],['kind','종류']]){const b=el('button','btn',label);b.type='button';b.dataset.sort=key;b.onclick=()=>sortInventory(where,key);bar.append(b);}return bar;
}
function inventoryItem(ref){return ref.from==='eq'?eq[ref.slot]:ref.from==='goods'?ref.it:(ref.from==='stash'?stash:bag)[ref.i];}
function inventoryDrop(source,target){
  if(!source||!target)return false;const it=inventoryItem(source);if(!it)return false;
  if(source.from==='goods')return target.from==='bag'&&__SHOP.buyAt(source.it,target.i);
  if(target.from==='merchant'||target.from==='goods')return source.from==='bag'&&__SHOP.sellAt(source.i);
  if(source.from==='eq'){
    if(target.from!=='bag'||!eq[source.slot])return false;
    const other=bag[target.i];if(other&&(!slotOk(other,source.slot)||!canEquip(other)))return false;
    bag[target.i]=it;eq[source.slot]=other;
  }else if(target.from==='eq'){
    if(source.from!=='bag'||!slotOk(it,target.slot)||!canEquip(it)){G.say('이 칸에 착용할 수 없거나 착용 레벨이 부족합니다.');return false;}
    bag[source.i]=eq[target.slot];eq[target.slot]=it;
  }else{
    if(!['bag','stash'].includes(source.from)||!['bag','stash'].includes(target.from))return false;
    if((source.from==='stash'||target.from==='stash')&&tab!=='stash')return false;
    const a=source.from==='stash'?stash:bag,b=target.from==='stash'?stash:bag;
    if(target.i<0||target.i>=b.length)return false;
    [a[source.i],b[target.i]]=[b[target.i],a[source.i]];
  }
  if(!eq[cur])cur=eq.w1?'w1':eq.w2?'w2':'w1';pickSel=null;$('iinfo').classList.remove('on');render();syncHud();saveGame();return true;
}
function cancelItemDrag(){if(!itemDrag)return;itemDrag.node.classList.remove('dragging');if(itemDrag.ghost)itemDrag.ghost.remove();itemDrag=null;}
function bindItemSlot(node,ref){
  node.dataset.inventory=ref.from;if(ref.i!=null)node.dataset.index=ref.i;if(ref.slot)node.dataset.eq=ref.slot;node._inventoryRef=ref;
  node.addEventListener('click',e=>{if(performance.now()<itemClickUntil){e.stopImmediatePropagation();e.preventDefault();}},true);
  node.addEventListener('pointerdown',e=>{
    if(e.button!==0||!inventoryItem(ref))return;cancelItemDrag();itemDrag={ref,node,pid:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),moved:false};node.setPointerCapture(e.pointerId);
  });
}
addEventListener('pointermove',e=>{
  const d=itemDrag;if(!d||e.pointerId!==d.pid)return;const dist=Math.hypot(e.clientX-d.x,e.clientY-d.y);
  if(!d.moved&&(dist>=8||(performance.now()-d.t>=200&&dist>=2))){d.moved=true;d.node.classList.add('dragging');const im=el('img','itemGhost');const it=inventoryItem(d.ref);im.src=A.icons[it.icon||it.ic];d.ghost=im;document.body.append(im);$('iinfo').classList.remove('on');}
  if(d.moved){e.preventDefault();d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';}
},{passive:false});
addEventListener('pointerup',e=>{
  const d=itemDrag;if(!d||e.pointerId!==d.pid)return;
  if(d.moved){const at=document.elementFromPoint(e.clientX,e.clientY),cell=at&&at.closest('[data-inventory]');const target=cell?cell._inventoryRef:at&&at.closest('#shop')?{from:'merchant'}:null;itemClickUntil=performance.now()+500;cancelItemDrag();inventoryDrop(d.ref,target);}else{const ref=d.ref;cancelItemDrag();dblTap(ref);}
});
// 더블클릭(모바일은 두 번 탭): 상점에선 사기·팔기, 창고에선 넣기·빼기, 평소엔 장비 착용·해제
let lastTap=null;
function dblTap(ref){
  const now=performance.now(),cur0=inventoryItem(ref),key=ref.from+':'+(ref.i!=null?ref.i:ref.slot||'')+':'+(cur0?cur0.id:'');
  if(lastTap&&lastTap.key===key&&now-lastTap.t<380){lastTap=null;quickMove(ref);return;}
  lastTap={key,t:now};
}
function quickMove(ref){
  const it=inventoryItem(ref);if(!it)return;
  const toBag=()=>{const i=bag.indexOf(null);if(i<0){G.say('가방이 가득 찼습니다.');return;}inventoryDrop(ref,{from:'bag',i});};
  if(ref.from==='goods'||ref.from==='stash'||ref.from==='eq'){toBag();return;}
  if(ref.from!=='bag')return;
  if(tab==='shop'){inventoryDrop(ref,{from:'merchant'});return;}
  if(tab==='stash'){const i=stash.indexOf(null);if(i<0){G.say('창고가 가득 찼습니다.');return;}inventoryDrop(ref,{from:'stash',i});return;}
  const slots=(it.kind==='weapon'?['w1','w2']:it.kind==='ring'?['ring1','ring2']:[it.kind]).filter(s=>s in eq);
  if(!slots.length)return;
  inventoryDrop(ref,{from:'eq',slot:slots.find(s=>!eq[s])||(slots.includes(cur)?cur:slots[0])});
}
addEventListener('pointercancel',cancelItemDrag);addEventListener('blur',cancelItemDrag);
function openStash(){
  const loc=G.locationState();if(!loc||!['town','village'].includes(loc.map)){G.say('창고는 마을에서만 이용할 수 있습니다.');return false;}openChar('stash');return true;
}
function renderStash(L){
  const frame=el('div','stashFrame');frame.append(el('h2','','개인 창고'),el('small','',`${stash.filter(Boolean).length} / ${STASH} · 이용료 없음`));
  const grid=el('div','stashGrid');stash.forEach((it,i)=>{const b=slotEl(it,0,0,46,46,()=>stashInfo('stash',i),false);b.style.cssText='position:relative;width:100%;height:100%';bindItemSlot(b,{from:'stash',i});grid.append(b);});frame.append(grid,sortButtons('stash'));L.append(frame);
}
function stashInfo(from,i){
  const a=from==='stash'?stash:bag,it=a[i];if(!it)return;pickSel={from,i};const I=$('iinfo');I.innerHTML='';I.append(el('div','iname',it.name),el('div','isub',`T${it.tier||1} · ${RARN[it.rar||0]}`));const b=el('button','btn',from==='bag'?'창고에 넣기':'가방으로 꺼내기');b.type='button';b.onclick=()=>{const to=from==='bag'?'stash':'bag',dest=to==='stash'?stash:bag,idx=dest.indexOf(null);if(idx<0){G.say(to==='stash'?'창고가 가득 찼습니다.':'가방이 가득 찼습니다.');return;}inventoryDrop({from,i},{from:to,i:idx});};I.append(b);I.classList.add('on');
}

window.UI = {
  addPotion(k,n){POT[k]+=n;syncPot();},
  addScroll(k,n){const had=SCR[k]|0;SCR[k]=Math.min(SCR_MAX,had+n);syncMmBtn();if($('char').classList.contains('on'))render();return SCR[k]-had;},
  scrolls:()=>({portal:SCR.portal,ident:SCR.ident}),scrollMax:SCR_MAX,
  useScroll(k){if(!(SCR[k]>0))return false;SCR[k]--;syncMmBtn();if($('char').classList.contains('on'))render();saveGame();return true;},
  make,canEquip,equip,itemStats,identify:identifyItem,identifyCost,openIdentifyVendor,identifyVendorOpen:()=>identifyVendor,UNID_MIN_AFFIXES,inventoryDrop,sortInventory,openStash,stashOpen:()=>tab==='stash'&&$('char').classList.contains('on'),stashItems:()=>stash.map((it,i)=>it?{i,it}:null).filter(Boolean),
  merchant(){openChar('shop');},bindItemSlot,addAt(it,i){if(i<0||i>=BAG||bag[i])return false;bag[i]=it;return true;},add(it){const i=bag.indexOf(null);if(i<0)return false;bag[i]=it;return true;},
  combatMods,findBonus,coinBonus,skillRank,currentWeapon:()=>eq[cur],
  quickSlots:()=>QS.slice(),assignQuick(i,id){if(i<0||i>=5||!quickLearned(id))return false;const old=QS.indexOf(id);if(old>=0)QS[old]=null;QS[i]=id;syncQS();saveGame();return true;},
  dragDebug:()=>drag?{id:drag.id,from:drag.from,moved:drag.moved}:null,quickDropIndex,
  refresh(){syncHud();if($('char').classList.contains('on'))render();},
  bagFull:()=>bag.indexOf(null)<0,
  bagItems:()=>bag.map((it,i)=>it?{i,it}:null).filter(Boolean),
  removeBagAt(i){
    if (i < 0 || i >= BAG || !bag[i]) return null;
    const it = bag[i]; bag[i] = null; pickSel = null; $('iinfo').classList.remove('on');
    if ($('char').classList.contains('on')) render();
    if (typeof saveGame === 'function') saveGame();
    return it;
  },
  isOpen: () => $('char').classList.contains('on'), close: closeChar,
};
// ---- 저장 (이 기기의 브라우저에 자동 저장: 금화·체력·레벨·가방·장비·물약·퀵슬롯) ----
const SKEY='arpg_save_v3';
try{localStorage.removeItem('arpg_save_v1');localStorage.removeItem('arpg_save_v2');}catch(e){}
let RESETTING=false;
function saveGame(){
  if(RESETTING)return;
  try{
    const P=G.P;
    localStorage.setItem(SKEY,JSON.stringify({v:3,gearSchema:TIER_MATCH.schema,t:Date.now(),name:P.name,stats:P.stats,mastery:P.mastery,skillLv:P.skillLv,passives:P.passives,lifeSkills:P.lifeSkills,
      statPts:P.statPts,skillPts:P.skillPts,lifePts:P.lifePts,portalReadyAt:P.portalReadyAt,reviveReadyAt:P.reviveReadyAt,reviveArmed:!!P.reviveArmed,reviveRank:P.reviveRank,gold:P.gold,hp:P.hp,mp:P.mp,lv:P.lv,exp:P.exp,bag,stash,eq,cur,pot:POT,scr:SCR,qs:QS,
      location:G.locationState?G.locationState():null,trade:window.TRADE?TRADE.saveData():null,guild:window.GUILD?GUILD.saveData():null,quests:window.QUEST?QUEST.saveData():null}));
  }catch(e){}
}
function loadGame(){
  let d=null;try{d=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){}
  if(!d||d.v!==3)return null;
  for(let i=0;i<BAG;i++)bag[i]=d.bag&&d.bag[i]||null;
  for(let i=0;i<STASH;i++)stash[i]=d.stash&&d.stash[i]||null;
  for(const k in eq)eq[k]=d.eq&&d.eq[k]||null;
  cur=d.cur==='w2'&&eq.w2?'w2':'w1';
  if(d.pot){POT.hp=d.pot.hp|0;POT.mp=d.pot.mp|0;}
  if(d.scr){SCR.portal=Math.max(0,Math.min(SCR_MAX,d.scr.portal|0));SCR.ident=Math.max(0,Math.min(SCR_MAX,d.scr.ident|0));}
  if(d.qs)for(let i=0;i<5;i++)QS[i]=d.qs[i]&&(d.qs[i]==='townPortal'||A.skicon[d.qs[i]])?d.qs[i]:null;
  // unid 필드가 없는 이전 저장 장비는 falsy이므로 모두 감정 완료로 취급한다.
  let mx=0;for(const it of [...bag,...stash,...Object.values(eq)])if(it&&it.id>mx)mx=it.id;seq=mx+1;
  const P=G.P;P.name=d.name||P.name||'루크레아';P.lv=d.lv||1;P.exp=d.exp||0;P.statPts=d.statPts|0;P.skillPts=d.skillPts|0;P.lifePts=d.lifePts|0;
  P.stats=Object.assign({},P.stats,d.stats||{});P.mastery=Object.assign({},P.mastery,d.mastery||{});P.skillLv=Object.assign({},P.skillLv,d.skillLv||{});
  P.lifeSkills=Object.assign({},P.lifeSkills||{},d.lifeSkills||{});P.passives=Object.assign({},P.passives||{},d.passives||{});P.portalReadyAt=+d.portalReadyAt||0;P.reviveReadyAt=+d.reviveReadyAt||0;P.reviveArmed=!!d.reviveArmed;P.reviveRank=Math.max(1,Math.min(5,+d.reviveRank||1));
  if(G.syncLifeUnlocks)G.syncLifeUnlocks(true);G.setGold(d.gold|0);if(window.TRADE)TRADE.loadData(d.trade);if(window.GUILD)GUILD.loadData(d.guild);if(window.QUEST)QUEST.loadData(d.quests);return d;
}
const saved=loadGame();
// 테스트용: 구현된 액티브 스킬을 전부 배운 상태(1랭크)로 만든다(포인트는 건드리지 않음 — 저장 검사와 충돌). 정식 시작 전에 false로 바꿀 것.
const TEST_UNLOCK_ALL_SKILLS=false;
if(TEST_UNLOCK_ALL_SKILLS){for(const id of IMPLEMENTED)if(!((G.P.skillLv||{})[id]>0)){G.P.skillLv=G.P.skillLv||{};G.P.skillLv[id]=1;}}
syncHud();syncPot();
if(saved){
  G.P.hp=Math.max(1,Math.min(G.P.maxHp,saved.hp||G.P.maxHp));G.P.mp=Math.min(G.P.maxMp,saved.mp||0);G.setMax(G.P.maxHp,G.P.maxMp);
  Promise.resolve(G.resumeLocation?G.resumeLocation(saved.location):false).then(()=>{
    G.say('이어서 합니다. 금화 '+G.P.gold+'닢 그대로!');
  });
}
setInterval(saveGame,4000);addEventListener('pagehide',saveGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
window.UI.save=saveGame;window.UI.reset=()=>{RESETTING=true;try{localStorage.removeItem(SKEY);}catch(e){}location.reload();};
// 테스트용 초기화 버튼: 두 번 눌러야 지워진다. 정식 시작 전에 false로.
const TEST_RESET_BUTTON=true;
{const b=document.getElementById('resetBtn');
 if(b&&TEST_RESET_BUTTON){b.hidden=false;let armed=false,tm=0;
  b.addEventListener('click',()=>{if(!armed){armed=true;b.textContent='정말 지울까요?';tm=setTimeout(()=>{armed=false;b.textContent='초기화';},3500);}
   else{clearTimeout(tm);window.UI.reset();}});}}
})();
